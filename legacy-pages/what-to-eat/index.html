<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#91A7B0" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1C1B20" media="(prefers-color-scheme: dark)">
    <meta name="description" content="An illustrated food menu with toddler portions and nutrition at a glance.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://mama.dev/what-to-eat/">
    <meta property="og:title" content="What to eat?">
    <meta property="og:description" content="An illustrated food menu with toddler portions and nutrition at a glance.">
    <meta property="og:image" content="https://mama.dev/what-to-eat.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="What to eat?">
    <meta name="twitter:description" content="An illustrated food menu with toddler portions and nutrition at a glance.">
    <meta name="twitter:image" content="https://mama.dev/what-to-eat.jpg">
    <link rel="canonical" href="https://mama.dev/what-to-eat/">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Paytone+One&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/mama-home-tab.css">
    <title>What to eat?</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #91A7B0;
            --tag-cream: #F7E9D1;
            --red: #E45D56;
            --blue: #2C6CB4;
            --yellow: #F9CF45;
            --green: #4BA16D;
            --text: #2D2D2D;
            --muted: #A89B84;
            --line: #D3C4AA;
            --shadow: rgba(0, 0, 0, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            padding: 40px 20px;
            background-color: var(--bg);
            background-image: radial-gradient(circle, rgba(255, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 30px 30px;
            color: var(--text);
            font-family: 'Space Mono', monospace;
        }

        .header {
            position: relative;
            margin-bottom: 60px;
            text-align: center;
        }

        .header h1 {
            margin-bottom: 10px;
            color: var(--tag-cream);
            font-family: 'Paytone One', sans-serif;
            font-size: clamp(3rem, 8vw, 5rem);
            letter-spacing: -2px;
            line-height: 0.9;
            text-shadow: 4px 4px 0 var(--red);
            text-transform: uppercase;
        }

        .header p {
            display: inline-block;
            padding: 4px 12px;
            transform: rotate(-1deg);
            background: var(--yellow);
            box-shadow: 4px 4px 0 var(--text);
            font-weight: 700;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .category-section {
            margin-bottom: 80px;
        }

        .category-title {
            display: inline-block;
            margin-bottom: 40px;
            padding: 10px 30px;
            clip-path: polygon(0 0, 95% 0, 100% 50%, 95% 100%, 0 100%);
            background: var(--text);
            box-shadow: 6px 6px 0 var(--shadow);
            color: var(--tag-cream);
            font-family: 'Paytone One', sans-serif;
            font-size: 2rem;
            text-transform: uppercase;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 40px;
            perspective: 1000px;
        }

        .food-tag {
            position: relative;
            display: flex;
            width: 100%;
            aspect-ratio: 2 / 3.2;
            flex-direction: column;
            align-items: center;
            padding-top: 40px;
            transform-origin: top center;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            clip-path: polygon(25% 0, 75% 0, 100% 15%, 100% 100%, 0 100%, 0 15%);
            border-radius: 4px 4px 0 0;
            background: var(--tag-cream);
            box-shadow: 12px 12px 0 var(--shadow);
        }

        .food-tag:hover {
            transform: rotate(2deg) scale(1.03);
        }

        .food-tag::before {
            content: '';
            position: absolute;
            z-index: 2;
            top: 15px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--bg);
            box-shadow: inset 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .string {
            position: absolute;
            z-index: -1;
            top: -40px;
            left: 50%;
            width: 2px;
            height: 60px;
            transform: translateX(-50%);
            background: var(--red);
        }

        .illu-box {
            position: relative;
            display: flex;
            width: 85%;
            aspect-ratio: 1;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
            margin-top: 10px;
            overflow: hidden;
            border-radius: 4px;
            font-size: 4rem;
        }

        .illu-box::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(white 10%, transparent 11%);
            background-size: 8px 8px;
            opacity: 0.15;
            pointer-events: none;
        }

        .food-image {
            position: relative;
            z-index: 1;
            width: 96%;
            height: 96%;
            object-fit: contain;
        }

        .type-label {
            padding: 0 10px;
            margin-top: 15px;
            color: var(--text);
            font-family: 'Paytone One', sans-serif;
            font-size: 1.1rem;
            line-height: 1.1;
            text-align: center;
            text-transform: uppercase;
        }

        .portion-label {
            max-width: calc(100% - 28px);
            margin-top: 7px;
            overflow: hidden;
            color: var(--muted);
            font-size: 0.55rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-align: center;
            text-overflow: ellipsis;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .meta-lines {
            width: 100%;
            padding: 0 20px 20px;
            margin-top: auto;
        }

        .line {
            position: relative;
            width: 100%;
            height: 1.5px;
            margin-top: 16px;
            background: var(--line);
        }

        .line::before {
            content: attr(data-label);
            position: absolute;
            top: -13px;
            left: 0;
            color: var(--muted);
            font-size: 8px;
            font-weight: 700;
            letter-spacing: 0.03em;
            white-space: nowrap;
        }

        .bg-red { background-color: var(--red); color: white; }
        .bg-blue { background-color: var(--blue); color: white; }
        .bg-yellow { background-color: var(--yellow); color: var(--text); }
        .bg-green { background-color: var(--green); color: white; }

        .loading,
        .error,
        footer {
            max-width: 700px;
            margin: 0 auto;
            color: var(--tag-cream);
            font-size: 0.75rem;
            line-height: 1.6;
            text-align: center;
        }

        .error {
            padding: 20px;
            background: var(--red);
            color: white;
            font-weight: 700;
        }

        footer {
            padding: 10px 0 30px;
        }

        footer a {
            color: inherit;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1C1B20;
                --tag-cream: #F0E8DC;
                --red: #B08EBE;
                --blue: #657BA3;
                --yellow: #D5B86C;
                --green: #6E977D;
                --text: #29262D;
                --muted: #81768D;
                --line: #B8AC99;
                --shadow: rgba(0, 0, 0, 0.32);
            }

            body {
                background-image: radial-gradient(circle, rgba(176, 142, 190, 0.16) 1px, transparent 1px);
            }

            .header h1 {
                text-shadow: 4px 4px 0 #80758F;
            }

            .string {
                background: #B08EBE;
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 28px 14px;
            }

            .header {
                margin-bottom: 50px;
            }

            .header h1 {
                font-size: clamp(2.8rem, 16vw, 4rem);
            }

            .header p {
                font-size: 0.72rem;
            }

            .category-section {
                margin-bottom: 60px;
            }

            .category-title {
                margin-bottom: 30px;
                font-size: 1.5rem;
            }

            .grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 20px;
            }

            .food-tag {
                min-height: 270px;
                padding-top: 30px;
            }

            .illu-box {
                font-size: 3rem;
            }

            .type-label {
                font-size: 0.95rem;
            }

            .meta-lines {
                padding-right: 14px;
                padding-left: 14px;
            }

            .line::before {
                font-size: 7px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .food-tag {
                transition: none;
            }

            .food-tag:hover {
                transform: none;
            }
        }
    </style>

    <!-- Privacy-friendly analytics by Plausible -->

    <script>
        window.plausible = window.plausible || function () {
            (plausible.q = plausible.q || []).push(arguments);
        };
        plausible.init = plausible.init || function (options) {
            plausible.o = options || {};
        };
        plausible.init();
    </script>
</head>
<body>
    <a class="mama-home-tab" href="/" aria-label="Back to mama.dev">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 10.5 12 3l9 7.5"></path>
            <path d="M5 10v10h14V10"></path>
            <path d="M9 20v-6h6v6"></path>
        </svg>
        <span>mama.dev</span>
    </a>

    <header class="header">
        <h1>What to eat?</h1>
        <p>TODDLER PORTIONS + NUTRITION</p>
    </header>

    <main class="container" id="menu">
        <p class="loading" id="loading">Loading the menu…</p>
    </main>

    <footer>
        Toddler portions use the guideline of about one tablespoon per year of age.
        Nutrition data from <a href="https://fdc.nal.usda.gov/" target="_blank" rel="noopener">USDA FoodData Central</a>.
    </footer>

    <noscript><p class="error">This menu needs JavaScript to load its food list.</p></noscript>

    <script>
        const sectionOrder = ['Proteins', 'Dairy', 'Fruits', 'Vegetables', 'Carbs', 'And More'];

        function makeFoodTag(food) {
            const tag = document.createElement('article');
            tag.className = 'food-tag';
            tag.setAttribute('aria-label', `${food.name}, ${food.nutrition.portion}`);

            const string = document.createElement('div');
            string.className = 'string';
            string.setAttribute('aria-hidden', 'true');

            const art = document.createElement('div');
            art.className = `illu-box bg-${food.color}`;
            const image = document.createElement('img');
            image.className = 'food-image';
            image.src = food.image;
            image.alt = '';
            image.width = 768;
            image.height = 768;
            image.loading = 'lazy';
            image.decoding = 'async';
            art.appendChild(image);

            const name = document.createElement('h3');
            name.className = 'type-label';
            name.textContent = food.name;

            const portion = document.createElement('p');
            portion.className = 'portion-label';
            portion.textContent = food.nutrition.portion;
            portion.title = food.nutrition.portion;

            const meta = document.createElement('div');
            meta.className = 'meta-lines';
            const firstLine = document.createElement('div');
            firstLine.className = 'line';
            firstLine.dataset.label = `${food.nutrition.calories} CAL · ${food.nutrition.protein}G PROTEIN`;
            const secondLine = document.createElement('div');
            secondLine.className = 'line';
            secondLine.dataset.label = `${food.nutrition.carbs}G CARBS · ${food.nutrition.fat}G FAT`;
            meta.append(firstLine, secondLine);

            tag.append(string, art, name, portion, meta);
            return tag;
        }

        function renderMenu(foods) {
            const menu = document.getElementById('menu');
            menu.replaceChildren();

            sectionOrder.forEach((sectionName) => {
                const items = foods.filter((food) => food.section === sectionName);
                if (!items.length) return;

                const section = document.createElement('section');
                section.className = 'category-section';
                const title = document.createElement('h2');
                title.className = 'category-title';
                title.textContent = sectionName;
                const grid = document.createElement('div');
                grid.className = 'grid';
                items.forEach((food) => grid.appendChild(makeFoodTag(food)));
                section.append(title, grid);
                menu.appendChild(section);
            });
        }

        fetch('foods.json', { cache: 'no-store' })
            .then((response) => {
                if (!response.ok) throw new Error(`Menu request failed: ${response.status}`);
                return response.json();
            })
            .then(renderMenu)
            .catch((error) => {
                console.error(error);
                const loading = document.getElementById('loading');
                loading.className = 'error';
                loading.textContent = 'The food list could not be loaded.';
            });
    </script>
</body>
</html>
