<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worksheets | mama.dev</title>
<meta name="description" content="Searchable printable worksheet PDFs from mama.dev, including mazes, tracing pages, and early learning activities.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-page: #f3cd68;
    --bg-dots: rgba(174, 126, 35, 0.3);
    --paper: #fbf8ef;
    --paper-raised: #fffdf7;
    --paper-soft: #f3ebdc;
    --ink: #263d4f;
    --muted: #647a8e;
    --line: rgba(38, 61, 79, 0.16);
    --line-strong: rgba(38, 61, 79, 0.28);
    --red: #c65d47;
    --mustard: #d0a14c;
    --teal: #69999c;
    --green: #788f52;
    --shadow: 0 12px 24px -12px rgba(38, 61, 79, 0.34), 0 3px 8px rgba(38, 61, 79, 0.12);
    --shadow-hover: 0 18px 34px -14px rgba(38, 61, 79, 0.44), 0 8px 16px rgba(38, 61, 79, 0.12);
    --font: "Quicksand", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  * {
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    margin: 0;
    background:
      radial-gradient(var(--bg-dots) 1px, transparent 1px),
      var(--bg-page);
    background-position: -12px -12px;
    background-size: 24px 24px;
    color: var(--ink);
    font-family: var(--font);
    line-height: 1.45;
  }

  button,
  input {
    font: inherit;
  }

  button {
    color: inherit;
  }

  .app-shell {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.16), transparent 220px),
      transparent;
  }

  .top-bar {
    display: grid;
    grid-template-columns: minmax(160px, 1fr) minmax(220px, 340px);
    gap: 18px;
    align-items: center;
    margin: calc(32px + env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) 14px max(20px, env(safe-area-inset-left));
    padding: 14px 24px;
    border-radius: 999px;
    background: rgba(251, 248, 239, 0.94);
    box-shadow: var(--shadow);
  }

  .brand-logo {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    color: var(--ink);
    font-size: clamp(1.05rem, 2.1vw, 1.5rem);
    font-weight: 700;
    letter-spacing: 0.18em;
    line-height: 1;
    text-decoration: none;
    text-transform: uppercase;
    width: max-content;
  }

  .brand-logo span:nth-child(4n+1) {
    color: var(--red);
  }

  .brand-logo span:nth-child(4n+2) {
    color: var(--ink);
  }

  .brand-logo span:nth-child(4n+3) {
    color: var(--teal);
  }

  .brand-logo span:nth-child(4n+4) {
    color: var(--mustard);
  }

  .search-icon svg,
  .button-icon,
  .empty-icon svg,
  .dialog-close svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-width: 2.2;
  }

  .search-panel {
    display: grid;
    gap: 4px;
    justify-items: stretch;
  }

  .search-box {
    position: relative;
    display: flex;
    align-items: center;
    border: 1px solid rgba(38, 61, 79, 0.18);
    border-radius: 999px;
    background: var(--paper-raised);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.75), 0 2px 7px rgba(38, 61, 79, 0.08);
  }

  .search-icon {
    position: absolute;
    left: 18px;
    color: var(--teal);
    pointer-events: none;
  }

  .search-box input {
    width: 100%;
    min-height: 40px;
    border: 0;
    border-radius: inherit;
    background: transparent;
    color: var(--ink);
    font-size: 0.84rem;
    font-weight: 700;
    outline: none;
    padding: 0 16px 0 46px;
  }

  .search-box input::placeholder {
    color: var(--muted);
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .result-summary {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    clip-path: inset(50%);
    white-space: nowrap;
  }

  .file-drawer {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  .drawer-tabs {
    display: flex;
    gap: 5px;
    overflow-x: auto;
    padding: 0 max(22px, env(safe-area-inset-right)) 0 max(22px, env(safe-area-inset-left));
    scrollbar-width: none;
  }

  .drawer-tabs::-webkit-scrollbar {
    display: none;
  }

  .tab {
    flex: 0 0 auto;
    min-width: 148px;
    border: 0;
    border-radius: 44px 44px 0 0;
    background: rgba(251, 248, 239, 0.66);
    color: var(--muted);
    cursor: pointer;
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    padding: 16px 24px 14px;
    text-transform: uppercase;
    transition: background 160ms ease, color 160ms ease, transform 160ms ease;
  }

  .tab:hover,
  .tab:focus-visible {
    background: rgba(251, 248, 239, 0.88);
    color: var(--ink);
    outline: none;
  }

  .tab.active {
    background: var(--paper);
    color: var(--red);
    transform: translateY(1px);
  }

  .drawer-content {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 292px minmax(0, 1fr);
    overflow: hidden;
    border-top: 1px solid var(--line);
    background: var(--paper);
    box-shadow: 0 -10px 28px rgba(38, 61, 79, 0.08);
  }

  .mobile-filter-row {
    display: none;
  }

  .filters-sidebar {
    min-height: 0;
    overflow-y: auto;
    border-right: 1px solid var(--line);
    background:
      linear-gradient(90deg, rgba(38, 61, 79, 0.045), transparent 80%),
      var(--paper);
    padding: 26px 24px 34px max(24px, env(safe-area-inset-left));
  }

  .filter-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 20px;
  }

  .filter-heading h2,
  .grid-title h2 {
    margin: 0;
    font-size: 1rem;
    letter-spacing: 0.09em;
    text-transform: uppercase;
  }

  .clear-btn {
    border: 0;
    background: transparent;
    color: var(--red);
    cursor: pointer;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .clear-btn:disabled {
    color: var(--muted);
    cursor: default;
    opacity: 0.5;
  }

  .filter-group {
    margin-bottom: 26px;
  }

  .filter-group h3 {
    display: flex;
    align-items: center;
    gap: 9px;
    margin: 0 0 12px;
    color: var(--teal);
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .filter-group h3::after {
    content: "";
    flex: 1;
    height: 2px;
    background: var(--line);
  }

  .filter-option {
    display: flex;
    align-items: center;
    gap: 11px;
    min-height: 32px;
    color: var(--ink);
    cursor: pointer;
    font-size: 0.94rem;
    font-weight: 700;
  }

  .filter-option + .filter-option {
    margin-top: 6px;
  }

  .filter-option input {
    appearance: none;
    width: 19px;
    height: 19px;
    flex: 0 0 auto;
    border: 2px solid var(--ink);
    border-radius: 5px;
    background: var(--paper-raised);
    cursor: pointer;
    display: grid;
    place-items: center;
  }

  .filter-option input::after {
    content: "";
    width: 8px;
    height: 11px;
    border: solid var(--paper-raised);
    border-width: 0 3px 3px 0;
    opacity: 0;
    transform: rotate(45deg) translate(-1px, -1px);
  }

  .filter-option input:checked {
    border-color: var(--red);
    background: var(--red);
  }

  .filter-option input:checked::after {
    opacity: 1;
  }

  .results-panel {
    min-width: 0;
    min-height: 0;
    overflow-y: auto;
    padding: 28px max(24px, env(safe-area-inset-right)) 42px 26px;
  }

  .grid-toolbar {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 16px;
    align-items: start;
    margin-bottom: 22px;
  }

  .grid-title p {
    margin: 7px 0 0;
    color: var(--muted);
    font-size: 0.94rem;
    font-weight: 600;
  }

  .active-chips {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 8px;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    min-height: 31px;
    border: 1px solid rgba(198, 93, 71, 0.2);
    border-radius: 999px;
    background: rgba(198, 93, 71, 0.1);
    color: var(--red);
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    padding: 0 10px;
    text-transform: uppercase;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(236px, 1fr));
    gap: 22px;
  }

  .printable-card {
    position: relative;
    min-width: 0;
    display: flex;
    flex-direction: column;
    border: 1px solid rgba(38, 61, 79, 0.08);
    background: var(--paper-raised);
    box-shadow: var(--shadow);
    transition: transform 160ms ease, box-shadow 160ms ease;
  }

  .printable-card::after {
    content: "";
    position: absolute;
    inset: 4px -4px -4px 4px;
    z-index: -1;
    background: rgba(38, 61, 79, 0.055);
  }

  .printable-card:hover {
    box-shadow: var(--shadow-hover);
    transform: translateY(-3px);
  }

  .thumb {
    position: relative;
    display: block;
    aspect-ratio: 8.5 / 11;
    overflow: hidden;
    border-bottom: 1px solid var(--line);
    background:
      linear-gradient(135deg, rgba(255, 255, 255, 0.66), transparent),
      var(--paper-soft);
  }

  .thumb.landscape {
    aspect-ratio: 4 / 3;
  }

  .thumb img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .thumb.portrait img {
    object-fit: contain;
  }

  .card-body {
    min-height: 0;
    display: flex;
    flex: 1;
    flex-direction: column;
    padding: 15px;
  }

  .card-title-row {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    justify-content: space-between;
  }

  .card-title {
    margin: 0;
    font-size: 1rem;
    font-weight: 700;
    line-height: 1.22;
  }

  .badge {
    display: inline-flex;
    min-height: 26px;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    background: rgba(105, 153, 156, 0.16);
    color: var(--teal);
    flex: 0 0 auto;
    font-size: 0.66rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    padding: 0 9px;
    text-transform: uppercase;
  }

  .card-desc {
    display: -webkit-box;
    min-height: 2.9em;
    margin: 9px 0 12px;
    overflow: hidden;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    color: var(--muted);
    font-size: 0.86rem;
    font-weight: 600;
  }

  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: auto 0 14px;
  }

  .tag {
    display: inline-flex;
    align-items: center;
    min-height: 24px;
    border-radius: 999px;
    background: rgba(208, 161, 76, 0.16);
    color: #8a651e;
    font-size: 0.66rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    padding: 0 8px;
    text-transform: uppercase;
  }

  .tag.skill {
    background: rgba(198, 93, 71, 0.12);
    color: var(--red);
  }

  .tag.fine-motor,
  .tag.prewriting {
    background: rgba(120, 143, 82, 0.16);
    color: var(--green);
  }

  .tag.visual-tracking {
    background: rgba(105, 153, 156, 0.16);
    color: var(--teal);
  }

  .tag.penmanship {
    background: rgba(198, 93, 71, 0.14);
    color: var(--red);
  }

  .tag.vocabulary {
    background: rgba(208, 161, 76, 0.18);
    color: #8a651e;
  }

  .tag.airport {
    background: rgba(105, 153, 156, 0.14);
    color: #4d7f84;
  }

  .tag.vehicles,
  .tag.trains {
    background: rgba(48, 91, 136, 0.12);
    color: #345d88;
  }

  .tag.space {
    background: rgba(111, 96, 153, 0.14);
    color: #665894;
  }

  .tag.animals,
  .tag.farm,
  .tag.ocean,
  .tag.community,
  .tag.food,
  .tag.fruit,
  .tag.vegetables,
  .tag.weather,
  .tag.rewards {
    background: rgba(208, 161, 76, 0.16);
    color: #8a651e;
  }

  .tag.cutting,
  .tag.sorting,
  .tag.habit-building {
    background: rgba(120, 143, 82, 0.16);
    color: var(--green);
  }

  .tag.counting,
  .tag.number-writing,
  .tag.numbers {
    background: rgba(111, 96, 153, 0.14);
    color: #665894;
  }

  .tag.airplanes,
  .tag.boats,
  .tag.cars,
  .tag.balloons,
  .tag.construction,
  .tag.emergency,
  .tag.words,
  .tag.hygiene {
    background: rgba(105, 153, 156, 0.14);
    color: #4d7f84;
  }

  .card-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding-top: 12px;
    border-top: 2px dotted var(--line-strong);
  }

  .action-btn,
  .download-btn {
    min-height: 38px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-decoration: none;
    text-transform: uppercase;
  }

  .download-btn {
    border-color: transparent;
    background: var(--red);
    color: var(--paper-raised);
  }

  .action-btn:hover,
  .action-btn:focus-visible,
  .download-btn:hover,
  .download-btn:focus-visible {
    outline: 3px solid rgba(105, 153, 156, 0.24);
    outline-offset: 2px;
  }

  .empty-state {
    display: none;
    min-height: 320px;
    border: 2px dashed var(--line-strong);
    background: rgba(255, 255, 255, 0.28);
    place-items: center;
    padding: 40px;
    text-align: center;
  }

  .empty-state.is-visible {
    display: grid;
  }

  .empty-icon {
    width: 54px;
    height: 54px;
    display: inline-grid;
    place-items: center;
    margin-bottom: 14px;
    border-radius: 18px;
    background: rgba(105, 153, 156, 0.14);
    color: var(--teal);
  }

  .empty-state h2 {
    margin: 0;
    font-size: 1.2rem;
  }

  .empty-state p {
    max-width: 360px;
    margin: 8px auto 0;
    color: var(--muted);
    font-weight: 600;
  }

  .preview-dialog {
    width: min(900px, calc(100vw - 28px));
    max-height: min(880px, calc(100vh - 28px));
    border: 0;
    padding: 0;
    background: transparent;
    color: var(--ink);
  }

  .preview-dialog::backdrop {
    background: rgba(21, 29, 36, 0.48);
    backdrop-filter: blur(4px);
  }

  .dialog-card {
    display: grid;
    grid-template-columns: minmax(260px, 0.92fr) minmax(260px, 1fr);
    overflow: hidden;
    border: 2px solid rgba(38, 61, 79, 0.18);
    background: var(--paper-raised);
    box-shadow: 0 26px 70px rgba(16, 26, 34, 0.32);
  }

  .dialog-preview {
    min-height: 0;
    background: var(--paper-soft);
  }

  .dialog-preview img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .dialog-info {
    display: flex;
    flex-direction: column;
    min-width: 0;
    padding: 26px;
  }

  .dialog-close {
    align-self: flex-end;
    width: 40px;
    height: 40px;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    background: transparent;
    cursor: pointer;
    color: var(--ink);
  }

  .dialog-info h2 {
    margin: 4px 0 10px;
    font-size: clamp(1.7rem, 4vw, 2.8rem);
    line-height: 1;
    text-transform: uppercase;
  }

  .dialog-info p {
    margin: 0;
    color: var(--muted);
    font-size: 1rem;
    font-weight: 600;
  }

  .detail-list {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin: 24px 0;
  }

  .detail-item {
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.34);
    padding: 10px 12px;
  }

  .detail-item span {
    display: block;
    color: var(--muted);
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .detail-item strong {
    display: block;
    margin-top: 2px;
    font-size: 0.96rem;
  }

  .dialog-download {
    min-height: 48px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    margin-top: auto;
    border-radius: 999px;
    background: var(--red);
    color: var(--paper-raised);
    font-weight: 700;
    letter-spacing: 0.08em;
    text-decoration: none;
    text-transform: uppercase;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg-page: #182536;
      --bg-dots: rgba(255, 190, 88, 0.13);
      --paper: #172131;
      --paper-raised: #202d3e;
      --paper-soft: #101824;
      --ink: #f4e7cf;
      --muted: #b5c4cf;
      --line: rgba(244, 231, 207, 0.13);
      --line-strong: rgba(244, 231, 207, 0.24);
      --red: #f38f6f;
      --mustard: #e4b85f;
      --teal: #8dc0bd;
      --green: #b9cd7d;
      --shadow: 0 14px 30px -16px rgba(0, 0, 0, 0.72), 0 3px 10px rgba(0, 0, 0, 0.36);
      --shadow-hover: 0 22px 44px -18px rgba(0, 0, 0, 0.78), 0 9px 18px rgba(0, 0, 0, 0.42);
    }

    .app-shell {
      background:
        radial-gradient(circle at 75% -10%, rgba(228, 184, 95, 0.18), transparent 34%),
        radial-gradient(circle at 8% 4%, rgba(141, 192, 189, 0.14), transparent 28%),
        transparent;
    }

    .result-summary {
      color: rgba(244, 231, 207, 0.82);
    }

    .top-bar {
      background: rgba(32, 45, 62, 0.94);
    }

    .search-box {
      border-color: rgba(244, 231, 207, 0.12);
      background: var(--paper-raised);
    }

    .tab {
      background: rgba(32, 45, 62, 0.74);
    }

    .tab:hover,
    .tab:focus-visible,
    .tab.active {
      background: var(--paper);
    }

    .tag {
      color: #f0cf80;
    }

    .tag.fine-motor,
    .tag.prewriting {
      color: #cde395;
    }

    .tag.visual-tracking,
    .tag.airport {
      color: #a8d8d5;
    }

    .tag.penmanship {
      color: #ffad91;
    }

    .tag.vocabulary,
    .tag.animals,
    .tag.farm,
    .tag.ocean,
    .tag.community,
    .tag.food,
    .tag.fruit,
    .tag.vegetables,
    .tag.weather,
    .tag.rewards {
      color: #f0cf80;
    }

    .tag.vehicles,
    .tag.trains {
      color: #a8c7ef;
    }

    .tag.space,
    .tag.counting,
    .tag.number-writing,
    .tag.numbers {
      color: #c9b8ff;
    }

    .tag.cutting,
    .tag.sorting,
    .tag.habit-building {
      color: #cde395;
    }

    .tag.airplanes,
    .tag.boats,
    .tag.cars,
    .tag.balloons,
    .tag.construction,
    .tag.emergency,
    .tag.words,
    .tag.hygiene {
      color: #a8d8d5;
    }

    .empty-state {
      background: rgba(255, 255, 255, 0.035);
    }

    .detail-item {
      background: rgba(255, 255, 255, 0.04);
    }
  }

  @media (max-width: 900px) {
    .top-bar {
      grid-template-columns: 1fr;
      gap: 12px;
      align-items: stretch;
      margin: calc(28px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 14px max(16px, env(safe-area-inset-left));
      padding: 14px 16px 16px;
      border-radius: 28px;
    }

    .drawer-tabs {
      padding-right: max(16px, env(safe-area-inset-right));
      padding-left: max(16px, env(safe-area-inset-left));
    }

    .tab {
      min-width: auto;
      border-radius: 999px;
      padding: 10px 16px;
    }

    .drawer-content {
      display: flex;
      flex-direction: column;
      overflow: visible;
      border-top: 0;
    }

    .mobile-filter-row {
      display: flex;
      gap: 10px;
      align-items: center;

    const filterGroups = [
      {
            "label": "Type",
            "key": "type",
            "values": [
                  "Maze",
                  "Tracing",
                  "Cut + Paste",
                  "Math",
                  "Language",
                  "Chart"
            ]
      },
      {
            "label": "Skill",
            "key": "skills",
            "values": [
                  "Counting",
                  "Cutting",
                  "Fine motor",
                  "Habit building",
                  "Number writing",
                  "Penmanship",
                  "Prewriting",
                  "Sorting",
                  "Visual tracking",
                  "Vocabulary"
            ]
      },
      {
            "label": "Theme",
            "key": "themes",
            "values": [
                  "Airplanes",
                  "Airport",
                  "Animals",
                  "Balloons",
                  "Boats",
                  "Cars",
                  "Community",
                  "Construction",
                  "Emergency",
                  "Farm",
                  "Food",
                  "Fruit",
                  "Hygiene",
                  "Numbers",
                  "Ocean",
                  "Rewards",
                  "Space",
                  "Trains",
                  "Vegetables",
                  "Vehicles",
                  "Weather",
                  "Words"
            ]
      }
];

    const state = {
      tab: "all",
      query: "",
      filters: new Map()
    };

    const grid = document.querySelector("#worksheet-grid");
    const searchInput = document.querySelector("#worksheet-search");
    const tabs = [...document.querySelectorAll(".tab")];
    const filterGroupsEl = document.querySelector("#filter-groups");
    const resultSummary = document.querySelector("#result-summary");
    const activeChips = document.querySelector("#active-chips");
    const emptyState = document.querySelector("#empty-state");
    const clearButtons = [...document.querySelectorAll("[data-clear]")];
    const filterToggle = document.querySelector("#filter-toggle");
    const dialog = document.querySelector("#preview-dialog");
    const dialogClose = dialog.querySelector(".dialog-close");

    const iconDownload = '<svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="M7 10l5 5 5-5"></path><path d="M12 15V3"></path></svg>';
    const iconEye = '<svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
    const shuffledWorksheets = shuffle([...worksheets]);

    function shuffle(items) {
      for (let index = items.length - 1; index > 0; index -= 1) {
        const randomIndex = Math.floor(Math.random() * (index + 1));
        [items[index], items[randomIndex]] = [items[randomIndex], items[index]];
      }
      return items;
    }

    function slug(value) {
      return value.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
    }

    function tagClass(value) {
      return `tag ${slug(value)}`;
    }

    function getValues(item, key) {
      const value = item[key];
      return Array.isArray(value) ? value : [value];
    }

    function matchesTab(item) {
      if (state.tab === "all") return true;
      if (state.tab === "cut-paste") return item.type === "Cut + Paste";
      return item.type.toLowerCase() === state.tab;
    }

    function matchesSearch(item) {
      if (!state.query) return true;
      const haystack = [
        item.title,
        item.description,
        item.type,
        ...item.skills,
        ...item.themes
      ].join(" ").toLowerCase();
      return haystack.includes(state.query);
    }

    function matchesFilters(item) {
      for (const [key, selected] of state.filters.entries()) {
        if (!selected.size) continue;
        const values = getValues(item, key).map((value) => value.toLowerCase());
        for (const option of selected) {
          if (!values.includes(option.toLowerCase())) return false;
        }
      }
      return true;
    }

    function filteredWorksheets() {
      const source = state.tab === "all" ? shuffledWorksheets : worksheets;
      return source.filter((item) => matchesTab(item) && matchesSearch(item) && matchesFilters(item));
    }

    function renderFilters() {
      filterGroupsEl.innerHTML = filterGroups.map((group) => `
        <section class="filter-group">
          <h3>${group.label}</h3>
          ${group.values.map((value) => {
            const id = `filter-${group.key}-${slug(value)}`;
            return `
              <label class="filter-option" for="${id}">
                <input id="${id}" type="checkbox" value="${value}" data-filter-key="${group.key}">
                <span>${value}</span>
              </label>
            `;
          }).join("")}
        </section>
      `).join("");
    }

    function renderCards(items) {
      grid.innerHTML = items.map((item) => {
        const tags = [...item.skills.slice(0, 2), ...item.themes.slice(0, 1)];
        return `
          <article class="printable-card">
            <div class="thumb ${item.orientation}"><img src="${item.thumbnail}" alt="Preview of ${item.title} worksheet" loading="lazy" decoding="async"></div>
            <div class="card-body">
              <div class="card-title-row">
                <h3 class="card-title">${item.title}</h3>
                <span class="badge">${item.type}</span>
              </div>
              <p class="card-desc">${item.description}</p>
              <div class="tags">
                ${tags.map((tag) => `<span class="${tagClass(tag)}">${tag}</span>`).join("")}
              </div>
              <div class="card-actions">
                <button class="action-btn" type="button" data-preview="${item.id}">${iconEye} Preview</button>
                <a class="download-btn" href="${item.file}" download>${iconDownload} PDF</a>
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    function renderChips() {
      const chips = [];
      if (state.query) chips.push(`Search: ${state.query}`);
      if (state.tab !== "all") {
        const tabLabel = tabs.find((tab) => tab.dataset.tab === state.tab)?.textContent.trim();
        if (tabLabel) chips.push(tabLabel);
      }
      for (const selected of state.filters.values()) {
        selected.forEach((value) => chips.push(value));
      }
      activeChips.innerHTML = chips.map((chip) => `<span class="chip">${chip}</span>`).join("");
      clearButtons.forEach((button) => {
        button.disabled = !chips.length;
      });
    }

    function render() {
      const items = filteredWorksheets();
      renderCards(items);
      renderChips();
      const noun = items.length === 1 ? "worksheet" : "worksheets";
      resultSummary.textContent = `${items.length} ${noun}`;
      emptyState.classList.toggle("is-visible", items.length === 0);
    }

    function openPreview(id) {
      const item = worksheets.find((worksheet) => worksheet.id === id);
      if (!item) return;
      document.querySelector("#dialog-image").src = item.thumbnail;
      document.querySelector("#dialog-image").alt = `Preview of ${item.title} worksheet`;
      document.querySelector("#dialog-badge").textContent = item.type;
      document.querySelector("#dialog-title").textContent = item.title;
      document.querySelector("#dialog-desc").textContent = item.description;
      document.querySelector("#dialog-type").textContent = item.type;
      document.querySelector("#dialog-theme").textContent = item.themes.join(", ");
      document.querySelector("#dialog-pages").textContent = `${item.pages} page${item.pages === 1 ? "" : "s"}`;
      document.querySelector("#dialog-tags").innerHTML = [...item.skills, ...item.themes].map((tag) => `<span class="${tagClass(tag)}">${tag}</span>`).join("");
      document.querySelector("#dialog-download").href = item.file;
      if (typeof dialog.showModal === "function") {
        dialog.showModal();
      }
    }

    function clearAll() {
      state.query = "";
      state.tab = "all";
      state.filters.clear();
      searchInput.value = "";
      tabs.forEach((tab) => {
        const selected = tab.dataset.tab === "all";
        tab.classList.toggle("active", selected);
        tab.setAttribute("aria-pressed", String(selected));
      });
      document.querySelectorAll("[data-filter-key]").forEach((input) => {
        input.checked = false;
      });
      document.body.classList.remove("filters-open");
      filterToggle?.setAttribute("aria-expanded", "false");
      render();
    }

    renderFilters();
    render();

    searchInput.addEventListener("input", () => {
      state.query = searchInput.value.trim().toLowerCase();
      render();
    });

    tabs.forEach((tab) => {
      tab.addEventListener("click", () => {
        state.tab = tab.dataset.tab;
        tabs.forEach((item) => {
          const selected = item === tab;
          item.classList.toggle("active", selected);
          item.setAttribute("aria-pressed", String(selected));
        });
        render();
      });
    });

    filterGroupsEl.addEventListener("change", (event) => {
      const input = event.target.closest("[data-filter-key]");
      if (!input) return;
      const key = input.dataset.filterKey;
      if (!state.filters.has(key)) state.filters.set(key, new Set());
      const selected = state.filters.get(key);
      if (input.checked) {
        selected.add(input.value);
      } else {
        selected.delete(input.value);
      }
      render();
    });

    grid.addEventListener("click", (event) => {
      const previewButton = event.target.closest("[data-preview]");
      if (previewButton) openPreview(previewButton.dataset.preview);
    });

    clearButtons.forEach((button) => button.addEventListener("click", clearAll));

    filterToggle?.addEventListener("click", () => {
      const isOpen = document.body.classList.toggle("filters-open");
      filterToggle.setAttribute("aria-expanded", String(isOpen));
    });

    dialogClose.addEventListener("click", () => dialog.close());
    dialog.addEventListener("click", (event) => {
      if (event.target === dialog) dialog.close();
    });
  </script>
