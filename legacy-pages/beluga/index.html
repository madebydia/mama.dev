lp keep the aircraft stable in pitch. Elevators along their rear edges help the pilots raise or lower the nose.","tail"],["tail-r","Right tailplane","Helps keep the aircraft balanced in flight.","A tailplane is also called a horizontal stabilizer. Left and right are named from the pilots\u2019 forward-facing viewpoint. The tailplanes work together. On the BelugaXL, extra vertical fins near their ends help with stability around the unusually large cargo body.","tail"],["elevator","Elevators","Move to raise or lower the nose.","Elevators change aerodynamic force at the tail to control pitch. Both surfaces move together in this simplified animation.","tail"],["nose-gear","Nose wheels","Support the nose and steer on the ground.","The nose landing gear has two wheels. It supports the front of the aircraft and can steer during taxiing. The gear retracts for flight.","wheels"],["gear-l","Left main wheels","Support most of the aircraft\u2019s weight.","Each main landing-gear unit has four wheels on a bogie. The main gear supports most of the aircraft\u2019s weight on the ground and absorbs landing loads.","wheels"],["gear-r","Right main wheels","Support the aircraft at takeoff and landing.","The BelugaXL has two four-wheel main landing-gear units and a two-wheel nose unit: ten wheels altogether. This model simplifies the struts, brakes and retraction machinery.","wheels"]].map(([t,e,a,n,i])=>({id:t,name:e,short:a,parent:n,category:i})),Qz=[["intake","Air intake","Guides air into the engine.","The rounded intake lip guides air smoothly toward the fan. Its shape matters throughout the aircraft\u2019s range of speeds."],["fan","Fan","Moves a large amount of air backward.","The large front fan produces much of a turbofan\u2019s thrust. Most of its airflow passes around the smaller core. The spinner covers the centre of the fan."],["nacelle","Nacelle","The outer covering around the engine.","The nacelle gives the engine a smooth outer shape and encloses the bypass airflow. Here
