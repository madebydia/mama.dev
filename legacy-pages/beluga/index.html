apture:!0}))}var wo=[["body","Cargo hold","A wide space for large aircraft parts.","The enlarged upper fuselage is the cargo hold. It carries large aircraft sections between Airbus factories. Its outline is based on Airbus drawings; the ribs and cargo supports shown here are simplified.","body"],["door","Cargo door","Opens upward to load large cargo.","The upper front cargo door opens upward. The cockpit sits below the loading opening, so large cargo can pass above the pilots. Try opening the door before looking inside.","body"],["cockpit","Cockpit","The pilots fly the aircraft from here.","The flight deck is below the main cargo opening. Pilots use instruments, controls and radios to fly the aircraft. Seats and instrument panels here are representative, not an exact flight-deck layout.","body"],["floor","Cargo floor","Supports the cargo and holds it in place.","The cargo floor and loading equipment support and secure the load. The rails and cradles in this model illustrate that job; they are not a maintenance diagram.","inside"],["cargo","Cargo","Aircraft parts travel inside the hold.","A BelugaXL can carry two A350 wings. This removable wing-shaped load is a simplified example, not a scale drawing of an A350 wing or its certified loading arrangement.","inside"],["wing-l","Left wing","Air flowing around the wing creates lift.","Air flowing around a wing produces lift. These swept wings come from the A330 family. Left and right are named from the pilots\u2019 forward-facing viewpoint.","wings"],["wing-r","Right wing","Air flowing around the wing creates lift.","Both wings share the job of lifting the aircraft. The real BelugaXL has a wingspan of about 60.3 metres. Wing sections and surface details here are simplified.","wings"],["flap-l","Left flaps","Extend for takeoff and landing at lower speeds.","Flaps extend from the trailing edge for takeoff and landing, changing wing shape to increase lift and drag. This model shows a simplified hinged movement; real flaps also travel along tracks.","wings"],["flap-r","Right flaps","Extend for takeoff and landing at lower speeds.","The flaps on both wings work together so the aircraft can take off and land at lower speeds. Look for them along the back of the wings.","wings"],["aileron-l","Left aileron","Move to roll the aircraft left or right.","Ailerons are movable surfaces near the outer trailing edge. They usually move in opposite directions to help roll the aircraft into a turn. The animation here shows the selected surface only.","wings"],["aileron-r","Right aileron","Move to roll the aircraft left or right.","An aileron changes lift on its wing to help control roll. Rolling is one part of turning an aircraft; the rudder and other controls also help coordinate the motion.","wings"],["engine-l","Left engine","Pushes air backward to move the aircraft forward.","The BelugaXL uses two Rolls-Royce Trent 700 turbofan engines. A large fan moves air rearward to produce thrust; the smaller hot core drives the fan. Look closer, then pull apart to explore the fan, coverings and simplified core modules.","engines"],["engine-r","Right engine","Pushes air backward to move the aircraft forward.","Each engine is held below a wing by a pylon. The round outer covering is the nacelle. Most air moved by a turbofan travels around the engine core.","engines"],["fin","Tail fin","Keeps the aircraft steady from side to side.","The vertical stabilizer helps the aircraft resist unwanted yaw, or swinging left and right. The moving section at its back is the rudder.","tail"],["rudder","Rudder","Moves the nose left or right.","The rudder is hinged to the vertical tail. It controls yaw and helps coordinate turns. Its movement is deliberately easy to see in this learning model.","tail"],["tail-l","Left tailplane","Helps keep the aircraft balanced in flight.","Airbus calls these horizontal tailplanes; horizontal stabilizers is also accurate. They help keep the aircraft stable in pitch. Elevators along their rear edges help the pilots raise or lower the nose.","tail"],["tail-r","Right tailplane","Helps keep the aircraft balanced in flight.","A tailplane is also called a horizontal stabilizer. Left and right are named from the pilots\u2019 forward-facing viewpoint. The tailplanes work together. On the BelugaXL, extra vertical fins near their ends help with stability around the unusually large cargo body.","tail"],["elevator","Elevators","Move to raise or lower the nose.","Elevators change aerodynamic force at the tail to control pitch. Both surfaces move together in this simplified animation.","tail"],["nose-gear","Nose wheels","Support the nose and steer on the ground.","The nose landing gear has two wheels. It supports the front of the aircraft and can steer during taxiing. The gear retracts for flight.","wheels"],["gear-l","Left main wheels","Support most of the aircraft\u2019s weight.","Each main landing-gear unit has four wheels on a bogie. The main gear supports most of the aircraft\u2019s weight on the ground and absorbs landing loads.","wheels"],["gear-r","Right main wheels","Support the aircraft at takeoff and landing.","The BelugaXL has two four-wheel main landing-gear units and a two-wheel nose unit: ten wheels altogether. This model simplifies the struts, brakes and retraction machinery.","wheels"]].map(([t,e,n,a,i])=>({id:t,name:e,short:n,parent:a,category:i})),Zz=[["intake","Air intake","Guides air into the engine.","The rounded intake lip guides air smoothly toward the fan. Its shape matters throughout the aircraft\u2019s range of speeds."],["fan","Fan","Moves a large amount of air backward.","The large front fan produces much of a turbofan\u2019s thrust. Most of its airflow passes around the smaller core. The spinner covers the centre of the fan."],["nacelle","Nacelle","The outer covering around the engine.","The nacelle gives the engine a smooth outer shape and encloses the bypass airflow. Here the covering lifts away as one piece so the core is visible."],["c
