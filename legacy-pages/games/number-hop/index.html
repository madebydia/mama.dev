<style>
  :root { --ink: #24404a; --muted: #4a6a74; --panel: #eef8f4; }

  .streak-bar { display: flex; gap: 5px; margin-top: 6px; justify-content: flex-end; }
  .streak-dot { width: 15px; height: 15px; border-radius: 50%; background: rgba(255,255,255,0.45); transition: background .3s, transform .3s; }

    cursor: pointer; backdrop-filter: blur(4px);

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>

<canvas id="scene"></canvas>

<div class="ui">
  <div class="top">
    <div class="toprow">
      <div>
        <div class="score-bar"><span class="trophy">🐸</span><span class="score-num" id="score">0</span></div>
        <div class="streak-bar" id="streak-bar"></div>
      </div>
    </div>
    <div class="prompt" id="prompt">Tap the number after <b>3</b>!</div>
  </div>
  <div class="dock">
    <button class="ctl-btn" id="speakBtn" aria-label="Say it again">🔊</button>
    <div class="level-badge" id="level-badge" onclick="toggleLevelPicker()"></div>
  </div>
</div>
<div class="level-picker" id="level-picker"></div>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   CONFIG
   ============================================================ */
const LEVELS = [
  { name: 'One More',  kind: 'after' },
  { name: 'One Less',  kind: 'before' },
  { name: 'In Between', kind: 'between' },
  { name: 'Two More',  kind: 'twomore' },
];
const N_PADS = 10;

let score = 0, level = 0, streak = 0, roundHistory = [];
let frogAt = 0, target = 0, locked = false, promptText = '';

const scoreEl = document.getElementById('score');
const streakBar = document.getElementById('streak-bar');
const promptEl = document.getElementById('prompt');
const levelBadge = document.getElementById('level-badge');
for (let i = 0; i < 5; i++) { const d = document.createElement('div'); d.className = 'streak-dot'; streakBar.appendChild(d); }

/* ============================================================
   AUDIO
   ============================================================ */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function tone(freq, dur, type = 'sine', vol = 0.2) {
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination); o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.start(); o.stop(audioCtx.currentTime + dur);
}
function ribbit() { tone(160, 0.1, 'square', 0.12); setTimeout(() => tone(120, 0.14, 'square', 0.12), 110); }
function successSound() { [523, 659, 784].forEach((f, i) => setTimeout(() => tone(f, 0.32, 'sine', 0.22), i * 100)); }
function boop() { tone(190, 0.18, 'sine', 0.2); }
function speak(text) { if (!('speechSynthesis' in window)) return; try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.rate = 0.9; u.pitch = 1.15; speechSynthesis.speak(u); } catch (e) {} }

/* ============================================================
   THREE.JS SCENE — pond
   ============================================================ */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xbfdce8, 26, 60);
function skyTexture() {
  const cv = document.createElement('canvas'); cv.width = 16; cv.height = 256;
  const ctx = cv.getContext('2d'); const g = ctx.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, '#9fcfe4'); g.addColorStop(0.6, '#c4e4ec'); g.addColorStop(1, '#e0f2ec');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 16, 256);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t;
}
scene.background = skyTexture();

const camera = new THREE.PerspectiveCamera(46, 1, 0.1, 100);
const camTarget = new THREE.Vector3(0, 0.7, 0);
const camDir = new THREE.Vector3(0, 0.46, 0.89).normalize();

scene.add(new THREE.HemisphereLight(0xf0f8f4, 0x4a7a8a, 1.0));
const sun = new THREE.DirectionalLight(0xfff4dc, 0.95);
sun.position.set(-6, 12, 7); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -12; sun.shadow.camera.right = 12; sun.shadow.camera.top = 12; sun.shadow.camera.bottom = -12;
sun.shadow.bias = -0.0004;
scene.add(sun);

// Water
const water = new THREE.Mesh(new THREE.PlaneGeometry(160, 90), new THREE.MeshStandardMaterial({ color: 0x5f9ec7, roughness: 0.8 }));
water.rotation.x = -Math.PI / 2; water.receiveShadow = true; scene.add(water);

// Banks (front and back grass strips)
const bankMat = new THREE.MeshStandardMaterial({ color: 0x74ab58, roughness: 1 });
const backBank = new THREE.Mesh(new THREE.PlaneGeometry(160, 24), bankMat);
backBank.rotation.x = -Math.PI / 2; backBank.position.set(0, 0.02, -16); backBank.receiveShadow = true; scene.add(backBank);
const frontBank = new THREE.Mesh(new THREE.PlaneGeometry(160, 14), bankMat);
frontBank.rotation.x = -Math.PI / 2; frontBank.position.set(0, 0.02, 11.5); frontBank.receiveShadow = true; scene.add(frontBank);

// Cattails on the back bank
const stemMat = new THREE.MeshStandardMaterial({ color: 0x5a8a4a, roughness: 1 });
const tipMat = new THREE.MeshStandardMaterial({ color: 0x7a5230, roughness: 1 });
for (let i = 0; i < 12; i++) {
  const x = -14 + Math.random() * 28, z = -5.5 - Math.random() * 4;
  const h = 1.2 + Math.random() * 0.9;
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.04, h, 6), stemMat);
  stem.position.set(x, h / 2, z); scene.add(stem);
  const tip = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.4, 8), tipMat);
  tip.position.set(x, h + 0.15, z); scene.add(tip);
}
// Decorative lily flowers
const petalMat = new THREE.MeshStandardMaterial({ color: 0xf0c8d8, roughness: 0.8 });
[[-8, 3.2], [7.5, 3.6], [11, -3.5]].forEach(([x, z]) => {
  const f = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.35, 6), petalMat); f.position.set(x, 0.2, z); scene.add(f);
});

/* ---- Number textures + lily pads ---- */
function numberTexture(n, highlight) {
  const S = 256; const cv = document.createElement('canvas'); cv.width = cv.height = S; const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, S, S);
  ctx.fillStyle = highlight ? '#f4e8b0' : '#eef8e4';
  ctx.beginPath(); ctx.arc(S / 2, S / 2, 104, 0, Math.PI * 2); ctx.fill();
  ctx.lineWidth = 10; ctx.strokeStyle = '#3a6a34'; ctx.stroke();
  ctx.fillStyle = '#24404a'; ctx.font = '900 118px ui-rounded, Arial, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(String(n), S / 2, S / 2 + 8);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
}
const pads = [];
const PAD_SPACING = 1.55;
for (let i = 0; i < N_PADS; i++) {
  const g = new THREE.Group();
  const pad = new THREE.Mesh(new THREE.CylinderGeometry(0.66, 0.6, 0.14, 22), new THREE.MeshStandardMaterial({ color: 0x6fae5a, roughness: 0.9 }));
  pad.castShadow = true; pad.receiveShadow = true; g.add(pad);
  const numMat = new THREE.MeshBasicMaterial({ map: numberTexture(i + 1, false), transparent: true });
  const label = new THREE.Mesh(new THREE.CircleGeometry(0.5, 24), numMat);
  label.rotation.x = -Math.PI / 2; label.position.y = 0.09; g.add(label);
  g.position.set((i - (N_PADS - 1) / 2) * PAD_SPACING, 0.16, 0);
  g.userData = { numMat, baseY: 0.16, phase: Math.random() * 6, shakeUntil: 0 };
  scene.add(g);
  pads.push(g);
}
function padX(n) { return (n - 1 - (N_PADS - 1) / 2) * PAD_SPACING; }

/* ---- Frog ---- */
const frog = new THREE.Group();
const frogMat = new THREE.MeshStandardMaterial({ color: 0x6fbf5a, roughness: 0.8 });
const fBody = new THREE.Mesh(new THREE.SphereGeometry(0.42, 18, 14), frogMat);
fBody.scale.set(1.05, 0.8, 1.0); fBody.position.y = 0.34; fBody.castShadow = true; frog.add(fBody);
const fHead = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 12), frogMat);
fHead.position.set(0, 0.62, 0.18); fHead.castShadow = true; frog.add(fHead);
for (const dx of [-0.15, 0.15]) {
  const eye = new THREE.Mesh(new THREE.SphereGeometry(0.11, 10, 8), new THREE.MeshStandardMaterial({ color: 0xf4f8e8 }));
  eye.position.set(dx, 0.84, 0.24); frog.add(eye);
  const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 6), new THREE.MeshStandardMaterial({ color: 0x1f2a1a }));
  pupil.position.set(dx, 0.85, 0.33); frog.add(pupil);
}
for (const dx of [-0.32, 0.32]) {
  const leg = new THREE.Mesh(new THREE.SphereGeometry(0.16, 10, 8), frogMat);
  leg.scale.set(1.2, 0.6, 1.3); leg.position.set(dx, 0.14, 0.1); frog.add(leg);
}
scene.add(frog);
let hop = null; // {fromX, toX, t0, dur}
function placeFrog(n) { frog.position.set(padX(n), 0.24, 0); }
function hopTo(n, done) {
  hop = { fromX: frog.position.x, toX: padX(n), t: 0, dur: 0.55 + Math.abs(padX(n) - frog.position.x) * 0.04, done };
  ribbit();
}

/* ============================================================
   HELPERS
   ============================================================ */
function randInt(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
function updateStreakBar() {
  const dots = streakBar.querySelectorAll('.streak-dot');
  const recent = roundHistory.slice(-5);
  dots.forEach((d, i) => { d.className = 'streak-dot'; if (i < recent.length) d.classList.add(recent[i] ? 'lit' : 'miss'); });
}
function confetti() {
  const colors = ['#4fbf6a', '#f0c8d8', '#6fae5a', '#f4e8b0', '#5f9ec7'];
  for (let i = 0; i < 40; i++) { const c = document.createElement('div'); c.className = 'confetti-piece';
    c.style.left = Math.random() * 100 + 'vw'; c.style.top = '-10px'; c.style.background = colors[Math.random() * colors.length | 0];
    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px'; c.style.width = (6 + Math.random() * 8) + 'px'; c.style.height = (6 + Math.random() * 8) + 'px';
    c.style.animation = `confetti-fall ${1.5 + Math.random() * 2}s ease-out forwards`; c.style.animationDelay = Math.random() * 0.5 + 's';
    document.body.appendChild(c); setTimeout(() => c.remove(), 4000);
  }
}
function sparkleBurst() {
  const e = ['✨', '⭐', '💫', '🌟']; const cx = innerWidth / 2, cy = innerHeight * 0.5;
  for (let i = 0; i < 10; i++) { const s = document.createElement('div'); s.className = 'sparkle'; s.textContent = e[Math.floor(Math.random() * e.length)];
    s.style.left = (cx + (Math.random() - 0.5) * 320) + 'px'; s.style.top = (cy + (Math.random() - 0.5) * 120) + 'px'; s.style.animationDelay = (Math.random() * 0.2) + 's';
    document.body.appendChild(s); setTimeout(() => s.remove(), 1300);
  }
}

/* ============================================================
   ROUND FLOW
   ============================================================ */
function speakPrompt() { speak(promptText); }

function newRound() {
  locked = false;
  const kind = LEVELS[level].kind;
  if (kind === 'after') { frogAt = randInt(1, 9); target = frogAt + 1; promptText = 'Tap the number that comes after ' + frogAt + '!'; promptEl.innerHTML = 'Tap the number after <b>' + frogAt + '</b>!'; }
  else if (kind === 'before') { frogAt = randInt(2, 10); target = frogAt - 1; promptText = 'Tap the number that comes before ' + frogAt + '!'; promptEl.innerHTML = 'Tap the number before <b>' + frogAt + '</b>!'; }
  else if (kind === 'between') { frogAt = randInt(1, 8); target = frogAt + 1; promptText = 'Tap the number between ' + frogAt + ' and ' + (frogAt + 2) + '!'; promptEl.innerHTML = 'What is between <b>' + frogAt + '</b> and <b>' + (frogAt + 2) + '</b>?'; }
  else { frogAt = randInt(1, 8); target = frogAt + 2; promptText = 'Two hops! Tap the number that is two after ' + frogAt + '!'; promptEl.innerHTML = 'Two after <b>' + frogAt + '</b>?'; }
  placeFrog(frogAt);
  levelBadge.textContent = LEVELS[level].name;
  setTimeout(speakPrompt, 400);
}

function tapPad(i) {
  if (locked) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const n = i + 1;
  if (n === target) {
    locked = true;
    score++; streak++; scoreEl.textContent = score;
    roundHistory.push(true);
    if (streak > 0 && streak % 5 === 0 && level < LEVELS.length - 1) level++;
    if (roundHistory.length > 5) roundHistory = [roundHistory[roundHistory.length - 1]];
    updateStreakBar();
    hopTo(n, () => {
      speak(String(target) + '! Great hop!');
      successSound(); confetti(); sparkleBurst();
      setTimeout(newRound, 2000);
    });
  } else {
    pads[i].userData.shakeUntil = clock.getElapsedTime() + 0.45;
    boop();
    streak = 0; roundHistory.push(false);
    if (roundHistory.length > 5) roundHistory = [roundHistory[roundHistory.length - 1]];
    updateStreakBar();
  }
}

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
canvas.addEventListener('pointerdown', (e) => {
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  for (let i = 0; i < pads.length; i++) {
    if (raycaster.intersectObject(pads[i], true).length) { tapPad(i); break; }
  }
});
document.getElementById('speakBtn').addEventListener('click', () => { if (audioCtx.state === 'suspended') audioCtx.resume(); speakPrompt(); });

/* ============================================================
   RENDER LOOP
   ============================================================ */
const clock = new THREE.Clock();
function frameScene() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  const aspect = w / h; camera.aspect = aspect;
  const vHalf = THREE.MathUtils.degToRad(camera.fov / 2);
  const hHalf = Math.atan(Math.tan(vHalf) * aspect);
  const dist = Math.min(30, Math.max(9, Math.max(8.2 / Math.tan(hHalf), 3.0 / Math.tan(vHalf))));
  camera.position.copy(camTarget).add(camDir.clone().multiplyScalar(dist));
  camera.lookAt(camTarget);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', frameScene);

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.getElapsedTime();

  // pads gentle bob + shake
  for (const p of pads) {
    const u = p.userData;
    let x0 = p.position.x;
    p.position.y = u.baseY + Math.sin(t * 1.1 + u.phase) * 0.03;
    if (t < u.shakeUntil) p.rotation.z = Math.sin((u.shakeUntil - t) * 40) * 0.08; else p.rotation.z = 0;
  }

  // frog hop
  if (hop) {
    hop.t += dt;
    const p = Math.min(1, hop.t / hop.dur);
    const e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
    frog.position.x = hop.fromX + (hop.toX - hop.fromX) * e;
    frog.position.y = 0.24 + Math.sin(p * Math.PI) * 1.15;
    if (p >= 1) { const d = hop.done; hop = null; frog.position.y = 0.24; d && d(); }
  } else {
    frog.position.y = 0.24 + Math.abs(Math.sin(t * 2.2)) * 0.04;
  }

  renderer.render(scene, camera);
}

/* ============================================================
   LEVEL PICKER
   ============================================================ */
window.toggleLevelPicker = function () {
  const p = document.getElementById('level-picker');
  if (p.classList.contains('open')) { p.classList.remove('open'); return; }
  p.innerHTML = '';
  LEVELS.forEach((lv, i) => {
    const o = document.createElement('div'); o.className = 'level-option' + (i === level ? ' active' : '');
    o.innerHTML = '<span>' + lv.name + '</span><span class="level-range">1–10</span>';
    o.onclick = (e) => { e.stopPropagation(); level = i; streak = 0; roundHistory = []; updateStreakBar(); p.classList.remove('open'); newRound(); };
    p.appendChild(o);
  });
  p.classList.add('open');
};
document.addEventListener('click', (e) => { if (!e.target.closest('.level-picker') && !e.target.closest('.level-badge')) document.getElementById('level-picker').classList.remove('open'); });

// Start
frameScene();
newRound();
animate();
</script>
</body>
