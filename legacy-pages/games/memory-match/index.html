<body>

<canvas id="scene"></canvas>

<div class="ui">
  <div class="top">
    <div class="toprow">
      <div>
        <div class="score-bar"><span class="trophy">🧠</span><span class="score-num" id="score">0</span></div>
        <div class="streak-bar" id="streak-bar"></div>
      </div>

    <div class="prompt" id="prompt">Find the <b>matching pairs</b>!</div>
  </div>

  </div>
</div>
<div class="level-picker" id="level-picker"></div>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   CONFIG
   ============================================================ */
const LEVELS = [
  { name: 'Two Pairs',   pairs: 2, cols: 2, rows: 2 },
  { name: 'Three Pairs', pairs: 3, cols: 3, rows: 2 },
  { name: 'Six Pairs',   pairs: 6, cols: 4, rows: 3 },
  { name: 'Eight Pairs', pairs: 8, cols: 4, rows: 4 },
];
const EMOJIS = ['🍎', '⭐', '🐟', '🌙', '🥕', '🐰', '🚂', '🎈', '🐢', '🌸', '🍌', '🦆'];

let score = 0, level = 0, streak = 0, roundHistory = [];
let cards = [], firstPick = -1, resolving = false, matchedCount = 0, boardLocked = false;

const scoreEl = document.getElementById('score');
const streakBar = document.getElementById('streak-bar');
const promptEl = document.getElementById('prompt');
const levelBadge = document.getElementById('level-badge');
for (let i = 0; i < 5; i++) { const d = document.createElement('div'); d.className = 'streak-dot'; streakBar.appendChild(d); }

/* ============================================================
   AUDIO
   ============================================================ */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function tone(freq, dur, type = 'sine', vol = 0.2) {
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination); o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.start(); o.stop(audioCtx.currentTime + dur);
}
function flipSound() { tone(480, 0.1, 'triangle', 0.18); }
function matchSound() { tone(659, 0.2, 'sine', 0.22); setTimeout(() => tone(880, 0.3, 'sine', 0.22), 130); }
function successSound() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 0.3, 'sine', 0.2), i * 95)); }
function boop() { tone(190, 0.18, 'sine', 0.18); }
function speak(text) { if (!('speechSynthesis' in window)) return; try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.rate = 0.9; u.pitch = 1.15; speechSynthesis.speak(u); } catch (e) {} }

/* ============================================================
   THREE.JS SCENE — picnic
   ============================================================ */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xbcd8a8, 24, 56);
function skyTexture() {
  const cv = document.createElement('canvas'); cv.width = 16; cv.height = 256;
  const ctx = cv.getContext('2d'); const g = ctx.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, '#a8d0e0'); g.addColorStop(0.55, '#c4dcb8'); g.addColorStop(1, '#d8e8c0');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 16, 256);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t;
}
scene.background = skyTexture();

const camera = new THREE.PerspectiveCamera(46, 1, 0.1, 100);
const camTarget = new THREE.Vector3(0, 0, 0.2);
const camDir = new THREE.Vector3(0, 0.82, 0.57).normalize();

scene.add(new THREE.HemisphereLight(0xf4f8ec, 0x5a8a4a, 1.05));
const sun = new THREE.DirectionalLight(0xfff4dc, 0.9);
sun.position.set(-5, 12, 6); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -8; sun.shadow.camera.right = 8; sun.shadow.camera.top = 8; sun.shadow.camera.bottom = -8;
sun.shadow.bias = -0.0004;
scene.add(sun);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(120, 80), new THREE.MeshStandardMaterial({ color: 0x8fc46a, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.02; ground.receiveShadow = true; scene.add(ground);

// Checkered picnic blanket
function blanketTexture() {
  const cv = document.createElement('canvas'); cv.width = cv.height = 256;
  const ctx = cv.getContext('2d');
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {
    ctx.fillStyle = (x + y) % 2 ? '#d9645f' : '#f4ece0';
    ctx.fillRect(x * 32, y * 32, 32, 32);
  }
  ctx.strokeStyle = 'rgba(120,40,36,0.25)'; ctx.lineWidth = 2;
  for (let i = 0; i <= 8; i++) { ctx.beginPath(); ctx.moveTo(i * 32, 0); ctx.lineTo(i * 32, 256); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, i * 32); ctx.lineTo(256, i * 32); ctx.stroke(); }
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(2, 2); return t;
}
const blanket = new THREE.Mesh(new THREE.PlaneGeometry(8.4, 8.4), new THREE.MeshStandardMaterial({ map: blanketTexture(), roughness: 0.95 }));
blanket.rotation.x = -Math.PI / 2; blanket.position.set(0, 0, 0.2); blanket.receiveShadow = true; scene.add(blanket);

// Picnic basket + apple props
const basket = new THREE.Group();
const bMat = new THREE.MeshStandardMaterial({ color: 0xa8804c, roughness: 0.9 });
const bBody = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.42, 0.55, 14), bMat); bBody.position.y = 0.28; bBody.castShadow = true; basket.add(bBody);
const bHandle = new THREE.Mesh(new THREE.TorusGeometry(0.4, 0.05, 8, 16, Math.PI), bMat); bHandle.position.y = 0.55; basket.add(bHandle);
basket.position.set(-4.6, 0, -2.4); scene.add(basket);
const appleProp = new THREE.Mesh(new THREE.SphereGeometry(0.2, 12, 10), new THREE.MeshStandardMaterial({ color: 0xcf4a3e, roughness: 0.5 }));
appleProp.position.set(-4.0, 0.2, -1.7); appleProp.castShadow = true; scene.add(appleProp);
// A shade tree in the back
const treeTrunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.42, 2.6, 10), new THREE.MeshStandardMaterial({ color: 0x7a5a34, roughness: 1 }));
treeTrunk.position.set(6, 1.3, -6); treeTrunk.castShadow = true; scene.add(treeTrunk);
const treeFol = new THREE.MeshStandardMaterial({ color: 0x5f9a4a, roughness: 1 });
[[6, 3.6, -6, 1.8], [4.8, 3.1, -6.3, 1.2], [7.2, 3.2, -5.8, 1.3]].forEach(([x, y, z, r]) => {
  const f = new THREE.Mesh(new THREE.SphereGeometry(r, 14, 12), treeFol); f.position.set(x, y, z); f.castShadow = true; scene.add(f);
});

/* ---- Card textures ---- */
function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function faceTexture(emoji) {
  const S = 256; const cv = document.createElement('canvas'); cv.width = cv.height = S; const ctx = cv.getContext('2d');
  ctx.fillStyle = '#fbf5e4'; ctx.fillRect(0, 0, S, S);
  ctx.strokeStyle = '#c8b48a'; ctx.lineWidth = 14; roundRect(ctx, 10, 10, S - 20, S - 20, 26); ctx.stroke();
  ctx.font = '150px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(emoji, S / 2, S / 2 + 12);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  t.center.set(0.5, 0.5);
  return t;
}
function backTexture() {
  const S = 256; const cv = document.createElement('canvas'); cv.width = cv.height = S; const ctx = cv.getContext('2d');
  ctx.fillStyle = '#6a9ad0'; ctx.fillRect(0, 0, S, S);
  ctx.fillStyle = '#84aede';
  for (let y = 0; y < 6; y++) for (let x = 0; x < 6; x++) if ((x + y) % 2 === 0) { ctx.beginPath(); ctx.arc(21 + x * 43, 21 + y * 43, 10, 0, Math.PI * 2); ctx.fill(); }
  ctx.strokeStyle = '#f4ece0'; ctx.lineWidth = 12; roundRect(ctx, 8, 8, S - 16, S - 16, 24); ctx.stroke();
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
}
const backTex = backTexture();
const edgeMat = new THREE.MeshStandardMaterial({ color: 0xe8dcc0, roughness: 0.7 });
const backMat = new THREE.MeshStandardMaterial({ map: backTex, roughness: 0.7 });

/* ============================================================
   BOARD
   ============================================================ */
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function updateStreakBar() {
  const dots = streakBar.querySelectorAll('.streak-dot');
  const recent = roundHistory.slice(-5);
  dots.forEach((d, i) => { d.className = 'streak-dot'; if (i < recent.length) d.classList.add(recent[i] ? 'lit' : 'miss'); });
}
function confetti() {
  const colors = ['#d9645f', '#6a9ad0', '#e8b84a', '#7ab86a', '#f4ece0'];
  for (let i = 0; i < 40; i++) { const c = document.createElement('div'); c.className = 'confetti-piece';
    c.style.left = Math.random() * 100 + 'vw'; c.style.top = '-10px'; c.style.background = colors[Math.random() * colors.length | 0];
    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px'; c.style.width = (6 + Math.random() * 8) + 'px'; c.style.height = (6 + Math.random() * 8) + 'px';
    c.style.animation = `confetti-fall ${1.5 + Math.random() * 2}s ease-out forwards`; c.style.animationDelay = Math.random() * 0.5 + 's';
    document.body.appendChild(c); setTimeout(() => c.remove(), 4000);
  }
}
function sparkleBurst() {
  const e = ['✨', '⭐', '💫', '🌟']; const cx = innerWidth / 2, cy = innerHeight * 0.5;
  for (let i = 0; i < 10; i++) { const s = document.createElement('div'); s.className = 'sparkle'; s.textContent = e[Math.floor(Math.random() * e.length)];
    s.style.left = (cx + (Math.random() - 0.5) * 320) + 'px'; s.style.top = (cy + (Math.random() - 0.5) * 120) + 'px'; s.style.animationDelay = (Math.random() * 0.2) + 's';
    document.body.appendChild(s); setTimeout(() => s.remove(), 1300);
  }
}

function clearBoard() {
  for (const c of cards) {
    scene.remove(c.group);
    c.faceMat.map.dispose(); c.faceMat.dispose();
  }
  cards = [];
}

function newBoard() {
  clearBoard();
  firstPick = -1; resolving = false; matchedCount = 0; boardLocked = true;
  const lv = LEVELS[level];
  const emojis = shuffle([...EMOJIS]).slice(0, lv.pairs);
  const deck = shuffle([...emojis, ...emojis]);
  const SX = 1.35, SZ = 1.75;
  for (let i = 0; i < deck.length; i++) {
    const col = i % lv.cols, row = Math.floor(i / lv.cols);
    const group = new THREE.Group();
    const faceMat = new THREE.MeshStandardMaterial({ map: faceTexture(deck[i]), roughness: 0.7 });
    // Box faces: +x,-x,+y,-y,+z,-z — back on top (+y) while face-down, face beneath (-y)
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.07, 1.4), [edgeMat, edgeMat, backMat, faceMat, edgeMat, edgeMat]);
    mesh.castShadow = true;
    group.add(mesh);
    group.position.set((col - (lv.cols - 1) / 2) * SX, 0.09, (row - (lv.rows - 1) / 2) * SZ + 0.2);
    group.userData = { emoji: deck[i], state: 'down', flip: null, baseY: 0.09, popUntil: 0 };
    scene.add(group);
    cards.push({ group, faceMat, emoji: deck[i] });
  }
  promptEl.innerHTML = 'Find the <b>matching pairs</b>!';
  levelBadge.textContent = lv.name;
  frameScene();
  // brief peek at the start for little players: flip all up, then down
  setTimeout(() => { boardLocked = false; }, 400);
}

function startFlip(i, up) {
  const c = cards[i];
  c.group.userData.state = up ? 'flipping-up' : 'flipping-down';
  c.group.userData.flip = { t: 0, dur: 0.35, up };
  flipSound();
}

function tapCard(i) {
  if (boardLocked || resolving) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const c = cards[i];
  if (c.group.userData.state !== 'down') return;
  startFlip(i, true);
  if (firstPick === -1) { firstPick = i; return; }
  const j = firstPick; firstPick = -1;
  resolving = true;
  setTimeout(() => {
    if (cards[i].emoji === cards[j].emoji) {
      cards[i].group.userData.state = 'matched';
      cards[j].group.userData.state = 'matched';
      const now = clock.getElapsedTime();
      cards[i].group.userData.popUntil = now + 0.6;
      cards[j].group.userData.popUntil = now + 0.7;
      matchedCount++;
      score++; scoreEl.textContent = score;
      matchSound();
      resolving = false;
      if (matchedCount === LEVELS[level].pairs) {
        boardLocked = true;
        streak++; roundHistory.push(true);
        if (roundHistory.length > 5) roundHistory = [roundHistory[roundHistory.length - 1]];
        updateStreakBar();
        if (level < LEVELS.length - 1) level++;
        promptEl.innerHTML = 'You found them <b>all</b>! 🎉';
        speak('You found them all!');
        successSound(); confetti(); sparkleBurst();
        setTimeout(newBoard, 2600);
      }
    } else {
      boop();
      startFlip(i, false);
      startFlip(j, false);
      setTimeout(() => { resolving = false; }, 380);
    }
  }, 650);
}

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
canvas.addEventListener('pointerdown', (e) => {
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  for (let i = 0; i < cards.length; i++) {
    if (raycaster.intersectObject(cards[i].group, true).length) { tapCard(i); break; }
  }
});

/* ============================================================
   RENDER LOOP
   ============================================================ */
const clock = new THREE.Clock();
function frameScene() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  const aspect = w / h; camera.aspect = aspect;
  const lv = LEVELS[level];
  const halfW = (lv.cols * 1.35) / 2 + 1.2;
  const halfH = (lv.rows * 1.75) / 2 + 1.6;
  const vHalf = THREE.MathUtils.degToRad(camera.fov / 2);
  const hHalf = Math.atan(Math.tan(vHalf) * aspect);
  const dist = Math.min(28, Math.max(7, Math.max(halfW / Math.tan(hHalf), halfH / Math.tan(vHalf))));
  camera.position.copy(camTarget).add(camDir.clone().multiplyScalar(dist));
  camera.lookAt(camTarget);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', frameScene);

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.getElapsedTime();
  for (const c of cards) {
    const u = c.group.userData;
    if (u.flip) {
      u.flip.t += dt;
      const p = Math.min(1, u.flip.t / u.flip.dur);
      const e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
      c.group.rotation.x = u.flip.up ? Math.PI * e : Math.PI * (1 - e);
      c.group.position.y = u.baseY + Math.sin(p * Math.PI) * 0.55;
      if (p >= 1) {
        c.group.rotation.x = u.flip.up ? Math.PI : 0;
        c.group.position.y = u.baseY;
        if (u.state === 'flipping-up') u.state = 'up';
        if (u.state === 'flipping-down') u.state = 'down';
        u.flip = null;
      }
    } else if (u.state === 'matched') {
      let y = u.baseY + 0.05 + Math.sin(t * 2 + c.group.position.x) * 0.03;
      if (t < u.popUntil) y += Math.abs(Math.sin((u.popUntil - t) * 10)) * 0.3;
      c.group.position.y = y;
    }
  }
  renderer.render(scene, camera);
}

/* ============================================================
   LEVEL PICKER
   ============================================================ */
window.toggleLevelPicker = function () {
  const p = document.getElementById('level-picker');
  if (p.classList.contains('open')) { p.classList.remove('open'); return; }
  p.innerHTML = '';
  LEVELS.forEach((lv, i) => {
    const o = document.createElement('div'); o.className = 'level-option' + (i === level ? ' active' : '');
    o.innerHTML = '<span>' + lv.name + '</span><span class="level-range">' + lv.cols + '×' + lv.rows + '</span>';
    o.onclick = (e) => { e.stopPropagation(); level = i; streak = 0; roundHistory = []; updateStreakBar(); p.classList.remove('open'); newBoard(); };
    p.appendChild(o);
  });
  p.classList.add('open');
};
document.addEventListener('click', (e) => { if (!e.target.closest('.level-picker') && !e.target.closest('.level-badge')) document.getElementById('level-picker').classList.remove('open'); });

// Start
frameScene();
newBoard();
animate();
</script>
</body>
