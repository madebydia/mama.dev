<script type="module">
import * as THREE from 'three';

/* ============================================================
   CONFIG
   ============================================================ */
const LEVELS = [
  { name: 'AB Patterns',  units: ['AB'] },
  { name: 'AAB & ABB',    units: ['AAB', 'ABB'] },
  { name: 'ABC Patterns', units: ['ABC'] },
  { name: 'Super Mix',    units: ['AABB', 'ABC', 'ABB'] },
];
const SHAPES = ['sphere', 'cube', 'cone', 'torus'];
const COLORS = [0xd9645f, 0xe8b84a, 0x6a9ad0, 0x7ab86a];
const ROW_LEN = 7;

let score = 0, level = 0, streak = 0, roundHistory = [];
let seq = [], answer = null, choices = [], locked = false;

const scoreEl = document.getElementById('score');
const streakBar = document.getElementById('streak-bar');
const promptEl = document.getElementById('prompt');
const levelBadge = document.getElementById('level-badge');
for (let i = 0; i < 5; i++) { const d = document.createElement('div'); d.className = 'streak-dot'; streakBar.appendChild(d); }

/* ============================================================
   AUDIO
   ============================================================ */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function tone(freq, dur, type = 'sine', vol = 0.2) {
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination); o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.start(); o.stop(audioCtx.currentTime + dur);
}
function successSound() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 0.3, 'sine', 0.2), i * 95)); }
function boop() { tone(190, 0.18, 'sine', 0.2); }
function popSound() { tone(520, 0.14, 'triangle', 0.22); }
function speak(text) { if (!('speechSynthesis' in window)) return; try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.rate = 0.9; u.pitch = 1.15; speechSynthesis.speak(u); } catch (e) {} }

/* ============================================================
   THREE.JS SCENE — circus grounds
   ============================================================ */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xd0c8e4, 28, 64);
function skyTexture() {
  const cv = document.createElement('canvas'); cv.width = 16; cv.height = 256;
  const ctx = cv.getContext('2d'); const g = ctx.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, '#b0a8d8'); g.addColorStop(0.6, '#d4cce8'); g.addColorStop(1, '#ecd8d0');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 16, 256);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t;
}
scene.background = skyTexture();

const camera = new THREE.PerspectiveCamera(46, 1, 0.1, 100);
const camTarget = new THREE.Vector3(0, 1.1, 0.8);
const camDir = new THREE.Vector3(0, 0.4, 0.92).normalize();

scene.add(new THREE.HemisphereLight(0xf4f0f8, 0x8a7a5e, 1.0));
const sun = new THREE.DirectionalLight(0xfff0dc, 0.95);
sun.position.set(-6, 12, 8); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -12; sun.shadow.camera.right = 12; sun.shadow.camera.top = 12; sun.shadow.camera.bottom = -12;
sun.shadow.bias = -0.0004;
scene.add(sun);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(140, 90), new THREE.MeshStandardMaterial({ color: 0xd8bc84, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

// Circus tents
function stripeTexture(c1, c2) {
  const cv = document.createElement('canvas'); cv.width = 128; cv.height = 16;
  const ctx = cv.getContext('2d');
  for (let i = 0; i < 8; i++) { ctx.fillStyle = i % 2 ? c1 : c2; ctx.fillRect(i * 16, 0, 16, 16); }
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function tent(x, z, s, c1) {
  const g = new THREE.Group();
  const base = new THREE.Mesh(new THREE.CylinderGeometry(2.4, 2.4, 1.6, 20), new THREE.MeshStandardMaterial({ map: stripeTexture(c1, '#f4ecd8'), roughness: 0.9 }));
  base.position.y = 0.8; base.castShadow = true; g.add(base);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(3.0, 2.2, 20), new THREE.MeshStandardMaterial({ color: c1, roughness: 0.85 }));
  roof.position.y = 2.7; roof.castShadow = true; g.add(roof);
  const poleTop = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.7, 6), new THREE.MeshStandardMaterial({ color: 0x5a5040 }));
  poleTop.position.y = 4.1; g.add(poleTop);
  const flag = new THREE.Mesh(new THREE.PlaneGeometry(0.55, 0.32), new THREE.MeshStandardMaterial({ color: 0xe8b84a, side: THREE.DoubleSide }));
  flag.position.set(0.3, 4.3, 0); g.add(flag);
  g.position.set(x, 0, z); g.scale.setScalar(s); scene.add(g);
}
tent(-8.5, -10, 1.25, '#c85a50');
tent(8.5, -12, 1.5, '#6a9ad0');

// Bunting line
const buntColors = [0xd9645f, 0xe8b84a, 0x6a9ad0, 0x7ab86a];
for (let i = 0; i < 13; i++) {
  const x = -9 + i * 1.5;
  const y = 6.2 - Math.cos((x / 9) * Math.PI / 2) * 1.0;
  const tri = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.5, 4), new THREE.MeshStandardMaterial({ color: buntColors[i % 4], side: THREE.DoubleSide }));
  tri.rotation.x = Math.PI; tri.position.set(x, y, -7);
  scene.add(tri);
}

/* ---- Pattern items ---- */
function itemY(shape) { return shape === 'sphere' ? 0.5 : shape === 'cube' ? 0.44 : shape === 'cone' ? 0.49 : 0.56; }
function makeItemMesh(item) {
  let geo;
  if (item.shape === 'sphere') geo = new THREE.SphereGeometry(0.5, 20, 16);
  else if (item.shape === 'cube') geo = new THREE.BoxGeometry(0.85, 0.85, 0.85);
  else if (item.shape === 'cone') geo = new THREE.ConeGeometry(0.52, 0.98, 20);
  else geo = new THREE.TorusGeometry(0.38, 0.17, 12, 24);
  const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: item.color, roughness: 0.5 }));
  m.castShadow = true;
  return m;
}
const pedMat = new THREE.MeshStandardMaterial({ color: 0xb89a63, roughness: 0.9 });

// Row slots
const ROW_SPACING = 1.5;
const rowSlots = [];
for (let i = 0; i < ROW_LEN; i++) {
  const g = new THREE.Group();
  const ped = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.62, 0.3, 18), pedMat);
  ped.position.y = 0.15; ped.castShadow = true; ped.receiveShadow = true; g.add(ped);
  g.position.set((i - (ROW_LEN - 1) / 2) * ROW_SPACING, 0, -0.6);
  g.userData = { item: null, mesh: null, popUntil: 0 };
  scene.add(g);
  rowSlots.push(g);
}
// "?" billboard above last slot
function qTexture() {
  const S = 128; const cv = document.createElement('canvas'); cv.width = cv.height = S; const ctx = cv.getContext('2d');
  ctx.fillStyle = '#f8f4fc'; ctx.beginPath(); ctx.arc(S/2, S/2, 56, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#3a3050'; ctx.lineWidth = 8; ctx.stroke();
  ctx.fillStyle = '#3a3050'; ctx.font = '900 76px ui-rounded, Arial, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('?', S/2, S/2 + 4);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const qMark = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.9), new THREE.MeshBasicMaterial({ map: qTexture(), transparent: true }));
scene.add(qMark);

// Choice pedestals
const CHOICE_N = 3;
const choiceSlots = [];
for (let i = 0; i < CHOICE_N; i++) {
  const g = new THREE.Group();
  const ped = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.68, 0.36, 18), new THREE.MeshStandardMaterial({ color: 0x9a86b8, roughness: 0.85 }));
  ped.position.y = 0.18; ped.castShadow = true; g.add(ped);
  g.position.set((i - (CHOICE_N - 1) / 2) * 2.2, 0, 2.6);
  g.userData = { item: null, mesh: null, shakeUntil: 0, baseX: (i - (CHOICE_N - 1) / 2) * 2.2 };
  scene.add(g);
  choiceSlots.push(g);
}

function setSlotItem(slot, item) {
  if (slot.userData.mesh) { slot.remove(slot.userData.mesh); slot.userData.mesh.geometry.dispose(); slot.userData.mesh.material.dispose(); }
  slot.userData.item = item; slot.userData.mesh = null;
  if (item) {
    const m = makeItemMesh(item);
    m.position.y = 0.3 + itemY(item.shape);
    slot.add(m); slot.userData.mesh = m;
  }
}

/* ============================================================
   HELPERS
   ============================================================ */
function randInt(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function sameItem(a, b) { return a && b && a.shape === b.shape && a.color === b.color; }
function updateStreakBar() {
  const dots = streakBar.querySelectorAll('.streak-dot');
  const recent = roundHistory.slice(-5);
  dots.forEach((d, i) => { d.className = 'streak-dot'; if (i < recent.length) d.classList.add(recent[i] ? 'lit' : 'miss'); });
}
function confetti() {
  const colors = ['#d9645f', '#e8b84a', '#6a9ad0', '#7ab86a', '#9a86b8'];
  for (let i = 0; i < 40; i++) { const c = document.createElement('div'); c.className = 'confetti-piece';
    c.style.left = Math.random() * 100 + 'vw'; c.style.top = '-10px'; c.style.background = colors[Math.random() * colors.length | 0];
    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px'; c.style.width = (6 + Math.random() * 8) + 'px'; c.style.height = (6 + Math.random() * 8) + 'px';
    c.style.animation = `confetti-fall ${1.5 + Math.random() * 2}s ease-out forwards`; c.style.animationDelay = Math.random() * 0.5 + 's';
    document.body.appendChild(c); setTimeout(() => c.remove(), 4000);
  }
}
function sparkleBurst() {
  const e = ['✨', '⭐', '💫', '🎪']; const cx = innerWidth / 2, cy = innerHeight * 0.5;
  for (let i = 0; i < 10; i++) { const s = document.createElement('div'); s.className = 'sparkle'; s.textContent = e[Math.floor(Math.random() * e.length)];
    s.style.left = (cx + (Math.random() - 0.5) * 320) + 'px'; s.style.top = (cy + (Math.random() - 0.5) * 120) + 'px'; s.style.animationDelay = (Math.random() * 0.2) + 's';
    document.body.appendChild(s); setTimeout(() => s.remove(), 1300);
  }
}

/* ============================================================
   ROUND FLOW
   ============================================================ */
function distinctItems(n, sameShapeOk) {
  const items = [];
  let guard = 0;
  while (items.length < n && guard++ < 200) {
    const it = { shape: rand(SHAPES), color: rand(COLORS) };
    if (items.some(x => sameItem(x, it))) continue;
    if (!sameShapeOk && items.some(x => x.shape === it.shape || x.color === it.color)) continue;
    if (sameShapeOk && items.some(x => x.color === it.color)) continue;
    items.push(it);
  }
  while (items.length < n) items.push({ shape: rand(SHAPES), color: rand(COLORS) }); // safety
  return items;
}

function newRound() {
  locked = false;
  const lv = LEVELS[level];
  const unitKind = rand(lv.units);
  const subtle = level === 3 && Math.random() < 0.5; // same shapes, different colors
  const base = distinctItems(3, subtle);
  const [A, B, C] = base;
  let unit;
  if (unitKind === 'AB') unit = [A, B];
  else if (unitKind === 'AAB') unit = [A, A, B];
  else if (unitKind === 'ABB') unit = [A, B, B];
  else if (unitKind === 'ABC') unit = [A, B, C];
  else unit = [A, A, B, B];

  seq = [];
  for (let i = 0; i < ROW_LEN; i++) seq.push(unit[i % unit.length]);
  answer = seq[ROW_LEN - 1];

  // fill row (last slot empty)
  for (let i = 0; i < ROW_LEN; i++) setSlotItem(rowSlots[i], i < ROW_LEN - 1 ? seq[i] : null);
  const last = rowSlots[ROW_LEN - 1];
  qMark.position.set(last.position.x, 1.75, last.position.z);
  qMark.visible = true;

  // choices: answer + decoys (prefer other unit items)
  const decoys = [];
  for (const it of [A, B, C]) if (!sameItem(it, answer) && decoys.length < CHOICE_N - 1) decoys.push(it);
  let guard = 0;
  while (decoys.length < CHOICE_N - 1 && guard++ < 100) {
    const it = { shape: rand(SHAPES), color: rand(COLORS) };
    if (!sameItem(it, answer) && !decoys.some(d => sameItem(d, it))) decoys.push(it);
  }
  choices = shuffle([answer, ...decoys]);
  for (let i = 0; i < CHOICE_N; i++) setSlotItem(choiceSlots[i], choices[i]);

  promptEl.innerHTML = 'What comes <b>next</b>?';
  levelBadge.textContent = lv.name;
  speak('What comes next in the pattern?');
}

let flyer = null; // {mesh, from, to, t, dur}
function pickChoice(i) {
  if (locked) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const slot = choiceSlots[i];
  if (sameItem(choices[i], answer)) {
    locked = true;
    score++; streak++; scoreEl.textContent = score;
    roundHistory.push(true);
    if (streak > 0 && streak % 5 === 0 && level < LEVELS.length - 1) level++;
    if (roundHistory.length > 5) roundHistory = [roundHistory[roundHistory.length - 1]];
    updateStreakBar();
    popSound();
    // fly the item into the empty slot
    const mesh = slot.userData.mesh;
    slot.userData.mesh = null;
    const from = new THREE.Vector3(); mesh.getWorldPosition(from);
    scene.add(mesh); mesh.position.copy(from);
    const last = rowSlots[ROW_LEN - 1];
    const to = new THREE.Vector3(last.position.x, 0.3 + itemY(answer.shape), last.position.z);
    qMark.visible = false;
    flyer = { mesh, from, to, t: 0, dur: 0.55, done: () => {
      setSlotItem(last, answer);
      scene.remove(mesh); mesh.geometry.dispose(); mesh.material.dispose();
      const now = clock.getElapsedTime();
      rowSlots.forEach((s, k) => { s.userData.popUntil = now + 0.5 + k * 0.07; });
      successSound(); confetti(); sparkleBurst();
      speak('That is the pattern!');
      setTimeout(newRound, 2200);
    } };
  } else {
    slot.userData.shakeUntil = clock.getElapsedTime() + 0.45;
    boop();
    streak = 0; roundHistory.push(false);
    if (roundHistory.length > 5) roundHistory = [roundHistory[roundHistory.length - 1]];
    updateStreakBar();
  }
}

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
canvas.addEventListener('pointerdown', (e) => {
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  for (let i = 0; i < choiceSlots.length; i++) {
    if (raycaster.intersectObject(choiceSlots[i], true).length) { pickChoice(i); break; }
  }
});

/* ============================================================
   RENDER LOOP
   ============================================================ */
const clock = new THREE.Clock();
function frameScene() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  const aspect = w / h; camera.aspect = aspect;
  const vHalf = THREE.MathUtils.degToRad(camera.fov / 2);
  const hHalf = Math.atan(Math.tan(vHalf) * aspect);
  const dist = Math.min(28, Math.max(9, Math.max(5.6 / Math.tan(hHalf), 3.4 / Math.tan(vHalf))));
  camera.position.copy(camTarget).add(camDir.clone().multiplyScalar(dist));
  camera.lookAt(camTarget);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', frameScene);

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.getElapsedTime();

  for (const s of rowSlots) {
    const u = s.userData;
    if (u.mesh) {
      let y = 0.3 + itemY(u.item.shape);
      if (t < u.popUntil) y += Math.abs(Math.sin((u.popUntil - t) * 10)) * 0.4;
      u.mesh.position.y = y;
      if (u.item.shape === 'torus') u.mesh.rotation.y += dt * 0.6;
    }
  }
  for (const s of choiceSlots) {
    const u = s.userData;
    s.position.x = u.baseX + (t < u.shakeUntil ? Math.sin((u.shakeUntil - t) * 45) * 0.1 : 0);
    if (u.mesh) u.mesh.rotation.y += dt * 0.5;
  }
  qMark.position.y = 1.75 + Math.sin(t * 2) * 0.08;
  qMark.lookAt(camera.position.x, qMark.position.y, camera.position.z);

  if (flyer) {
    flyer.t += dt;
    const p = Math.min(1, flyer.t / flyer.dur);
    const e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
    flyer.mesh.position.lerpVectors(flyer.from, flyer.to, e);
    flyer.mesh.position.y += Math.sin(p * Math.PI) * 1.4;
    if (p >= 1) { const d = flyer.done; flyer = null; d && d(); }
  }

  renderer.render(scene, camera);
}

/* ============================================================
   LEVEL PICKER
   ============================================================ */
window.toggleLevelPicker = function () {
  const p = document.getElementById('level-picker');
  if (p.classList.contains('open')) { p.classList.remove('open'); return; }
  p.innerHTML = '';
  LEVELS.forEach((lv, i) => {
    const o = document.createElement('div'); o.className = 'level-option' + (i === level ? ' active' : '');
    o.innerHTML = '<span>' + lv.name + '</span><span class="level-range">' + lv.units.join(' ') + '</span>';
    o.onclick = (e) => { e.stopPropagation(); level = i; streak = 0; roundHistory = []; updateStreakBar(); p.classList.remove('open'); newRound(); };
    p.appendChild(o);
  });
  p.classList.add('open');
};
document.addEventListener('click', (e) => { if (!e.target.closest('.level-picker') && !e.target.closest('.level-badge')) document.getElementById('level-picker').classList.remove('open'); });

// Start
frameScene();
newRound();
animate();
</script>
