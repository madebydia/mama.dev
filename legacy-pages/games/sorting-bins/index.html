<body>

<canvas id="scene"></canvas>

<div class="ui">
  <div class="top">
    <div class="toprow">
      <div>
        <div class="score-bar"><span class="trophy">🧺</span><span class="score-num" id="score">0</span></div>
        <div class="streak-bar" id="streak-bar"></div>
      </div>
    </div>
    <div class="prompt" id="prompt">Where does it go?</div>
  </div>

  </div>
</div>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   CONFIG
   ============================================================ */
const COLOR_DEFS = [
  { name: 'red',    hex: 0xd9645f, css: '#d9645f' },
  { name: 'blue',   hex: 0x6a9ad0, css: '#6a9ad0' },
  { name: 'yellow', hex: 0xe8b84a, css: '#e8b84a' },
];
const SHAPE_DEFS = [
  { name: 'ball', kind: 'sphere' },
  { name: 'box',  kind: 'cube' },
  { name: 'hat',  kind: 'cone' },
];
const LEVELS = [
  { name: 'Two Colors',   sort: 'color', bins: 2 },
  { name: 'Three Colors', sort: 'color', bins: 3 },
  { name: 'Shapes',       sort: 'shape', bins: 3 },
  { name: 'Big & Small',  sort: 'size',  bins: 2 },
];

let score = 0, level = 0, streak = 0, roundHistory = [];
let item = null, itemMesh = null, binKeys = [], locked = false;

const scoreEl = document.getElementById('score');
const streakBar = document.getElementById('streak-bar');
const promptEl = document.getElementById('prompt');
const levelBadge = document.getElementById('level-badge');
for (let i = 0; i < 5; i++) { const d = document.createElement('div'); d.className = 'streak-dot'; streakBar.appendChild(d); }

/* ============================================================
   AUDIO
   ============================================================ */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function tone(freq, dur, type = 'sine', vol = 0.2) {
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination); o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.start(); o.stop(audioCtx.currentTime + dur);
}
function plop() { tone(300, 0.1, 'sine', 0.2); setTimeout(() => tone(180, 0.14, 'sine', 0.18), 90); }
function successSound() { [523, 659, 784].forEach((f, i) => setTimeout(() => tone(f, 0.3, 'sine', 0.2), i * 95)); }
function boop() { tone(190, 0.18, 'sine', 0.2); }
function speak(text) { if (!('speechSynthesis' in window)) return; try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.rate = 0.9; u.pitch = 1.15; speechSynthesis.speak(u); } catch (e) {} }

/* ============================================================
   THREE.JS SCENE — backyard
   ============================================================ */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xbcd8d0, 24, 56);
function skyTexture() {
  const cv = document.createElement('canvas'); cv.width = 16; cv.height = 256;
  const ctx = cv.getContext('2d'); const g = ctx.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, '#9fcfe0'); g.addColorStop(0.6, '#c4e0dc'); g.addColorStop(1, '#dcecd0');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 16, 256);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t;
}
scene.background = skyTexture();

const camera = new THREE.PerspectiveCamera(46, 1, 0.1, 100);
const camTarget = new THREE.Vector3(0, 1.1, 0.4);
const camDir = new THREE.Vector3(0, 0.42, 0.91).normalize();

scene.add(new THREE.HemisphereLight(0xf0f8f0, 0x5a8a4a, 1.0));
const sun = new THREE.DirectionalLight(0xfff4dc, 1.0);
sun.position.set(-6, 12, 7); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -10; sun.shadow.camera.right = 10; sun.shadow.camera.top = 10; sun.shadow.camera.bottom = -10;
sun.shadow.bias = -0.0004;
scene.add(sun);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(120, 80), new THREE.MeshStandardMaterial({ color: 0x8fc46a, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

// Fence
const plankMat = new THREE.MeshStandardMaterial({ color: 0xb89a6a, roughness: 0.95 });
for (let i = 0; i < 22; i++) {
  const p = new THREE.Mesh(new THREE.BoxGeometry(0.55, 2.0 + (i % 3) * 0.08, 0.12), plankMat);
  p.position.set(-7.3 + i * 0.7, 1.0, -4.5); p.castShadow = true; scene.add(p);
}
const railF = new THREE.Mesh(new THREE.BoxGeometry(15.6, 0.22, 0.14), plankMat);
railF.position.set(0, 1.55, -4.42); scene.add(railF);

// Flowers along the fence
const flowerColors = [0xe8a0b8, 0xf0e0a0, 0xc0cff0, 0xe8b84a];
for (let i = 0; i < 14; i++) {
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.5, 5), new THREE.MeshStandardMaterial({ color: 0x4a8a3a }));
  const x = -7 + Math.random() * 14;
  stem.position.set(x, 0.25, -3.9); scene.add(stem);
  const bloom = new THREE.Mesh(new THREE.SphereGeometry(0.13, 8, 6), new THREE.MeshStandardMaterial({ color: flowerColors[i % 4], roughness: 0.7 }));
  bloom.position.set(x, 0.55, -3.9); scene.add(bloom);
}

// Stump (where the item appears)
const stump = new THREE.Mesh(new THREE.CylinderGeometry(0.65, 0.75, 0.7, 16), new THREE.MeshStandardMaterial({ color: 0x9a7048, roughness: 0.95 }));
stump.position.set(0, 0.35, 2.6); stump.castShadow = true; stump.receiveShadow = true; scene.add(stump);
const stumpTop = new THREE.Mesh(new THREE.CylinderGeometry(0.58, 0.58, 0.06, 16), new THREE.MeshStandardMaterial({ color: 0xc8a878, roughness: 0.9 }));
stumpTop.position.set(0, 0.72, 2.6); scene.add(stumpTop);

/* ---- Bin label textures ---- */
function labelTexture(bin) {
  const S = 256; const cv = document.createElement('canvas'); cv.width = cv.height = S; const ctx = cv.getContext('2d');
  ctx.fillStyle = '#f0e8d0';
  ctx.beginPath(); ctx.arc(S / 2, S / 2, 96, 0, Math.PI * 2); ctx.fill();
  ctx.lineWidth = 10; ctx.strokeStyle = '#5a4a34'; ctx.stroke();
  if (bin.type === 'color') {
    ctx.fillStyle = bin.css;
    ctx.beginPath(); ctx.arc(S / 2, S / 2, 58, 0, Math.PI * 2); ctx.fill();
  } else if (bin.type === 'shape') {
    ctx.fillStyle = '#5a4a34';
    if (bin.kind === 'sphere') { ctx.beginPath(); ctx.arc(S / 2, S / 2, 52, 0, Math.PI * 2); ctx.fill(); }
    else if (bin.kind === 'cube') { ctx.fillRect(S / 2 - 48, S / 2 - 48, 96, 96); }
    else { ctx.beginPath(); ctx.moveTo(S / 2, S / 2 - 56); ctx.lineTo(S / 2 + 54, S / 2 + 48); ctx.lineTo(S / 2 - 54, S / 2 + 48); ctx.closePath(); ctx.fill(); }
  } else { // size
    ctx.fillStyle = '#5a4a34';
    const r = bin.big ? 62 : 26;
    ctx.beginPath(); ctx.arc(S / 2, S / 2, r, 0, Math.PI * 2); ctx.fill();
  }
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
}

/* ---- Crates ---- */
const crates = [];
for (let i = 0; i < 3; i++) {
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: 0xc8a86a, roughness: 0.9 });
  const dark = new THREE.MeshStandardMaterial({ color: 0xa88850, roughness: 0.9 });
  const floor = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.16, 1.6), mat); floor.position.y = 0.1; g.add(floor);
  for (const [dx, dz, w, d] of [[-0.9, 0, 0.14, 1.6], [0.9, 0, 0.14, 1.6], [0, -0.75, 1.9, 0.14], [0, 0.75, 1.9, 0.14]]) {
    const wall = new THREE.Mesh(new THREE.BoxGeometry(w, 0.95, d), dx === 0 ? dark : mat);
    wall.position.set(dx, 0.55, dz); wall.castShadow = true; g.add(wall);
  }
  const labelMat = new THREE.MeshBasicMaterial({ map: labelTexture({ type: 'color', css: '#d9645f' }), transparent: true });
  const label = new THREE.Mesh(new THREE.PlaneGeometry(1.05, 1.05), labelMat);
  label.position.set(0, 0.62, 0.83); g.add(label);
  g.userData = { labelMat, baseX: 0, shakeUntil: 0, popUntil: 0 };
  scene.add(g);
  crates.push(g);
}

/* ============================================================
   HELPERS
   ============================================================ */
function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function updateStreakBar() {
  const dots = streakBar.querySelectorAll('.streak-dot');
  const recent = roundHistory.slice(-5);
  dots.forEach((d, i) => { d.className = 'streak-dot'; if (i < recent.length) d.classList.add(recent[i] ? 'lit' : 'miss'); });
}
function confetti() {
  const colors = ['#d9645f', '#6a9ad0', '#e8b84a', '#7ab86a', '#c8a86a'];
  for (let i = 0; i < 40; i++) { const c = document.createElement('div'); c.className = 'confetti-piece';
    c.style.left = Math.random() * 100 + 'vw'; c.style.top = '-10px'; c.style.background = colors[Math.random() * colors.length | 0];
    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px'; c.style.width = (6 + Math.random() * 8) + 'px'; c.style.height = (6 + Math.random() * 8) + 'px';
    c.style.animation = `confetti-fall ${1.5 + Math.random() * 2}s ease-out forwards`; c.style.animationDelay = Math.random() * 0.5 + 's';
    document.body.appendChild(c); setTimeout(() => c.remove(), 4000);
  }
}
function sparkleBurst() {
  const e = ['✨', '⭐', '💫', '🌟']; const cx = innerWidth / 2, cy = innerHeight * 0.5;
  for (let i = 0; i < 10; i++) { const s = document.createElement('div'); s.className = 'sparkle'; s.textContent = e[Math.floor(Math.random() * e.length)];
    s.style.left = (cx + (Math.random() - 0.5) * 320) + 'px'; s.style.top = (cy + (Math.random() - 0.5) * 120) + 'px'; s.style.animationDelay = (Math.random() * 0.2) + 's';
    document.body.appendChild(s); setTimeout(() => s.remove(), 1300);
  }
}

/* ============================================================
   ROUND FLOW
   ============================================================ */
function makeItemMesh(it) {
  let geo;
  if (it.shape === 'sphere') geo = new THREE.SphereGeometry(0.42, 20, 16);
  else if (it.shape === 'cube') geo = new THREE.BoxGeometry(0.72, 0.72, 0.72);
  else geo = new THREE.ConeGeometry(0.44, 0.85, 20);
  const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: it.hex, roughness: 0.5 }));
  m.castShadow = true;
  m.scale.setScalar(it.big === undefined ? 1 : (it.big ? 1.3 : 0.62));
  return m;
}
function itemBaseY(it) {
  const s = it.big === undefined ? 1 : (it.big ? 1.3 : 0.62);
  const half = it.shape === 'sphere' ? 0.42 : it.shape === 'cube' ? 0.36 : 0.42;
  return 0.75 + half * s;
}

let flyer = null, popT = 0;
function newItem() {
  locked = false;
  const lv = LEVELS[level];
  // configure bins
  if (lv.sort === 'color') {
    const colors = COLOR_DEFS.slice(0, lv.bins);
    binKeys = colors.map(c => c.name);
    for (let i = 0; i < 3; i++) {
      const c2 = crates[i];
      c2.visible = i < lv.bins;
      if (i < lv.bins) { c2.userData.labelMat.map.dispose(); c2.userData.labelMat.map = labelTexture({ type: 'color', css: colors[i].css }); c2.userData.labelMat.needsUpdate = true; }
    }
    const cd = rand(colors);
    item = { shape: rand(SHAPE_DEFS).kind, hex: cd.hex, key: cd.name, word: cd.name };
    promptEl.innerHTML = 'Where does the <b>' + cd.name + '</b> one go?';
  } else if (lv.sort === 'shape') {
    binKeys = SHAPE_DEFS.map(s => s.kind);
    for (let i = 0; i < 3; i++) {
      const c2 = crates[i];
      c2.visible = true;
      c2.userData.labelMat.map.dispose(); c2.userData.labelMat.map = labelTexture({ type: 'shape', kind: SHAPE_DEFS[i].kind }); c2.userData.labelMat.needsUpdate = true;
    }
    const sd = rand(SHAPE_DEFS);
    item = { shape: sd.kind, hex: rand(COLOR_DEFS).hex, key: sd.kind, word: sd.name };
    promptEl.innerHTML = 'Where does the <b>' + sd.name + '</b> go?';
  } else {
    binKeys = ['big', 'small'];
    for (let i = 0; i < 3; i++) {
      const c2 = crates[i];
      c2.visible = i < 2;
      if (i < 2) { c2.userData.labelMat.map.dispose(); c2.userData.labelMat.map = labelTexture({ type: 'size', big: i === 0 }); c2.userData.labelMat.needsUpdate = true; }
    }
    const big = Math.random() < 0.5;
    item = { shape: rand(SHAPE_DEFS).kind, hex: rand(COLOR_DEFS).hex, big, key: big ? 'big' : 'small', word: big ? 'big' : 'small' };
    promptEl.innerHTML = 'Is it <b>' + item.word + '</b> or ' + (item.big ? 'small' : 'big') + '?';
  }
  // lay out visible crates
  const n = binKeys.length;
  const spacing = n === 2 ? 4.2 : 3.4;
  for (let i = 0; i < n; i++) { crates[i].position.set((i - (n - 1) / 2) * spacing, 0, -0.8); crates[i].userData.baseX = crates[i].position.x; }

  if (itemMesh) { scene.remove(itemMesh); itemMesh.geometry.dispose(); itemMesh.material.dispose(); }
  itemMesh = makeItemMesh(item);
  itemMesh.position.set(0, itemBaseY(item), 2.6);
  scene.add(itemMesh);
  popT = clock.getElapsedTime() + 0.4;
  levelBadge.textContent = lv.name;
  speak(promptEl.textContent);
}

function pickCrate(i) {
  if (locked || i >= binKeys.length || !itemMesh) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const crate = crates[i];
  if (binKeys[i] === item.key) {
    locked = true;
    score++; streak++; scoreEl.textContent = score;
    roundHistory.push(true);
    if (streak > 0 && streak % 5 === 0 && level < LEVELS.length - 1) level++;
    if (roundHistory.length > 5) roundHistory = [roundHistory[roundHistory.length - 1]];
    updateStreakBar();
    const to = new THREE.Vector3(crate.position.x, 0.55, crate.position.z);
    const mesh = itemMesh; itemMesh = null;
    flyer = { mesh, from: mesh.position.clone(), to, t: 0, dur: 0.55, done: () => {
      plop();
      crate.userData.popUntil = clock.getElapsedTime() + 0.5;
      setTimeout(() => { scene.remove(mesh); mesh.geometry.dispose(); mesh.material.dispose(); }, 500);
      successSound(); confetti(); sparkleBurst();
      speak('In it goes!');
      setTimeout(newItem, 1800);
    } };
  } else {
    crate.userData.shakeUntil = clock.getElapsedTime() + 0.45;
    boop();
    streak = 0; roundHistory.push(false);
    if (roundHistory.length > 5) roundHistory = [roundHistory[roundHistory.length - 1]];
    updateStreakBar();
  }
}

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
canvas.addEventListener('pointerdown', (e) => {
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  for (let i = 0; i < crates.length; i++) {
    if (crates[i].visible && raycaster.intersectObject(crates[i], true).length) { pickCrate(i); break; }
  }
});

/* ============================================================
   RENDER LOOP
   ============================================================ */
const clock = new THREE.Clock();
function frameScene() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  const aspect = w / h; camera.aspect = aspect;
  const vHalf = THREE.MathUtils.degToRad(camera.fov / 2);
  const hHalf = Math.atan(Math.tan(vHalf) * aspect);
  const dist = Math.min(26, Math.max(8, Math.max(5.0 / Math.tan(hHalf), 3.4 / Math.tan(vHalf))));
  camera.position.copy(camTarget).add(camDir.clone().multiplyScalar(dist));
  camera.lookAt(camTarget);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', frameScene);

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.getElapsedTime();
  for (const c of crates) {
    const u = c.userData;
    c.position.x = u.baseX + (t < u.shakeUntil ? Math.sin((u.shakeUntil - t) * 45) * 0.1 : 0);
    c.position.y = t < u.popUntil ? Math.abs(Math.sin((u.popUntil - t) * 12)) * 0.15 : 0;
  }
  if (itemMesh) {
    let y = itemBaseY(item) + Math.sin(t * 1.8) * 0.05;
    let s = item.big === undefined ? 1 : (item.big ? 1.3 : 0.62);
    if (t < popT) s *= 1 + Math.sin((popT - t) * 12) * 0.15;
    itemMesh.position.y = y;
    itemMesh.scale.setScalar(s);
    itemMesh.rotation.y += dt * 0.8;
  }
  if (flyer) {
    flyer.t += dt;
    const p = Math.min(1, flyer.t / flyer.dur);
    const e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
    flyer.mesh.position.lerpVectors(flyer.from, flyer.to, e);
    flyer.mesh.position.y += Math.sin(p * Math.PI) * 1.6;
    if (p >= 1) { const d = flyer.done; flyer = null; d && d(); }
  }
  renderer.render(scene, camera);
}

/* ============================================================
   LEVEL PICKER
   ============================================================ */
window.toggleLevelPicker = function () {
  const p = document.getElementById('level-picker');
  if (p.classList.contains('open')) { p.classList.remove('open'); return; }
  p.innerHTML = '';
  LEVELS.forEach((lv, i) => {
    const o = document.createElement('div'); o.className = 'level-option' + (i === level ? ' active' : '');
    o.innerHTML = '<span>' + lv.name + '</span><span class="level-range">' + lv.sort + '</span>';
    o.onclick = (e) => { e.stopPropagation(); level = i; streak = 0; roundHistory = []; updateStreakBar(); p.classList.remove('open'); newItem(); };
    p.appendChild(o);
  });
  p.classList.add('open');
};
document.addEventListener('click', (e) => { if (!e.target.closest('.level-picker') && !e.target.closest('.level-badge')) document.getElementById('level-picker').classList.remove('open'); });

// Start
frameScene();
newItem();
animate();
</script>
