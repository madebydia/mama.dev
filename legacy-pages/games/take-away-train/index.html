  const e = ['✨', '⭐', '💫', '🌅']; const cx = innerWidth / 2, cy = innerHeight * 0.4;
  for (let i = 0; i < 10; i++) { const s = document.createElement('div'); s.className = 'sparkle'; s.textContent = e[Math.floor(Math.random() * e.length)];
    s.style.left = (cx + (Math.random() - 0.5) * 320) + 'px'; s.style.top = (cy + (Math.random() - 0.5) * 120) + 'px'; s.style.animationDelay = (Math.random() * 0.2) + 's';
    document.body.appendChild(s); setTimeout(() => s.remove(), 1300);
  }
}

/* ============================================================
   ROUND FLOW
   ============================================================ */
let tween = null;
function driveTween(toX, dur, done) { tween = { from: train.position.x, to: toX, t: 0, dur, done }; }

function makeChoices() {
  const set = new Set([target]);
  let guard = 0;
  while (set.size < 4 && guard++ < 100) { const d = target + (Math.random() < 0.5 ? -1 : 1) * randInt(1, 3); if (d >= 0 && d <= 10) set.add(d); }
  return shuffle([...set]);
}
function renderChoices() {
  choicesEl.innerHTML = '';
  makeChoices().forEach(n => { const btn = document.createElement('button'); btn.className = 'choice'; btn.textContent = n; btn.addEventListener('click', () => answer(n, btn)); choicesEl.appendChild(btn); });
}

function newRound() {
  locked = false; busy = true;
  clearApples();
  minusSign.visible = false;
  mPlaque.visible = false;
  const lv = LEVELS[level];
  a = randInt(Math.max(2, (lv.minM || 1) + 1), lv.maxA);
  m = randInt(lv.minM || 1, a - 1);
  target = a - m;

  // fill wagon with a apples
  for (let i = 0; i < a; i++) {
    const g = makeApple();
    const [sx, sz] = SLOTS[i % SLOTS.length];
    g.position.set(sx, 1.15, sz);
    wagon.add(g);
    apples.push({ g, inWagon: true });
  }
  wagon.userData.numMat.map.dispose();
  wagon.userData.numMat.map = numberTexture(a);
  wagon.userData.numMat.needsUpdate = true;

  exprEl.textContent = a + ' − ' + m;
  document.querySelector('.prompt .eq').textContent = '= ?';
  renderChoices();
  levelBadge.textContent = lv.name;
  frameScene();

  train.position.x = 18;
  driveTween(0, 1100, () => {
    // m apples hop out onto the meadow beside the track
    speak(a + ' apples. ' + m + ' hop away!');
    minusSign.visible = true;
    mMat.map.dispose();
    mMat.map = numberTexture(m);
    mMat.needsUpdate = true;
    mPlaque.visible = true;
    let doneCount = 0;
    for (let i = 0; i < m; i++) {
      const ap = apples[a - 1 - i];
      ap.inWagon = false;
      const to = new THREE.Vector3(3.3 + (i % 3) * 0.7, 0.26, 1.2 + Math.floor(i / 3) * 0.7);
      setTimeout(() => {
        hopSound();
        moveObj(ap.g, to, 0.6, () => { if (++doneCount === m) busy = false; });
      }, 350 + i * 300);
    }
    if (m === 0) busy = false;
  });
}

function answer(n, btn) {
  if (locked || busy) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  if (n === target) {
    locked = true; busy = true;
    btn.classList.add('right');
    score++; streak++; scoreEl.textContent = score;
    roundHistory.push(true);
    if (streak > 0 && streak % 5 === 0 && level < LEVELS.length - 1) level++;
    if (roundHistory.length > 5) roundHistory = [roundHistory[roundHistory.length - 1]];
    updateStreakBar();
    document.querySelector('.prompt .eq').textContent = '= ' + target + '!';
    speak(a + ' minus ' + m + ' is ' + target + '!');
    successSound(); confetti(); sparkleBurst();
    setTimeout(() => {
      choo();
      // ground apples fade away as the train leaves
      driveTween(-24, 1300, newRound);
    }, 900);
  } else {
    btn.classList.add('wrong'); boop();
    streak = 0; roundHistory.push(false);
    if (roundHistory.length > 5) roundHistory = [roundHistory[roundHistory.length - 1]];
    updateStreakBar();
    setTimeout(() => btn.classList.remove('wrong'), 450);
  }
}

/* ============================================================
   RENDER LOOP
   ============================================================ */
const clock = new THREE.Clock();
function frameScene() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  const aspect = w / h; camera.aspect = aspect;
  const vHalf = THREE.MathUtils.degToRad(camera.fov / 2);
  const hHalf = Math.atan(Math.tan(vHalf) * aspect);
  const dist = Math.min(34, Math.max(9, Math.max(6.3 / Math.tan(hHalf), 3.4 / Math.tan(vHalf))));
  camera.position.copy(camTarget).add(camDir.clone().multiplyScalar(dist));
  camera.lookAt(camTarget);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', frameScene);

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  let moving = false;
  if (tween) {
    tween.t += dt * 1000; const p = Math.min(1, tween.t / tween.dur);
    const e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
    train.position.x = tween.from + (tween.to - tween.from) * e;
    moving = p < 1;
    if (p >= 1) { const d = tween.done; tween = null; d && d(); }
  }
  if (moving) for (const w of spinWheels) w.rotation.z -= dt * 6;

  for (let i = movers.length - 1; i >= 0; i--) {
    const mv = movers[i];
    mv.t += dt;
    const p = Math.min(1, mv.t / mv.dur);
    const e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
    mv.obj.position.lerpVectors(mv.from, mv.to, e);
    mv.obj.position.y += Math.sin(p * Math.PI) * 1.1;
    if (p >= 1) { mv.obj.position.copy(mv.to); movers.splice(i, 1); mv.done && mv.done(); }
  }

  wagon.userData.plaque.lookAt(camera.position.x, wagon.userData.plaque.getWorldPosition(new THREE.Vector3()).y, camera.position.z);
  minusSign.lookAt(camera.position.x, minusSign.position.y, camera.position.z);
  mPlaque.lookAt(camera.position.x, mPlaque.position.y, camera.position.z);
  renderer.render(scene, camera);
}

/* ============================================================
   LEVEL PICKER
   ============================================================ */
window.toggleLevelPicker = function () {
  const p = document.getElementById('level-picker');
  if (p.classList.contains('open')) { p.classList.remove('open'); return; }
  p.innerHTML = '';
  LEVELS.forEach((lv, i) => {
    const o = document.createElement('div'); o.className = 'level-option' + (i === level ? ' active' : '');
    o.innerHTML = '<span>' + lv.name + '</span><span class="level-range">to ' + lv.maxA + '</span>';
    o.onclick = (e) => { e.stopPropagation(); level = i; streak = 0; roundHistory = []; updateStreakBar(); p.classList.remove('open'); newRound(); };
    p.appendChild(o);
  });
  p.classList.add('open');
};
document.addEventListener('click', (e) => { if (!e.target.closest('.level-picker') && !e.target.closest('.level-badge')) document.getElementById('level-picker').classList.remove('open'); });

// Start
frameScene();
newRound();
animate();
</script>
