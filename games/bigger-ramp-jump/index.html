<script type="module">
import * as THREE from 'three';

/* ============================================================
   CONFIG
   ============================================================ */
const LEVELS = [
  { name: 'Bunny Hops',   min: 1,   max: 9,    minGap: 3 },
  { name: 'Getting Air',  min: 1,   max: 20,   minGap: 3 },
  { name: 'Big Jumps!',   min: 10,  max: 50,   minGap: 5 },
  { name: 'Stunt Driver', min: 10,  max: 100,  minGap: 5 },
  { name: 'Daredevil',    min: 50,  max: 200,  minGap: 10 },
  { name: 'MEGA LAUNCH',  min: 100, max: 500,  minGap: 15 },
  { name: 'ULTIMATE!',    min: 100, max: 999,  minGap: 20 },
];

const CAR_COLORS = ['#e63946','#457b9d','#f77f00','#2a9d8f','#7209b7','#e76f51','#06d6a0','#ef476f'];

// World layout (units)
const INNER = 1.8;     // where the incline starts (inner base), per side
const RAMP_RUN = 2.8;  // horizontal length of the incline
const RAMP_W = 3.0;    // ramp depth (z)
const CAR_REST_Y = 0;   // wheel bottoms sit at local y=0, so this rests the tires on the ground
const GRAV = 22;       // gravity (units/s^2)

/* ============================================================
   STATE
   ============================================================ */
let score = 0, level = 0, streak = 0, roundHistory = [], roundsAtLevel = 0;
let nums = [0, 0], locked = true, gateOpen = false;
let phase = 'gate'; // gate, choose, driving, jumping, landing, result
let nextRoundAt = 0;

let chosenRamp = -1;   // 0 = left, 1 = right
let dir = 1;           // +1 right, -1 left
let rampH = [1, 1];    // world heights of the two ramps
let vx = 0, vy = 0;    // car velocity during jump
let carX = 0, carY = CAR_REST_Y, pitch = 0;
let squash = 0;        // landing suspension squash (0..1)

/* ============================================================
   DOM
   ============================================================ */
const scoreEl = document.getElementById('score');
const streakBar = document.getElementById('streak-bar');
const numGate = document.getElementById('num-gate');
const tapPrompt = document.getElementById('tap-prompt');
const resultEl = document.getElementById('result');
const input1 = document.getElementById('input1');
const input2 = document.getElementById('input2');
const levelBadge = document.getElementById('level-badge');

for (let i = 0; i < 5; i++) {
  const d = document.createElement('div');
  d.className = 'streak-dot';
  streakBar.appendChild(d);
}

/* ============================================================
   AUDIO
   ============================================================ */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playEngine() {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(80, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.5);
  osc.frequency.exponentialRampToValueAtTime(350, audioCtx.currentTime + 1.0);
  gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + 0.5);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);
  osc.start(); osc.stop(audioCtx.currentTime + 1.5);
}
function playLaunch() {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.type = 'sine';
  osc.frequency.setValueAtTime(200, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.4);
  gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
  osc.start(); osc.stop(audioCtx.currentTime + 0.6);
}
function playSuccess() {
  [0, 0.12, 0.24].forEach((delay, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.value = [523, 659, 784][i];
    gain.gain.setValueAtTime(0, audioCtx.currentTime + delay);
    gain.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + delay + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + delay + 0.4);
    osc.start(audioCtx.currentTime + delay);
    osc.stop(audioCtx.currentTime + delay + 0.4);
  });
}
function playLand() {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.type = 'sine';
  osc.frequency.setValueAtTime(160, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.18);
  gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
  osc.start(); osc.stop(audioCtx.currentTime + 0.25);
}

/* ============================================================
   THREE.JS SCENE
   ============================================================ */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x392b66, 34, 70);

// Sunset gradient backdrop
function skyTexture() {
  const cv = document.createElement('canvas');
  cv.width = 16; cv.height = 256;
  const g = cv.getContext('2d').createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0.0, '#140e33');
  g.addColorStop(0.45, '#3a2a63');
  g.addColorStop(0.72, '#9c5a8e');
  g.addColorStop(0.88, '#ef8a5a');
  g.addColorStop(1.0, '#ffd089');
  const ctx2 = cv.getContext('2d');
  ctx2.fillStyle = g; ctx2.fillRect(0, 0, 16, 256);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
scene.background = skyTexture();

const camera = new THREE.PerspectiveCamera(44, 1, 0.1, 200);
const camTarget = new THREE.Vector3(0, 3.0, 0);
const camDir = new THREE.Vector3(0.06, 0.26, 0.96).normalize();

// Lights
scene.add(new THREE.HemisphereLight(0xfff0e0, 0x402a4a, 0.85));
const sun = new THREE.DirectionalLight(0xffd8a8, 1.5);
sun.position.set(-12, 14, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -22; sun.shadow.camera.right = 22;
sun.shadow.camera.top = 18; sun.shadow.camera.bottom = -10;
sun.shadow.camera.far = 60;
sun.shadow.bias = -0.0004;
scene.add(sun);
const rim = new THREE.DirectionalLight(0xff8a5a, 0.6);
rim.position.set(10, 6, -8);
scene.add(rim);

// Sun disc near the horizon
const sunDisc = new THREE.Mesh(
  new THREE.CircleGeometry(5, 48),
  new THREE.MeshBasicMaterial({ color: 0xffe1a0, fog: false })
);
sunDisc.position.set(-12, 5.5, -45);
scene.add(sunDisc);

// Stars (upper sky)
const starGeo = new THREE.BufferGeometry();
const starPos = [];
for (let i = 0; i < 220; i++) {
  starPos.push((Math.random() - 0.5) * 120, 12 + Math.random() * 40, -30 - Math.random() * 30);
}
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.32, sizeAttenuation: true, transparent: true, opacity: 0.9, fog: false }));
scene.add(stars);

// Ground — dirt arena with a road strip
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 120),
  new THREE.MeshStandardMaterial({ color: 0x6b4a2e, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const road = new THREE.Mesh(
  new THREE.PlaneGeometry(200, RAMP_W + 1.2),
  new THREE.MeshStandardMaterial({ color: 0x3a3340, roughness: 0.9 })
);
road.rotation.x = -Math.PI / 2;
road.position.y = 0.01;
road.receiveShadow = true;
scene.add(road);

// Distant hills silhouette
const hillMat = new THREE.MeshStandardMaterial({ color: 0x2e2350, roughness: 1 });
[[-26, -40, 9, -5], [22, -46, 11, -6], [0, -52, 13, -7]].forEach(([x, z, r, y]) => {
  const hill = new THREE.Mesh(new THREE.SphereGeometry(r, 24, 16), hillMat);
  hill.position.set(x, y, z);
  scene.add(hill);
});

/* ---- Number billboards ---- */
function numberTexture(n) {
  const S = 256;
  const cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const ctx2 = cv.getContext('2d');
  ctx2.clearRect(0, 0, S, S);
  // rounded plaque
  ctx2.fillStyle = 'rgba(20,14,40,0.82)';
  roundRect(ctx2, 14, 70, S - 28, 116, 26); ctx2.fill();
  ctx2.lineWidth = 8; ctx2.strokeStyle = '#f0c040'; ctx2.stroke();
  ctx2.fillStyle = '#fff';
  ctx2.font = '900 92px ui-rounded, Arial, sans-serif';
  ctx2.textAlign = 'center'; ctx2.textBaseline = 'middle';
  ctx2.fillText(String(n), S / 2, 130);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return t;
}
function roundRect(ctx2, x, y, w, h, r) {
  ctx2.beginPath();
  ctx2.moveTo(x + r, y);
  ctx2.arcTo(x + w, y, x + w, y + h, r);
  ctx2.arcTo(x + w, y + h, x, y + h, r);
  ctx2.arcTo(x, y + h, x, y, r);
  ctx2.arcTo(x, y, x + w, y, r);
  ctx2.closePath();
}

/* ---- Ramps ---- */
function makeRamp(sign) {
  // sign = +1 (right) or -1 (left). Unit height; scaled by scale.y each round.
  const shape = new THREE.Shape();
  shape.moveTo(0, 0);
  shape.lineTo(sign * RAMP_RUN, 0);
  shape.lineTo(sign * RAMP_RUN, 1);
  shape.closePath();
  const geo = new THREE.ExtrudeGeometry(shape, { depth: RAMP_W, bevelEnabled: false });
  geo.translate(0, 0, -RAMP_W / 2);
  const mat = new THREE.MeshStandardMaterial({ color: 0x9aa0b0, roughness: 0.6, metalness: 0.1 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true; mesh.receiveShadow = true;
  mesh.position.x = sign * INNER;

  const numMat = new THREE.MeshBasicMaterial({ map: numberTexture(0), transparent: true });
  const plaque = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 2.4), numMat);
  plaque.userData.numMat = numMat;

  const group = new THREE.Group();
  group.add(mesh);
  group.add(plaque);
  group.userData = { mesh, mat, plaque, numMat, sign };
  scene.add(group);
  return group;
}
const ramps = [makeRamp(-1), makeRamp(1)]; // [left, right]

/* ---- Car ---- */
const carRoot = new THREE.Group();     // position + facing (yaw)
const carTilt = new THREE.Group();     // pitch (nose up/down)
const carBounce = new THREE.Group();   // suspension squash
carRoot.add(carTilt);
carTilt.add(carBounce);
scene.add(carRoot);

const carBodyMat = new THREE.MeshStandardMaterial({ color: 0xe63946, roughness: 0.45, metalness: 0.25 });
const carWheels = [];
function buildCar() {
  // faces +x
  const body = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.6, 1.1), carBodyMat);
  body.position.y = 0.55; body.castShadow = true;
  carBounce.add(body);

  const nose = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.42, 1.05), carBodyMat);
  nose.position.set(1.1, 0.45, 0); nose.castShadow = true;
  carBounce.add(nose);

  const cabin = new THREE.Mesh(
    new THREE.BoxGeometry(0.95, 0.5, 0.95),
    new THREE.MeshStandardMaterial({ color: 0x222633, roughness: 0.4 })
  );
  cabin.position.set(-0.15, 1.0, 0); cabin.castShadow = true;
  carBounce.add(cabin);

  const glassMat = new THREE.MeshStandardMaterial({ color: 0x9fd4ff, roughness: 0.1, metalness: 0.2 });
  const windshield = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.42, 0.86), glassMat);
  windshield.position.set(0.35, 1.0, 0);
  carBounce.add(windshield);

  // spoiler
  const spoiler = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.36, 1.0),
    new THREE.MeshStandardMaterial({ color: 0x15171f, roughness: 0.6 }));
  spoiler.position.set(-1.0, 0.85, 0);
  carBounce.add(spoiler);

  // headlights
  const hlMat = new THREE.MeshBasicMaterial({ color: 0xfff3c0 });
  for (const dz of [-0.36, 0.36]) {
    const hl = new THREE.Mesh(new THREE.SphereGeometry(0.1, 12, 10), hlMat);
    hl.position.set(1.34, 0.45, dz);
    carBounce.add(hl);
  }

  // wheels
  const wheelGeo = new THREE.CylinderGeometry(0.36, 0.36, 0.26, 18);
  const wheelMat = new THREE.MeshStandardMaterial({ color: 0x141414, roughness: 0.7 });
  const hubMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.4, metalness: 0.6 });
  for (const wx of [-0.7, 0.7]) {
    for (const wz of [-0.55, 0.55]) {
      const w = new THREE.Group();
      const tire = new THREE.Mesh(wheelGeo, wheelMat);
      tire.rotation.x = Math.PI / 2; tire.castShadow = true;
      const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.28, 10), hubMat);
      hub.rotation.x = Math.PI / 2;
      w.add(tire); w.add(hub);
      w.position.set(wx, 0.36, wz);
      carBounce.add(w);
      carWheels.push(w);
    }
  }
}
buildCar();

/* ---- Dust particles ---- */
const dust = [];
const dustGeo = new THREE.SphereGeometry(1, 8, 6);
function spawnDust(x, y, z, count, spread) {
  for (let i = 0; i < count; i++) {
    const m = new THREE.Mesh(dustGeo, new THREE.MeshStandardMaterial({
      color: 0xc9a96e, transparent: true, opacity: 0.7, roughness: 1
    }));
    const s = 0.12 + Math.random() * 0.18;
    m.scale.setScalar(s);
    m.position.set(x + (Math.random() - 0.5) * 0.6, y + Math.random() * 0.3, z + (Math.random() - 0.5) * RAMP_W);
    scene.add(m);
    dust.push({
      m,
      vx: (Math.random() - 0.5) * spread,
      vy: Math.random() * spread * 0.8 + 0.6,
      vz: (Math.random() - 0.5) * spread,
      life: 1,
    });
  }
}
function updateDust(dt) {
  for (let i = dust.length - 1; i >= 0; i--) {
    const p = dust[i];
    p.life -= dt * 1.4;
    if (p.life <= 0) { scene.remove(p.m); p.m.material.dispose(); dust.splice(i, 1); continue; }
    p.vy -= dt * 4;
    p.m.position.x += p.vx * dt;
    p.m.position.y += p.vy * dt;
    p.m.position.z += p.vz * dt;
    if (p.m.position.y < 0.05) p.m.position.y = 0.05;
    p.m.material.opacity = p.life * 0.7;
    p.m.scale.multiplyScalar(1 + dt * 0.8);
  }
}

/* ============================================================
   HELPERS / DOM LOGIC
   ============================================================ */
function randInt(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
function getCeiling(b) {
  if (b <= 10) return 10; if (b <= 20) return 20; if (b <= 50) return 50;
  if (b <= 100) return 100; if (b <= 200) return 200; if (b <= 500) return 500; return 1000;
}
function generateNumbers() {
  const lv = LEVELS[level];
  let a, b;
  do { a = randInt(lv.min, lv.max); b = randInt(lv.min, lv.max); }
  while (a === b || Math.abs(a - b) < lv.minGap);
  return [a, b];
}
function updateStreakBar() {
  const dots = streakBar.querySelectorAll('.streak-dot');
  const recent = roundHistory.slice(-5);
  dots.forEach((d, i) => {
    d.className = 'streak-dot';
    if (i < recent.length) d.classList.add(recent[i] ? 'lit' : 'miss');
  });
}
function confetti() {
  const colors = ['#f0c040','#e63946','#06d6a0','#457b9d','#f77f00','#7209b7','#ef476f'];
  for (let i = 0; i < 40; i++) {
    const c = document.createElement('div');
    c.className = 'confetti-piece';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.top = '-10px';
    c.style.background = colors[Math.random() * colors.length | 0];
    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    c.style.width = (6 + Math.random() * 8) + 'px';
    c.style.height = (6 + Math.random() * 8) + 'px';
    c.style.animation = `confetti-fall ${1.5 + Math.random() * 2}s ease-out forwards`;
    c.style.animationDelay = Math.random() * 0.5 + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4000);
  }
}

/* ============================================================
   ROUND FLOW
   ============================================================ */
function applyRamp(i) {
  const ceiling = getCeiling(Math.max(nums[0], nums[1]));
  rampH[i] = 1.0 + (nums[i] / ceiling) * 4.2;
  const g = ramps[i];
  g.userData.mesh.scale.y = rampH[i];
  g.userData.mat.color.set(0x9aa0b0);
  g.userData.mat.emissive.set(0x000000);
  // plaque above the tip
  const sign = g.userData.sign;
  g.userData.plaque.position.set(sign * (INNER + RAMP_RUN), rampH[i] + 1.4, 0);
  g.userData.numMat.map.dispose();
  g.userData.numMat.map = numberTexture(nums[i]);
  g.userData.numMat.needsUpdate = true;
}

function newRound() {
  phase = 'gate';
  locked = true;
  gateOpen = false;
  chosenRamp = -1;
  resultEl.classList.remove('show');

  nums = generateNumbers();
  document.getElementById('ramp-display-1').textContent = nums[0];
  document.getElementById('ramp-display-2').textContent = nums[1];

  carBodyMat.color.set(CAR_COLORS[Math.floor(Math.random() * CAR_COLORS.length)]);
  carX = 0; carY = CAR_REST_Y; pitch = 0; squash = 0;
  dir = 1; vx = vy = 0;

  applyRamp(0); applyRamp(1);

  numGate.classList.remove('hidden');
  tapPrompt.classList.add('hidden');
  document.getElementById('gate-sub').classList.add('hidden');
  input1.value = ''; input2.value = '';
  input1.classList.remove('correct', 'wrong');
  input2.classList.remove('correct', 'wrong');

  levelBadge.textContent = LEVELS[level].name;
  roundsAtLevel++;

  setTimeout(() => input1.focus(), 100);
}

function checkGate() {
  const v1 = parseInt(input1.value);
  const v2 = parseInt(input2.value);
  const ok1 = v1 === nums[0];
  const ok2 = v2 === nums[1];

  input1.classList.remove('correct', 'wrong');
  input2.classList.remove('correct', 'wrong');
  if (input1.value !== '') input1.classList.add(ok1 ? 'correct' : 'wrong');
  if (input2.value !== '') input2.classList.add(ok2 ? 'correct' : 'wrong');

  if (ok1 && document.activeElement === input1 && !ok2) input2.focus();

  if (ok1 && ok2) {
    document.getElementById('gate-sub').classList.remove('hidden');
    setTimeout(() => {
      gateOpen = true;
      phase = 'choose';
      locked = false;
      numGate.classList.add('hidden');
      tapPrompt.classList.remove('hidden');
    }, 1000);
  }
}
input1.addEventListener('input', checkGate);
input2.addEventListener('input', checkGate);

// Tap to choose ramp (left half / right half of screen)
canvas.addEventListener('pointerdown', function (e) {
  if (phase !== 'choose' || locked) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();

  chosenRamp = e.clientX < window.innerWidth / 2 ? 0 : 1;
  dir = chosenRamp === 0 ? -1 : 1;
  locked = true;
  tapPrompt.classList.add('hidden');
  phase = 'driving';
  playEngine();
});

function launch() {
  phase = 'jumping';
  playLaunch();
  const h = rampH[chosenRamp];
  const theta = Math.atan2(h, RAMP_RUN);
  const v = 6.0 + 1.15 * h;       // bigger ramp → faster launch
  vx = dir * v * Math.cos(theta);
  vy = v * Math.sin(theta);
  spawnDust(dir * (INNER + RAMP_RUN), 0.2, 0, 16, 5);
}

function land() {
  phase = 'landing';
  carY = CAR_REST_Y;
  pitch = 0;
  squash = 1;
  spawnDust(carX, 0.2, 0, 22, 6);
  playLand();

  const biggerIdx = nums[0] > nums[1] ? 0 : 1;
  const correct = chosenRamp === biggerIdx;

  if (correct) {
    score++; streak++;
    scoreEl.textContent = score;
    roundHistory.push(true);
    if (streak > 0 && streak % 5 === 0 && level < LEVELS.length - 1) { level++; roundsAtLevel = 0; }
  } else {
    streak = 0;
    roundHistory.push(false);
    if (roundHistory.length >= 3) {
      const wrongs = roundHistory.slice(-3).filter(x => !x).length;
      if (wrongs >= 2 && level > 0) { level--; roundsAtLevel = 0; }
    }
  }
  if (roundHistory.length > 5) roundHistory = [roundHistory[roundHistory.length - 1]];
  updateStreakBar();

  // highlight the winning ramp
  ramps[biggerIdx].userData.mat.color.set(0xf0c040);
  ramps[biggerIdx].userData.mat.emissive.set(0x4a3500);

  setTimeout(() => {
    const winNum = Math.max(nums[0], nums[1]);
    const loseNum = Math.min(nums[0], nums[1]);
    const emoji = document.getElementById('result-emoji');
    const text = document.getElementById('result-text');
    const explain = document.getElementById('result-explain');
    if (correct) {
      emoji.textContent = '🏆';
      text.textContent = 'HUGE JUMP!';
      text.style.color = '#4ade80';
      confetti();
      playSuccess();
    } else {
      emoji.textContent = '😔';
      text.textContent = 'Small jump...';
      text.style.color = '#f87171';
    }
    explain.textContent = winNum + ' > ' + loseNum;
    resultEl.classList.add('show');
    phase = 'result';
  }, 400);

  nextRoundAt = performance.now() + 3500;
}

/* ============================================================
   PHYSICS STEP (fixed timestep)
   ============================================================ */
function step(dt) {
  if (phase === 'driving') {
    const tipX = dir * (INNER + RAMP_RUN);
    const baseX = dir * INNER;
    const speed = 11;
    carX += dir * speed * dt;

    if (Math.abs(carX) <= INNER) {
      // approaching on the road
      carY = CAR_REST_Y; pitch = 0;
      if (Math.random() < dt * 22) spawnDust(carX - dir * 1.0, 0.15, 0, 1, 2);
    } else {
      // climbing the incline
      const frac = Math.min(1, (Math.abs(carX) - INNER) / RAMP_RUN);
      carY = CAR_REST_Y + frac * rampH[chosenRamp];
      pitch = Math.atan2(rampH[chosenRamp], RAMP_RUN);
    }
    if (Math.abs(carX) >= Math.abs(tipX)) {
      carX = tipX;
      launch();
    }
  } else if (phase === 'jumping') {
    vy -= GRAV * dt;
    carX += vx * dt;
    carY += vy * dt;
    pitch = Math.atan2(vy, Math.abs(vx));
    if (carY <= CAR_REST_Y && vy < 0) { carY = CAR_REST_Y; land(); }
  }

  // suspension recovery
  if (squash > 0) squash = Math.max(0, squash - dt * 4);

  // wheel spin
  if (phase === 'driving' || phase === 'jumping') {
    for (const w of carWheels) w.rotation.z -= dir * dt * 14;
  }
}

/* ============================================================
   RENDER LOOP
   ============================================================ */
const clock = new THREE.Clock();
let acc = 0;
const FIXED = 1 / 120;

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  const aspect = w / h;
  camera.aspect = aspect;
  const vHalf = THREE.MathUtils.degToRad(camera.fov / 2);
  const hHalf = Math.atan(Math.tan(vHalf) * aspect);
  // fit the arena: jumps reach ~±12 and peak ~8; keep margin
  const dist = Math.min(60, Math.max(15, Math.max(13.5 / Math.tan(hHalf), 6.2 / Math.tan(vHalf))));
  camera.position.copy(camTarget).add(camDir.clone().multiplyScalar(dist));
  camera.lookAt(camTarget);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

function animate() {
  requestAnimationFrame(animate);
  let dt = Math.min(clock.getDelta(), 0.05);
  acc += dt;
  while (acc >= FIXED) { step(FIXED); acc -= FIXED; }

  // apply car transform
  carRoot.position.set(carX, carY, 0);
  carRoot.rotation.y = dir === 1 ? 0 : Math.PI;
  carTilt.rotation.z = pitch;
  carBounce.scale.set(1, 1 - squash * 0.3, 1 + squash * 0.18);
  carBounce.position.y = -squash * 0.18;

  // twinkle stars
  stars.material.opacity = 0.7 + 0.25 * Math.sin(performance.now() / 600);

  updateDust(dt);

  // round advance
  if (phase === 'result' && performance.now() >= nextRoundAt) newRound();

  renderer.render(scene, camera);
}

/* ============================================================
   LEVEL PICKER
   ============================================================ */
window.toggleLevelPicker = function () {
  const pickerEl = document.getElementById('level-picker');
  if (pickerEl.classList.contains('open')) { pickerEl.classList.remove('open'); return; }
  pickerEl.innerHTML = '';
  LEVELS.forEach((lv, i) => {
    const opt = document.createElement('div');
    opt.className = 'level-option' + (i === level ? ' active' : '');
    opt.innerHTML = '<span>' + lv.name + '</span><span class="level-range">' + lv.min + '–' + lv.max + '</span>';
    opt.onclick = function (e) {
      e.stopPropagation();
      level = i; streak = 0; roundHistory = []; roundsAtLevel = 0;
      updateStreakBar();
      pickerEl.classList.remove('open');
      newRound();
    };
    pickerEl.appendChild(opt);
  });
  pickerEl.classList.add('open');
};
document.addEventListener('click', function (e) {
  if (!e.target.closest('.level-picker') && !e.target.closest('.level-badge')) {
    document.getElementById('level-picker').classList.remove('open');
  }
});

// Start
newRound();
animate();
</script>
