<style>
  :root { --ink: #322a48; --muted: #d8ccd8; --panel: #f6f0e4; }

  body {
    font-family: ui-rounded, "Arial Rounded MT Bold", "Nunito", system-ui, sans-serif;
    background: linear-gradient(#6a6aa8 0 52%, #4a5a48 52% 100%);
    color: var(--ink);

    position: fixed; inset: 0; z-index: 2;

    padding: max(46px, calc(env(safe-area-inset-top) + 8px)) max(14px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));

  .score-num { font-size: 30px; font-weight: 1000; color: #ffe9b8; text-shadow: 0 2px 5px rgba(0,0,0,0.4); }
  .streak-bar { display: flex; gap: 5px; margin-top: 6px; justify-content: flex-end; }
  .streak-dot { width: 15px; height: 15px; border-radius: 50%; background: rgba(255,255,255,0.35); transition: background .3s, transform .3s; }
  .streak-dot.lit { background: #ffcf6a; transform: scale(1.2); box-shadow: 0 0 8px rgba(255,207,106,0.7); }
  .streak-dot.miss { background: #d98a8a; transform: scale(1.2); }

  .prompt {

    padding: 9px 24px;

  }

  }
  .ctl-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(30,24,48,0.35); }

  .level-badge {
    align-self: center;
    background: rgba(30,24,48,0.5); color: #fff;
    padding: 6px 18px; border-radius: 20px; font-size: 13px; font-weight: 800; letter-spacing: 1px;
    cursor: pointer; backdrop-filter: blur(4px);
  }
  .level-picker {
    position: fixed; bottom: 56px; left: 50%; transform: translateX(-50%); z-index: 25;
    background: #322a48; border: 2px solid rgba(255,255,255,0.2); border-radius: 12px; padding: 8px 0;
    display: none; min-width: 230px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); pointer-events: auto;
  }
  .level-picker.open { display: block; }
  .level-option { padding: 10px 16px; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; justify-content: space-between; gap: 12px; }
  .level-option:hover { background: rgba(255,255,255,0.1); }
  .level-option.active { background: rgba(255,207,106,0.22); color: #ffcf6a; }
  .level-range { font-weight: 400; opacity: 0.6; }

  .sparkle { position: fixed; z-index: 4; font-size: 1.7rem; pointer-events: none; animation: sparkleFloat 1.1s ease-out forwards; }
  @keyframes sparkleFloat { 0%{opacity:.95;transform:translate(-50%,0) scale(.5) rotate(0)} 100%{opacity:0;transform:translate(-50%,-120px) scale(1.1) rotate(120deg)} }
  .confetti-piece { position: fixed; z-index: 50; pointer-events: none; }
  @keyframes confetti-fall { 0%{transform:translateY(-10px) rotate(0);opacity:1} 100%{transform:translateY(100vh) rotate(720deg);opacity:0} }

  footer { position: fixed; bottom: 4px; right: 10px; z-index: 3; font-size: 0.72rem; color: var(--muted); opacity: 0.85; }
  footer a { color: inherit; }
  @media (prefers-reduced-motion: reduce) { .sparkle { animation-duration: 0.01ms; } }

<script type="module">
import * as THREE from 'three';

/* ============================================================
   CONFIG
   ============================================================ */
const GROUPS = [
  [['cat','🐱'],['hat','🎩'],['bat','🦇'],['rat','🐀']],
  [['dog','🐶'],['frog','🐸'],['log','🪵']],
  [['cake','🎂'],['snake','🐍']],
  [['moon','🌙'],['spoon','🥄']],
  [['star','⭐'],['car','🚗']],
  [['bee','🐝'],['tree','🌳'],['key','🔑']],
  [['goat','🐐'],['boat','⛵'],['coat','🧥']],
  [['mouse','🐭'],['house','🏠']],
  [['fox','🦊'],['box','📦']],
  [['bear','🐻'],['pear','🍐'],['chair','🪑']],
  [['king','👑'],['ring','💍']],
  [['fish','🐟'],['dish','🍽️']],
  [['sheep','🐑'],['jeep','🚙']],
  [['corn','🌽'],['unicorn','🦄']],
];
const LEVELS = [
  { name: 'Two Doors',   n: 2 },
  { name: 'Three Doors', n: 3 },
  { name: 'Four Doors',  n: 4 },
];
const HOUSE_COLORS = [0xc88a7a, 0x8a9ab8, 0xb8a86a, 0x9ab88a];

let score = 0, level = 0, streak = 0, roundHistory = [];
let promptWord = null, answerWord = null, choiceWords = [], locked = false;

const scoreEl = document.getElementById('score');
const streakBar = document.getElementById('streak-bar');
const promptPicEl = document.getElementById('promptPic');
const promptWordEl = document.getElementById('promptWord');
const levelBadge = document.getElementById('level-badge');
for (let i = 0; i < 5; i++) { const d = document.createElement('div'); d.className = 'streak-dot'; streakBar.appendChild(d); }

/* ============================================================
   AUDIO
   ============================================================ */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function tone(freq, dur, type = 'sine', vol = 0.2) {
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination); o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.start(); o.stop(audioCtx.currentTime + dur);
}
function successSound() { [523, 659, 784].forEach((f, i) => setTimeout(() => tone(f, 0.32, 'sine', 0.22), i * 100)); }
function boop() { tone(190, 0.18, 'sine', 0.2); }
function speak(text) { if (!('speechSynthesis' in window)) return; try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.rate = 0.85; u.pitch = 1.15; speechSynthesis.speak(u); } catch (e) {} }

/* ============================================================
   THREE.JS SCENE — twilight lane
   ============================================================ */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x6a6a9c, 26, 60);
function skyTexture() {
  const cv = document.createElement('canvas'); cv.width = 16; cv.height = 256;
  const ctx = cv.getContext('2d'); const g = ctx.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, '#3e3e74'); g.addColorStop(0.5, '#7a6aa0'); g.addColorStop(0.85, '#d89a88'); g.addColorStop(1, '#f0c8a0');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 16, 256);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t;
}
scene.background = skyTexture();

const camera = new THREE.PerspectiveCamera(46, 1, 0.1, 100);
const camTarget = new THREE.Vector3(0, 1.7, 0);
const camDir = new THREE.Vector3(0, 0.3, 0.95).normalize();

scene.add(new THREE.HemisphereLight(0xc8c0e0, 0x4a5a48, 1.15));
const moonLight = new THREE.DirectionalLight(0xd8d0f0, 0.7);
moonLight.position.set(6, 12, 7); moonLight.castShadow = true;
moonLight.shadow.mapSize.set(2048, 2048);
moonLight.shadow.camera.left = -12; moonLight.shadow.camera.right = 12; moonLight.shadow.camera.top = 12; moonLight.shadow.camera.bottom = -12;
moonLight.shadow.bias = -0.0004;
scene.add(moonLight);
const warm = new THREE.PointLight(0xffcf8a, 22, 30); warm.position.set(0, 3.5, 3); scene.add(warm);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(140, 90), new THREE.MeshStandardMaterial({ color: 0x4a5a48, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
// path
const path = new THREE.Mesh(new THREE.PlaneGeometry(140, 2.6), new THREE.MeshStandardMaterial({ color: 0x8a7a68, roughness: 1 }));
path.rotation.x = -Math.PI / 2; path.position.set(0, 0.02, 2.6); path.receiveShadow = true; scene.add(path);

// Moon + stars
const moon = new THREE.Mesh(new THREE.CircleGeometry(1.8, 40), new THREE.MeshBasicMaterial({ color: 0xf4ecd0, fog: false }));
moon.position.set(-9, 11, -26); scene.add(moon);
const starGeo = new THREE.BufferGeometry();
const starPos = [];
for (let i = 0; i < 140; i++) starPos.push((Math.random() - 0.5) * 90, 8 + Math.random() * 26, -28 - Math.random() * 14);
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xfff4d8, size: 0.22, transparent: true, opacity: 0.9, fog: false })));

// Hedge row behind houses
const hedgeMat = new THREE.MeshStandardMaterial({ color: 0x3a5238, roughness: 1 });
for (let i = 0; i < 9; i++) {
  const h = new THREE.Mesh(new THREE.SphereGeometry(1.3, 12, 10), hedgeMat);
  h.position.set(-9 + i * 2.3, 0.6, -4.2); h.scale.y = 0.8; scene.add(h);
}

// Lamp posts
function lamp(x) {
  const g = new THREE.Group();
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 2.6, 8), new THREE.MeshStandardMaterial({ color: 0x2a2436, roughness: 0.7 }));
  pole.position.y = 1.3; pole.castShadow = true; g.add(pole);
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.2, 12, 10), new THREE.MeshStandardMaterial({ color: 0xffe9b0, emissive: 0xffcf6a, emissiveIntensity: 1.2 }));
  bulb.position.y = 2.7; g.add(bulb);
  const pt = new THREE.PointLight(0xffcf8a, 8, 9); pt.position.y = 2.7; g.add(pt);
  g.position.set(x, 0, 1.8); scene.add(g);
}
lamp(-6.2); lamp(6.2);

/* ---- Emoji sign texture ---- */
function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function emojiTexture(emoji, word) {
  const S = 256; const cv = document.createElement('canvas'); cv.width = cv.height = S; const ctx = cv.getContext('2d');
  ctx.fillStyle = '#f6f0e4'; roundRect(ctx, 8, 8, S - 16, S - 16, 30); ctx.fill();
  ctx.strokeStyle = '#322a48'; ctx.lineWidth = 9; roundRect(ctx, 8, 8, S - 16, S - 16, 30); ctx.stroke();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '118px serif';
  ctx.fillText(emoji, S / 2, S / 2 - 30);
  ctx.fillStyle = '#322a48';
  ctx.font = '900 52px ui-rounded, "Arial Rounded MT Bold", Arial, sans-serif';
  ctx.fillText(word || '', S / 2, S - 60);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
}

/* ---- Houses ---- */
const houses = [];
for (let i = 0; i < 4; i++) {
  const g = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ color: HOUSE_COLORS[i], roughness: 0.85 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(1.8, 1.6, 1.6), bodyMat);
  body.position.y = 1.0; body.castShadow = true; g.add(body);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(1.55, 1.1, 4), new THREE.MeshStandardMaterial({ color: 0x4a3a52, roughness: 0.9 }));
  roof.rotation.y = Math.PI / 4; roof.position.y = 2.35; roof.castShadow = true; g.add(roof);
  const door = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.75, 0.08), new THREE.MeshStandardMaterial({ color: 0x5a4030, roughness: 0.9 }));
  door.position.set(-0.35, 0.58, 0.82); g.add(door);
  const winMat = new THREE.MeshStandardMaterial({ color: 0x8a8098, roughness: 0.6, emissive: 0x000000 });
  const win = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.08), winMat);
  win.position.set(0.4, 1.25, 0.82); g.add(win);
  const signMat = new THREE.MeshBasicMaterial({ map: emojiTexture('🐱', 'cat'), transparent: true });
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 1.5), signMat);
  sign.position.y = 3.75; g.add(sign);
  g.userData = { winMat, signMat, sign, baseX: 0, shakeUntil: 0, popUntil: 0 };
  scene.add(g);
  houses.push(g);
}

/* ============================================================
   HELPERS
   ============================================================ */
function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function updateStreakBar() {
  const dots = streakBar.querySelectorAll('.streak-dot');
  const recent = roundHistory.slice(-5);
  dots.forEach((d, i) => { d.className = 'streak-dot'; if (i < recent.length) d.classList.add(recent[i] ? 'lit' : 'miss'); });
}
function confetti() {
  const colors = ['#ffcf6a', '#c88a7a', '#8a9ab8', '#b8a86a', '#f0c8a0'];
  for (let i = 0; i < 40; i++) { const c = document.createElement('div'); c.className = 'confetti-piece';
    c.style.left = Math.random() * 100 + 'vw'; c.style.top = '-10px'; c.style.background = colors[Math.random() * colors.length | 0];
    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px'; c.style.width = (6 + Math.random() * 8) + 'px'; c.style.height = (6 + Math.random() * 8) + 'px';
    c.style.animation = `confetti-fall ${1.5 + Math.random() * 2}s ease-out forwards`; c.style.animationDelay = Math.random() * 0.5 + 's';
    document.body.appendChild(c); setTimeout(() => c.remove(), 4000);
  }
}
function sparkleBurst() {
  const e = ['✨', '⭐', '💫', '🌙']; const cx = innerWidth / 2, cy = innerHeight * 0.5;
  for (let i = 0; i < 10; i++) { const s = document.createElement('div'); s.className = 'sparkle'; s.textContent = e[Math.floor(Math.random() * e.length)];
    s.style.left = (cx + (Math.random() - 0.5) * 320) + 'px'; s.style.top = (cy + (Math.random() - 0.5) * 120) + 'px'; s.style.animationDelay = (Math.random() * 0.2) + 's';
    document.body.appendChild(s); setTimeout(() => s.remove(), 1300);
  }
}

/* ============================================================
   ROUND FLOW
   ============================================================ */
function speakPrompt() { speak(promptWord[0] + '! Which one rhymes with ' + promptWord[0] + '?'); }

function newRound() {
  locked = false;
  const n = LEVELS[level].n;
  const group = rand(GROUPS.filter(g => g.length >= 2));
  const pair = shuffle([...group]).slice(0, 2);
  promptWord = pair[0]; answerWord = pair[1];

  // decoys from other groups, no duplicate emoji/word
  const used = new Set([promptWord[0], answerWord[0], promptWord[1], answerWord[1]]);
  const decoys = [];
  let guard = 0;
  while (decoys.length < n - 1 && guard++ < 300) {
    const g2 = rand(GROUPS);
    if (g2 === group) continue;
    const w = rand(g2);
    if (used.has(w[0]) || used.has(w[1])) continue;
    decoys.push(w); used.add(w[0]); used.add(w[1]);
  }
  choiceWords = shuffle([answerWord, ...decoys]);

  const spacing = n === 2 ? 4.4 : n === 3 ? 3.6 : 3.1;
  for (let i = 0; i < houses.length; i++) {
    const h = houses[i];
    if (i < n) {
      h.visible = true;
      h.position.set((i - (n - 1) / 2) * spacing, 0, 0);
      h.userData.baseX = h.position.x;
      h.userData.winMat.emissive.set(0x000000);
      h.userData.signMat.map.dispose();
      h.userData.signMat.map = emojiTexture(choiceWords[i][1], choiceWords[i][0]);
      h.userData.signMat.needsUpdate = true;
    } else h.visible = false;
  }

  promptPicEl.textContent = promptWord[1];
  promptWordEl.textContent = promptWord[0];
  levelBadge.textContent = LEVELS[level].name;
  setTimeout(speakPrompt, 500);
}

function pickHouse(i) {
  if (locked || i >= LEVELS[level].n) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const h = houses[i];
  if (choiceWords[i] === answerWord) {
    locked = true;
    h.userData.winMat.emissive.set(0xffcf6a);
    h.userData.popUntil = clock.getElapsedTime() + 0.8;
    score++; streak++; scoreEl.textContent = score;
    roundHistory.push(true);
    if (streak > 0 && streak % 5 === 0 && level < LEVELS.length - 1) level++;
    if (roundHistory.length > 5) roundHistory = [roundHistory[roundHistory.length - 1]];
    updateStreakBar();
    speak(promptWord[0] + ' rhymes with ' + answerWord[0] + '!');
    successSound(); confetti(); sparkleBurst();
    setTimeout(newRound, 2400);
  } else {
    h.userData.shakeUntil = clock.getElapsedTime() + 0.45;
    boop();
    streak = 0; roundHistory.push(false);
    if (roundHistory.length > 5) roundHistory = [roundHistory[roundHistory.length - 1]];
    updateStreakBar();
  }
}

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
canvas.addEventListener('pointerdown', (e) => {
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  for (let i = 0; i < houses.length; i++) {
    if (houses[i].visible && raycaster.intersectObject(houses[i], true).length) { pickHouse(i); break; }
  }
});
document.getElementById('speakBtn').addEventListener('click', () => { if (audioCtx.state === 'suspended') audioCtx.resume(); speakPrompt(); });

/* ============================================================
   RENDER LOOP
   ============================================================ */
const clock = new THREE.Clock();
function frameScene() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  const aspect = w / h; camera.aspect = aspect;
  const vHalf = THREE.MathUtils.degToRad(camera.fov / 2);
  const hHalf = Math.atan(Math.tan(vHalf) * aspect);
  const dist = Math.min(30, Math.max(9, Math.max(6.2 / Math.tan(hHalf), 3.6 / Math.tan(vHalf))));
  camera.position.copy(camTarget).add(camDir.clone().multiplyScalar(dist));
  camera.lookAt(camTarget);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', frameScene);

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.getElapsedTime();
  for (const h of houses) {
    const u = h.userData;
    let x = u.baseX, y = 0;
    if (t < u.shakeUntil) x += Math.sin((u.shakeUntil - t) * 45) * 0.1;
    if (t < u.popUntil) y = Math.abs(Math.sin((u.popUntil - t) * 9)) * 0.3;
    h.position.x = x; h.position.y = y;
    u.sign.lookAt(camera.position.x, u.sign.getWorldPosition(new THREE.Vector3()).y, camera.position.z);
    u.sign.position.y = 3.75 + Math.sin(t * 1.6 + u.baseX) * 0.06;
  }
  renderer.render(scene, camera);
}

/* ============================================================
   LEVEL PICKER
   ============================================================ */
window.toggleLevelPicker = function () {
  const p = document.getElementById('level-picker');
  if (p.classList.contains('open')) { p.classList.remove('open'); return; }
  p.innerHTML = '';
  LEVELS.forEach((lv, i) => {
    const o = document.createElement('div'); o.className = 'level-option' + (i === level ? ' active' : '');
    o.innerHTML = '<span>' + lv.name + '</span><span class="level-range">' + lv.n + ' choices</span>';
    o.onclick = (e) => { e.stopPropagation(); level = i; streak = 0; roundHistory = []; updateStreakBar(); p.classList.remove('open'); newRound(); };
    p.appendChild(o);
  });
  p.classList.add('open');
};
document.addEventListener('click', (e) => { if (!e.target.closest('.level-picker') && !e.target.closest('.level-badge')) document.getElementById('level-picker').classList.remove('open'); });

// Start
frameScene();
newRound();
animate();
</script>
