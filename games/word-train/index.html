    <style>
        :root {
            --bg: #fff7d8;
            --panel: #fffdf4;
            --panel-strong: #ffe995;
            --ink: #272014;
            --muted: #6e5b40;
            --orange: #ff9f45;
            --yellow: #f8d86f;
            --green: #96d65f;
            --blue: #79c7ed;
            --pink: #f0a8d8;
            --line: rgba(39, 32, 20, 0.16);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: ui-rounded, "Arial Rounded MT Bold", "Nunito", system-ui, sans-serif;
            background: linear-gradient(#bcd2d6 0 56%, #7e9c5e 56% 100%);
            color: var(--ink);
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        #scene {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .ui {
            position: fixed;
            inset: 0;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
            padding: max(56px, calc(env(safe-area-inset-top) + 56px)) max(14px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
        }

        .ui > * { pointer-events: auto; }

        /* ---- Top bar ---- */
        .top {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .topbar {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .levels {
            display: flex;
            gap: 8px;
            padding: 7px;
            background: rgba(255, 253, 244, 0.82);
            border: 3px solid var(--ink);
            border-radius: 999px;
            box-shadow: 0 5px 0 rgba(39, 32, 20, 0.18);
            backdrop-filter: blur(4px);
        }

        .level-btn {
            display: flex;
            align-items: center;
            gap: 7px;
            min-height: 46px;
            padding: 0 14px;
            border: 3px solid transparent;
            border-radius: 999px;
            background: transparent;
            color: var(--muted);
            font-family: inherit;
            font-size: 1rem;
            font-weight: 1000;
            cursor: pointer;
            transition: transform 80ms ease;
        }

        .level-btn .ico { font-size: 1.4rem; line-height: 1; }
        .level-btn .lbl { display: none; }

        .level-btn.active {
            background: var(--yellow);
            border-color: var(--ink);
            color: var(--ink);
        }
        .level-btn.active .lbl { display: inline; }
        .level-btn:active { transform: scale(0.94); }

        .stars {
            display: flex;
            align-items: center;
            gap: 4px;
            min-height: 52px;
            padding: 8px 16px;
            background: rgba(255, 253, 244, 0.82);
            border: 3px solid var(--ink);
            border-radius: 999px;
            box-shadow: 0 5px 0 rgba(39, 32, 20, 0.18);
            backdrop-filter: blur(4px);
            font-size: 1.5rem;
            line-height: 1;
        }
        .stars span { filter: grayscale(1) opacity(0.35); transition: filter 200ms ease, transform 200ms ease; }
        .stars span.on { filter: none; transform: scale(1.12); }

        /* ---- Prompt ---- */
        .prompt {
            align-self: center;
            padding: 9px 20px;
            background: rgba(255, 253, 244, 0.9);
            border: 3px solid var(--ink);
            border-radius: 999px;
            box-shadow: 0 5px 0 rgba(39, 32, 20, 0.18);
            font-size: clamp(1rem, 3.4vw, 1.35rem);
            font-weight: 1000;
            text-align: center;
        }

        /* ---- Bottom keyboard (letters + controls in two wide rows) ---- */
        .dock {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .keys {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-content: flex-end;
            gap: 6px;
            max-width: min(1000px, 97vw);
            margin: 0 auto;
        }

        .letter-btn,
        .ctl-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: clamp(40px, 6vw, 58px);
            height: clamp(40px, 6vw, 58px);
            font-weight: 1000;
            border: 3px solid var(--ink);
            border-radius: 14px;
            cursor: pointer;
            color: var(--ink);
            font-family: inherit;
            box-shadow: 0 5px 0 rgba(39, 32, 20, 0.22);
            transition: transform 70ms ease, box-shadow 70ms ease;
        }

        .letter-btn { font-size: clamp(1.3rem, 4.2vw, 2rem); }
        .letter-btn.consonant { background: var(--green); }
        .letter-btn.vowel { background: var(--orange); }

        .ctl-btn {
            font-size: clamp(1.1rem, 3.4vw, 1.5rem);
            background: var(--panel);
        }

        .letter-btn:active,
        .ctl-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 rgba(39, 32, 20, 0.22);
        }
        .ctl-btn[hidden] { display: none; }

        /* ---- Level-up toast ---- */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            z-index: 5;
            transform: translate(-50%, -50%) scale(0.6);
            padding: 22px 34px;
            background: var(--panel-strong);
            border: 4px solid var(--ink);
            border-radius: 28px;
            box-shadow: 0 14px 0 rgba(39, 32, 20, 0.2);
            font-size: clamp(1.6rem, 6vw, 2.6rem);
            font-weight: 1000;
            text-align: center;
            opacity: 0;
            pointer-events: none;
        }
        .toast.show { animation: pop 2s ease forwards; }
        @keyframes pop {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
            14% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
            24% { transform: translate(-50%, -50%) scale(1); }
            80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -52%) scale(0.95); }
        }

        /* ---- Sparkles ---- */
        .sparkle {
            position: fixed;
            z-index: 4;
            font-size: 1.8rem;
            pointer-events: none;
            animation: sparkleFloat 1.1s ease-out forwards;
        }
        @keyframes sparkleFloat {
            0% { opacity: 0.95; transform: translate(-50%, 0) scale(0.5) rotate(0deg); }
            100% { opacity: 0; transform: translate(-50%, -120px) scale(1.1) rotate(120deg); }
        }

        footer {
            position: fixed;
            bottom: 4px;
            right: 10px;
            z-index: 3;
            font-size: 0.72rem;
            color: var(--muted);
            opacity: 0.8;
        }
        footer a { color: inherit; }

        @media (prefers-reduced-motion: reduce) {
            .toast.show { animation-duration: 0.01ms; }
            .sparkle { animation-duration: 0.01ms; }
        }
    </style>

    <script type="module">
    import * as THREE from 'three';

    /* ============================================================
       WORD DATA
       ============================================================ */

    // Validity dictionary — any real short word formed counts (cat/cot/cut all ok).
    const validWords = new Set([
        'van','cab','can','man','ran','fan','pan','tan','bad','dad','had','mad','sad','lad','pad',
        'bag','tag','wag','bat','cat','hat','mat','pat','rat','sat','vat','fat','dab','gab','jab',
        'lab','nab','tab','dam','ham','jam','ram','yam','cap','gap','lap','map','nap','rap','sap',
        'tap','zap','gas','pal','wax','max','tax','fax','was','has',
        'bed','red','led','fed','wed','beg','leg','peg','den','hen','men','pen','ten','bet','get',
        'jet','let','met','net','pet','set','vet','wet','yet','pep','web','egg','elf','elk','elm',
        'bid','did','hid','kid','lid','rid','big','dig','fig','gig','jig','pig','wig','bin','din',
        'fin','kin','pin','sin','tin','win','bit','fit','hit','kit','lit','pit','sit','wit','dip',
        'hip','lip','nip','rip','sip','tip','zip','dim','him','rim','fix','mix','six','rib','bib',
        'bog','cog','dog','fog','hog','jog','log','box','fox','not','cot','dot','got','hot','lot',
        'pot','rot','tot','cop','hop','mop','pop','top','bop','bob','cob','job','mob','rob','sob',
        'god','nod','pod','rod','sod','mom','bud','cud','mud','bug','dug','hug','jug','mug','pug',
        'rug','tug','bun','fun','gun','nun','pun','run','sun','but','cut','gut','hut','jut','nut',
        'rut','bus','cub','hub','pub','rub','sub','tub','bum','gum','hum','sum','yum','cup','pup',
        'sup','put','jet','yak','yes','yet','wax','zoo','bee','sea','tea','pie','key','saw','gem',
        'ear','eye','arm','toe','jar','car','bar','far','tar','war','cow','bow','paw','jaw','law',
        'raw','saw','ace','age','ant','arc','ark','art','ash','ask','add','aid','aim','air','ape'
    ]);

    // Curated CVC words for Level 1 puzzles (blank one slot).
    const PUZZLE_WORDS = [
        'cat','hat','bat','mat','rat','sat','fan','can','man','pan','ran','van','bag','tag','rag',
        'wag','cap','map','nap','tap','lap','dad','bad','mad','sad','ham','jam','ram',
        'bed','red','hen','pen','ten','net','jet','pet','wet','web','leg','peg','beg','den','men',
        'big','pig','dig','wig','fig','pin','win','bin','tin','fin','sit','hit','bit','fit','lip',
        'dip','rip','tip','zip','rib','bib','six','fix','mix',
        'dog','log','fog','hog','jog','cot','dot','hot','pot','rot','box','fox','top','hop','mop',
        'pop','cop','cob','job','mob','rob','nod','rod',
        'bus','cup','pup','cut','nut','hut','rug','bug','hug','jug','mug','tug','sun','run','fun',
        'bun','gun','mud','cub','tub','rub','sub'
    ];

    // Picture words for Level 2 (spell what you see).
    const PICTURE_WORDS = [
        ['cat','🐱'],['dog','🐶'],['pig','🐷'],['cow','🐮'],['fox','🦊'],['owl','🦉'],['bee','🐝'],
        ['ant','🐜'],['bug','🐛'],['hen','🐔'],['bat','🦇'],['rat','🐭'],['ram','🐏'],
        ['sun','☀️'],['bus','🚌'],['car','🚗'],['hat','🎩'],['cap','🧢'],['bed','🛏️'],['pen','🖊️'],
        ['cup','🥤'],['box','📦'],['egg','🥚'],['leg','🦵'],['ear','👂'],['eye','👁️'],['lip','👄'],
        ['gem','💎'],['log','🪵'],['fan','🪭'],['map','🗺️'],['nut','🥜'],['pie','🥧'],['axe','🪓'],
        ['web','🕸️'],['bow','🎀'],['jam','🍯'],['key','🔑'],['saw','🪚']
    ];

    const VOWELS = ['a','e','i','o','u'];
    const ALPHABET = 'abcdefghijklmnopqrstuvwxyz'.split('');

    /* ============================================================
       PALETTE
       ============================================================ */
    const COL = {
        ink: '#2b2620', cream: '#f3e7c6',
        sky: '#bcd2d6', grass: '#7e9c5e', sand: '#cdb78d',
        rock: '#9aa0a0', snow: '#eef2f2', pine: '#46603e', hill: '#6f8b54',
        boiler: '#41584a', black: '#1f1f1f', brass: '#c69a3a', wood: '#9a6f44', woodDark: '#6e4f30'
    };
    // muted wooden boxcar colours (letters sit on a cream tile, so they stay readable)
    const CAR_COLORS = ['#6f8f82', '#9a6f44', '#7e9358', '#b89a66'];

    /* ============================================================
       THREE.JS SCENE
       ============================================================ */
    const canvas = document.getElementById('scene');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0xc4d4d2, 40, 90);
    function skyTexture() {
        const cv = document.createElement('canvas'); cv.width = 16; cv.height = 256;
        const ctx = cv.getContext('2d'); const g = ctx.createLinearGradient(0, 0, 0, 256);
        g.addColorStop(0, '#aac4c8'); g.addColorStop(0.6, '#c4d6d6'); g.addColorStop(1, '#d6e0da');
        ctx.fillStyle = g; ctx.fillRect(0, 0, 16, 256);
        const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t;
    }
    scene.background = skyTexture();

    const camera = new THREE.PerspectiveCamera(46, 1, 0.1, 100);
    const camTarget = new THREE.Vector3(-1.2, 2, 0);
    const camDir = new THREE.Vector3(0.08, 0.18, 0.98).normalize();
    // Distance is computed in frameScene() so the whole train fits in any aspect.

    // Soft painterly lighting
    scene.add(new THREE.HemisphereLight(0xeef0ea, 0x7a8a5e, 1.0));
    const sun = new THREE.DirectionalLight(0xfff4dc, 0.85);
    sun.position.set(-6, 12, 8);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    sun.shadow.camera.left = -14; sun.shadow.camera.right = 14;
    sun.shadow.camera.top = 14; sun.shadow.camera.bottom = -14;
    sun.shadow.bias = -0.0004;
    scene.add(sun);

    // Ground (grass) with a sandy track bed
    const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(160, 100),
        new THREE.MeshStandardMaterial({ color: COL.grass, roughness: 1 })
    );
    ground.rotation.x = -Math.PI / 2; ground.position.y = 0; ground.receiveShadow = true;
    scene.add(ground);
    const ballast = new THREE.Mesh(
        new THREE.PlaneGeometry(160, 3.4),
        new THREE.MeshStandardMaterial({ color: COL.sand, roughness: 1 })
    );
    ballast.rotation.x = -Math.PI / 2; ballast.position.set(0, 0.02, 0); ballast.receiveShadow = true;
    scene.add(ballast);

    // Snow-capped mountains
    function makeMountain(x, z, h, s) {
        const g = new THREE.Group();
        const rock = new THREE.Mesh(new THREE.ConeGeometry(h * 0.85, h, 6), new THREE.MeshStandardMaterial({ color: COL.rock, roughness: 1 }));
        rock.position.y = h / 2; g.add(rock);
        const cap = new THREE.Mesh(new THREE.ConeGeometry(h * 0.85 * 0.34, h * 0.32, 6), new THREE.MeshStandardMaterial({ color: COL.snow, roughness: 1 }));
        cap.position.y = h * 0.84; g.add(cap);
        g.position.set(x, -1.5, z); g.scale.setScalar(s); g.rotation.y = Math.random();
        scene.add(g);
    }
    makeMountain(-16, -44, 13, 1); makeMountain(-2, -50, 16, 1); makeMountain(13, -46, 12, 1); makeMountain(24, -48, 14, 0.9);

    // Pine-covered hills + scattered firs
    const hillMat = new THREE.MeshStandardMaterial({ color: COL.hill, roughness: 1 });
    [[-14, -30, 6, -4], [16, -32, 7, -4.5], [3, -36, 8, -5]].forEach(([x, z, r, y]) => {
        const hill = new THREE.Mesh(new THREE.SphereGeometry(r, 24, 16), hillMat); hill.position.set(x, y, z); scene.add(hill);
    });
    const pineMat = new THREE.MeshStandardMaterial({ color: COL.pine, roughness: 1 });
    const pineTrunk = new THREE.MeshStandardMaterial({ color: COL.woodDark, roughness: 1 });
    function makePine(x, z, s) {
        const g = new THREE.Group();
        const tr = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.16, 0.7, 6), pineTrunk); tr.position.y = 0.35; g.add(tr);
        [[1.4, 0.75, 1.1], [1.9, 0.55, 0.85], [2.4, 0.4, 0.62]].forEach(([y, r, hh]) => { const c = new THREE.Mesh(new THREE.ConeGeometry(r, hh, 8), pineMat); c.position.y = y; g.add(c); });
        g.position.set(x, 0, z); g.scale.setScalar(s); scene.add(g);
    }
    for (let i = 0; i < 14; i++) { const side = Math.random() < 0.5 ? -1 : 1; makePine(side * (7 + Math.random() * 12), -14 - Math.random() * 14, 0.8 + Math.random() * 0.9); }

    // Foreground bushes
    const bushMat = new THREE.MeshStandardMaterial({ color: 0x5f7a44, roughness: 1 });
    [[-7, 4.5, 1.1], [8.5, 4.2, 1.3], [-2, 5.5, 0.9]].forEach(([x, z, s]) => {
        const b = new THREE.Group();
        [[0,0,1],[0.8,0.1,0.7],[-0.8,0.1,0.7]].forEach(([dx,dy,r]) => { const m = new THREE.Mesh(new THREE.SphereGeometry(r, 12, 10), bushMat); m.position.set(dx, dy, 0); b.add(m); });
        b.position.set(x, 0.2, z); b.scale.setScalar(s); scene.add(b);
    });

    // Rails + ties
    const rails = new THREE.Group();
    const railMat = new THREE.MeshStandardMaterial({ color: '#8c9296', roughness: 0.5, metalness: 0.3 });
    for (const z of [-0.55, 0.55]) {
        const rail = new THREE.Mesh(new THREE.BoxGeometry(160, 0.12, 0.12), railMat);
        rail.position.set(0, 0.18, z);
        rails.add(rail);
    }
    const tieMat = new THREE.MeshStandardMaterial({ color: COL.woodDark, roughness: 1 });
    for (let i = -36; i <= 36; i++) {
        const tie = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.1, 1.5), tieMat);
        tie.position.set(i * 1.1, 0.1, 0);
        tie.receiveShadow = true;
        rails.add(tie);
    }
    scene.add(rails);

    const clouds = []; // (no clouds in the mountain scene; kept for the animate loop)

    /* ============================================================
       TEXTURES
       ============================================================ */
    function roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
    }

    function letterTexture(letter, bg, opts = {}) {
        const S = 256;
        const cv = document.createElement('canvas');
        cv.width = cv.height = S;
        const ctx = cv.getContext('2d');
        // panel
        ctx.fillStyle = bg;
        roundRect(ctx, 16, 16, S - 32, S - 32, 34);
        ctx.fill();
        // inner cream tile
        ctx.fillStyle = opts.empty ? 'rgba(255,253,244,0.35)' : COL.cream;
        roundRect(ctx, 40, 40, S - 80, S - 80, 24);
        ctx.fill();
        if (opts.empty) {
            ctx.strokeStyle = COL.ink;
            ctx.lineWidth = 6;
            ctx.setLineDash([14, 12]);
            roundRect(ctx, 44, 44, S - 88, S - 88, 22);
            ctx.stroke();
            ctx.setLineDash([]);
        }
        if (letter) {
            ctx.fillStyle = COL.ink;
            ctx.font = '900 150px ui-rounded, "Arial Rounded MT Bold", Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(letter, S / 2, S / 2 + 12);
        }
        const tex = new THREE.CanvasTexture(cv);
        tex.anisotropy = 4;
        return tex;
    }

    function emojiTexture(emoji) {
        const S = 256;
        const cv = document.createElement('canvas');
        cv.width = cv.height = S;
        const ctx = cv.getContext('2d');
        ctx.fillStyle = COL.cream;
        roundRect(ctx, 8, 8, S - 16, S - 16, 28);
        ctx.fill();
        ctx.strokeStyle = COL.ink;
        ctx.lineWidth = 8;
        roundRect(ctx, 8, 8, S - 16, S - 16, 28);
        ctx.stroke();
        ctx.font = '170px serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(emoji, S / 2, S / 2 + 12);
        const tex = new THREE.CanvasTexture(cv);
        tex.anisotropy = 4;
        return tex;
    }

    /* ============================================================
       TRAIN
       ============================================================ */
    const train = new THREE.Group();
    scene.add(train);

    const spinWheels = [];

    function makeWheel(x, y, z, r = 0.34) {
        const w = new THREE.Mesh(
            new THREE.CylinderGeometry(r, r, 0.18, 18),
            new THREE.MeshStandardMaterial({ color: COL.black, roughness: 0.6 })
        );
        w.rotation.x = Math.PI / 2;
        w.position.set(x, y, z);
        w.castShadow = true;
        spinWheels.push(w);
        return w;
    }

    // Big spoked driving wheel (faces the camera, spins about z)
    const blackMat = new THREE.MeshStandardMaterial({ color: COL.black, roughness: 0.6 });
    const rimMat = new THREE.MeshStandardMaterial({ color: '#cfcabf', roughness: 0.5, metalness: 0.2 });
    const spokeMat = new THREE.MeshStandardMaterial({ color: '#39393a', roughness: 0.6 });
    function makeDriveWheel(x, y, z, r) {
        const g = new THREE.Group();
        const disc = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.92, r * 0.92, 0.16, 24), blackMat);
        disc.rotation.x = Math.PI / 2; disc.castShadow = true; g.add(disc);
        const rim = new THREE.Mesh(new THREE.TorusGeometry(r, 0.07, 8, 28), rimMat); g.add(rim);
        for (let i = 0; i < 4; i++) { const s = new THREE.Mesh(new THREE.BoxGeometry(r * 1.85, 0.08, 0.05), spokeMat); s.rotation.z = i * Math.PI / 4; s.position.z = 0.02; g.add(s); }
        const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.22, 12), rimMat); hub.rotation.x = Math.PI / 2; g.add(hub);
        g.position.set(x, y, z); spinWheels.push(g); return g;
    }

    // Engine — classic Old-West steam locomotive (leads to the left, -x)
    const engine = new THREE.Group();
    const boilerMat = new THREE.MeshStandardMaterial({ color: COL.boiler, roughness: 0.55, metalness: 0.1 });
    const woodMat = new THREE.MeshStandardMaterial({ color: COL.wood, roughness: 0.85 });
    const brassMat = new THREE.MeshStandardMaterial({ color: COL.brass, roughness: 0.45, metalness: 0.4 });
    const darkMat = new THREE.MeshStandardMaterial({ color: COL.black, roughness: 0.6 });

    const footplate = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.32, 1.5), darkMat); footplate.position.set(-0.2, 0.62, 0); footplate.castShadow = true; engine.add(footplate);
    const boiler = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.62, 2.4, 22), boilerMat); boiler.rotation.z = Math.PI / 2; boiler.position.set(-0.55, 1.25, 0); boiler.castShadow = true; engine.add(boiler);
    // smokebox (front, -x) — round dark face with a ring of bolts
    const smokebox = new THREE.Mesh(new THREE.CylinderGeometry(0.72, 0.72, 0.55, 24), darkMat); smokebox.rotation.z = Math.PI / 2; smokebox.position.set(-1.78, 1.25, 0); smokebox.castShadow = true; engine.add(smokebox);
    for (let i = 0; i < 16; i++) { const a = i / 16 * Math.PI * 2; const bolt = new THREE.Mesh(new THREE.SphereGeometry(0.045, 6, 6), brassMat); bolt.position.set(-2.06, 1.25 + Math.sin(a) * 0.6, Math.cos(a) * 0.6); engine.add(bolt); }
    const smokeHub = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.08, 16), new THREE.MeshStandardMaterial({ color: '#3a3a3a' })); smokeHub.rotation.z = Math.PI / 2; smokeHub.position.set(-2.07, 1.25, 0); engine.add(smokeHub);
    // brass headlight on top of the smokebox
    const lampBox = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.42, 0.42), brassMat); lampBox.position.set(-1.86, 1.95, 0); engine.add(lampBox);
    const lampLens = new THREE.Mesh(new THREE.CircleGeometry(0.16, 16), new THREE.MeshBasicMaterial({ color: 0xffe39a })); lampLens.rotation.y = -Math.PI / 2; lampLens.position.set(-2.04, 1.95, 0); engine.add(lampLens);
    // flared diamond smokestack
    const stack = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.18, 0.9, 18), darkMat); stack.position.set(-1.2, 2.25, 0); stack.castShadow = true; engine.add(stack);
    const stackCap = new THREE.Mesh(new THREE.CylinderGeometry(0.46, 0.4, 0.13, 18), darkMat); stackCap.position.set(-1.2, 2.74, 0); engine.add(stackCap);
    // two brass domes
    [[-0.45, 0.32], [0.2, 0.27]].forEach(([dx, r]) => {
        const baseD = new THREE.Mesh(new THREE.CylinderGeometry(r, r + 0.03, 0.22, 16), brassMat); baseD.position.set(dx, 1.84, 0); engine.add(baseD);
        const topD = new THREE.Mesh(new THREE.SphereGeometry(r, 14, 12, 0, Math.PI * 2, 0, Math.PI / 2), brassMat); topD.position.set(dx, 1.95, 0); engine.add(topD);
    });
    // wooden cab with windows + overhanging roof
    const cab = new THREE.Mesh(new THREE.BoxGeometry(1.05, 1.2, 1.5), woodMat); cab.position.set(0.95, 1.65, 0); cab.castShadow = true; engine.add(cab);
    const winMat = new THREE.MeshStandardMaterial({ color: '#33403a', roughness: 0.4 });
    for (const dz of [0.76, -0.76]) { const win = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.06), winMat); win.position.set(0.95, 1.85, dz); engine.add(win); }
    const cabFrontWin = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.5, 0.6), winMat); cabFrontWin.position.set(0.42, 1.85, 0); engine.add(cabFrontWin);
    const cabRoof = new THREE.Mesh(new THREE.BoxGeometry(1.25, 0.16, 1.66), new THREE.MeshStandardMaterial({ color: COL.woodDark, roughness: 0.85 })); cabRoof.position.set(0.95, 2.33, 0); cabRoof.castShadow = true; engine.add(cabRoof);
    // wooden cowcatcher (wedge) at the front
    const cowShape = new THREE.Shape(); cowShape.moveTo(0, 0.85); cowShape.lineTo(-1.15, 0.05); cowShape.lineTo(0, 0.05); cowShape.closePath();
    const cowGeo = new THREE.ExtrudeGeometry(cowShape, { depth: 1.3, bevelEnabled: false }); cowGeo.translate(0, 0, -0.65);
    const cowcatcher = new THREE.Mesh(cowGeo, woodMat); cowcatcher.position.set(-1.95, 0.18, 0); cowcatcher.castShadow = true; engine.add(cowcatcher);
    // wheels: small pilot truck + three big spoked drivers
    engine.add(makeWheel(-1.55, 0.34, 0.78, 0.3)); engine.add(makeWheel(-1.55, 0.34, -0.78, 0.3));
    [-0.7, 0.1, 0.9].forEach(wx => { engine.add(makeDriveWheel(wx, 0.55, 0.79, 0.55)); engine.add(makeDriveWheel(wx, 0.55, -0.79, 0.55)); });
    engine.position.x = -4.2;
    train.add(engine);

    // Billowing smoke from the stack
    const smokePuffs = [];
    const smokeBaseY = 3.0;
    for (let i = 0; i < 5; i++) {
        const mat = new THREE.MeshStandardMaterial({ color: 0xb9b6ac, roughness: 1, transparent: true, opacity: 0.75 });
        const puff = new THREE.Group();
        [[0, 0, 0.42], [0.34, 0.1, 0.34], [-0.32, 0.12, 0.32], [0.08, 0.36, 0.3]].forEach(([dx, dy, r]) => { const s = new THREE.Mesh(new THREE.SphereGeometry(r, 10, 8), mat); s.position.set(dx, dy, 0); puff.add(s); });
        puff.userData = { mat, off: i * 0.9 };
        engine.add(puff); smokePuffs.push(puff);
    }

    // Cars — recreated per round to match word length
    let cars = [];
    function buildCars(count) {
        cars.forEach(c => {
            train.remove(c.group);
            c.faceMat.map?.dispose();
        });
        cars = [];
        const startX = -1.6;
        const spacing = 1.8;
        for (let i = 0; i < count; i++) {
            const group = new THREE.Group();
            const color = CAR_COLORS[i % CAR_COLORS.length];
            const faceMat = new THREE.MeshStandardMaterial({ map: letterTexture('', color, { empty: true }), roughness: 0.7 });
            const sideMat = new THREE.MeshStandardMaterial({ color, roughness: 0.7 });
            // face order: +x,-x,+y,-y,+z,-z  → letter on +z (toward camera)
            const mats = [sideMat, sideMat, sideMat, sideMat, faceMat, sideMat];
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.4, 1.5), mats);
            body.position.y = 1.05;
            body.castShadow = true;
            group.add(body);
            group.add(makeWheel(-0.45, 0.45, 0.78));
            group.add(makeWheel(0.45, 0.45, 0.78));
            group.add(makeWheel(-0.45, 0.45, -0.78));
            group.add(makeWheel(0.45, 0.45, -0.78));
            group.position.x = startX + i * spacing;
            group.userData = { baseX: group.position.x, color, body, shakeUntil: 0, bobUntil: 0 };
            train.add(group);
            cars.push({ group, body, faceMat, color });
        }
    }

    function setCar(i, letter, state) {
        const car = cars[i];
        car.faceMat.map?.dispose();
        car.faceMat.map = letterTexture(letter, car.color, { empty: state === 'empty' });
        car.faceMat.needsUpdate = true;
    }

    // Picture signboard (Level 2). The board billboards to face the camera;
    // the post stays a separate, always-vertical mesh so it never tilts into the board.
    const SIGN_X = 0.4, SIGN_Z = -2.2, BOARD_Y = 4;
    const signPost = new THREE.Mesh(
        new THREE.CylinderGeometry(0.12, 0.12, 2.85, 12),
        new THREE.MeshStandardMaterial({ color: '#7a5a3a', roughness: 1 })
    );
    signPost.position.set(SIGN_X, 1.42, SIGN_Z); // top (~2.85) sits just under the board
    signPost.castShadow = true;
    signPost.visible = false;
    scene.add(signPost);

    const sign = new THREE.Group();
    const signMat = new THREE.MeshStandardMaterial({ transparent: true, roughness: 0.8 });
    const signBoard = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 2.4), signMat);
    signBoard.position.y = BOARD_Y;
    signBoard.castShadow = true;
    sign.add(signBoard);
    sign.position.set(SIGN_X, 0, SIGN_Z);
    sign.visible = false;
    scene.add(sign);

    /* ============================================================
       GAME STATE
       ============================================================ */
    const state = {
        mode: 1,
        target: '',        // target word (modes 1 & 2)
        slots: [],         // current letters
        len: 3,
        blankIndex: -1,    // mode 1: which slot is open
        locked: [],        // slots that are pre-filled (mode 1)
        activeIndex: -1,   // car that glows
        busy: false,       // animating in/out
        stars: 0,
    };

    const STARS_TO_LEVEL = 5;

    const els = {
        keys: document.getElementById('keys'),
        prompt: document.getElementById('prompt'),
        stars: document.getElementById('stars'),
        toast: document.getElementById('toast'),
        speakBtn: document.getElementById('speakBtn'),
        backBtn: document.getElementById('backBtn'),
        levelBtns: [...document.querySelectorAll('.level-btn')],
    };

    function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // Letters that complete a Level-1 blank into a real word.
    function validLettersForBlank(fixed, blankIdx) {
        const out = [];
        for (const L of ALPHABET) {
            const w = fixed.slice(0, blankIdx) + L + fixed.slice(blankIdx + 1);
            if (validWords.has(w)) out.push(L);
        }
        return out;
    }

    /* ============================================================
       ROUNDS
       ============================================================ */
    function newRound() {
        state.busy = true;
        if (state.mode === 1) setupFillBlank();
        else if (state.mode === 2) setupPicture();
        else setupFree();

        buildCars(state.len);
        for (let i = 0; i < state.len; i++) {
            const L = state.slots[i];
            setCar(i, L, L ? 'filled' : 'empty');
        }
        sign.visible = signPost.visible = state.mode === 2;
        renderGrid();
        updateControls();
        frameScene(); // reframe the train above the (mode-dependent) keyboard height

        // drive in
        train.position.x = 16;
        driveTween(0, 1100, () => { state.busy = false; });
    }

    function setupFillBlank() {
        const word = rand(PUZZLE_WORDS);
        state.target = word;
        state.len = word.length;
        const blank = Math.floor(Math.random() * word.length);
        state.blankIndex = blank;
        state.activeIndex = blank;
        state.slots = word.split('');
        state.slots[blank] = '';
        state.locked = word.split('').map((_, i) => i !== blank);
        els.prompt.textContent = 'Tap the missing letter';
    }

    function setupPicture() {
        const [word, emoji] = rand(PICTURE_WORDS);
        state.target = word;
        state.len = word.length;
        state.slots = Array(word.length).fill('');
        state.blankIndex = -1;
        state.activeIndex = 0;
        state.locked = Array(word.length).fill(false);
        signMat.map?.dispose();
        signMat.map = emojiTexture(emoji);
        signMat.needsUpdate = true;
        els.prompt.textContent = 'Spell what you see';
        setTimeout(() => speak(word), 700);
    }

    function setupFree() {
        state.target = '';
        state.len = 3;
        state.slots = ['', '', ''];
        state.blankIndex = -1;
        state.activeIndex = 0;
        state.locked = [false, false, false];
        els.prompt.textContent = 'Make your own word!';
    }

    /* ============================================================
       LETTER GRID
       ============================================================ */
    function renderGrid() {
        els.keys.querySelectorAll('.letter-btn').forEach(b => b.remove());
        let pool;
        if (state.mode === 1) {
            const fixed = state.target;
            const good = validLettersForBlank(fixed, state.blankIndex);
            const distractors = shuffle(ALPHABET.filter(l => !good.includes(l)));
            const set = new Set(good);
            for (const d of distractors) {
                if (set.size >= 6) break;
                set.add(d);
            }
            pool = shuffle([...set]);
        } else {
            pool = [...ALPHABET];
        }
        for (const L of pool) {
            const btn = document.createElement('button');
            btn.className = 'letter-btn ' + (VOWELS.includes(L) ? 'vowel' : 'consonant');
            btn.textContent = L;
            btn.addEventListener('click', () => placeLetter(L));
            els.keys.insertBefore(btn, els.speakBtn); // keep controls at the end
        }
    }

    function updateControls() {
        // speak: modes 1 & 2 (1 says the full target word as a hint)
        els.speakBtn.hidden = state.mode === 3;
        // backspace: modes 2 & 3 (free fill)
        els.backBtn.hidden = state.mode === 1;
    }

    /* ============================================================
       PLACE / REMOVE
       ============================================================ */
    function placeLetter(letter) {
        if (state.busy) return;
        if (state.mode === 1) {
            const i = state.blankIndex;
            state.slots[i] = letter;
            setCar(i, letter, 'filled');
            const word = state.slots.join('');
            if (validWords.has(word)) {
                state.activeIndex = -1;
                succeed(word);
            } else {
                wrongFeedback([i], () => {
                    state.slots[i] = '';
                    setCar(i, '', 'empty');
                });
            }
        } else {
            // fill next empty slot
            let idx = state.slots.indexOf('');
            if (idx === -1) return;
            state.slots[idx] = letter;
            setCar(idx, letter, 'filled');
            state.activeIndex = state.slots.indexOf('');
            if (state.slots.indexOf('') === -1) checkFilled();
        }
    }

    function backspace() {
        if (state.busy || state.mode === 1) return;
        let idx = -1;
        for (let i = state.slots.length - 1; i >= 0; i--) {
            if (state.slots[i] !== '') { idx = i; break; }
        }
        if (idx === -1) return;
        state.slots[idx] = '';
        setCar(idx, '', 'empty');
        state.activeIndex = idx;
    }

    function checkFilled() {
        const word = state.slots.join('');
        const ok = state.mode === 2 ? word === state.target : validWords.has(word);
        if (ok) {
            state.activeIndex = -1;
            succeed(word);
        } else {
            const all = state.slots.map((_, i) => i);
            wrongFeedback(all, () => {
                state.slots = state.slots.map(() => '');
                for (let i = 0; i < state.len; i++) setCar(i, '', 'empty');
                state.activeIndex = 0;
            });
        }
    }

    /* ============================================================
       FEEDBACK
       ============================================================ */
    function wrongFeedback(indices, after) {
        state.busy = true;
        boop();
        const until = elapsed + 0.45;
        indices.forEach(i => { cars[i].group.userData.shakeUntil = until; });
        setTimeout(() => { after(); state.busy = false; }, 480);
    }

    function succeed(word) {
        state.busy = true;
        const until = elapsed + 0.8;
        cars.forEach(c => { c.group.userData.bobUntil = until; });
        choo();
        sparkleBurst();
        addStar();
        setTimeout(() => {
            driveTween(-22, 1300, () => {
                if (state.pendingLevelUp) { state.pendingLevelUp = false; advanceLevel(); }
                else newRound();
            });
        }, 850);
    }

    function addStar() {
        state.stars = Math.min(STARS_TO_LEVEL, state.stars + 1);
        paintStars();
        if (state.stars >= STARS_TO_LEVEL && state.mode < 3) {
            state.pendingLevelUp = true;
        }
    }

    function paintStars() {
        [...els.stars.children].forEach((s, i) => s.classList.toggle('on', i < state.stars));
    }

    function advanceLevel() {
        const next = state.mode + 1;
        showToast(next === 2 ? '🎉 Level 2!\nSpell the picture' : '🎉 Level 3!\nMake your own words');
        setTimeout(() => setMode(next), 1400);
    }

    function showToast(text) {
        els.toast.textContent = text;
        els.toast.classList.remove('show');
        void els.toast.offsetWidth;
        els.toast.classList.add('show');
    }

    function sparkleBurst() {
        const emojis = ['✨', '⭐', '💫', '🌟'];
        const cx = window.innerWidth / 2;
        const cy = window.innerHeight * 0.5;
        for (let i = 0; i < 12; i++) {
            const s = document.createElement('div');
            s.className = 'sparkle';
            s.textContent = rand(emojis);
            s.style.left = (cx + (Math.random() - 0.5) * 360) + 'px';
            s.style.top = (cy + (Math.random() - 0.5) * 120) + 'px';
            s.style.animationDelay = (Math.random() * 0.2) + 's';
            document.body.appendChild(s);
            setTimeout(() => s.remove(), 1300);
        }
    }

    /* ============================================================
       MODE SWITCHING
       ============================================================ */
    function setMode(mode) {
        state.mode = mode;
        state.stars = 0;
        state.pendingLevelUp = false;
        paintStars();
        els.levelBtns.forEach(b => b.classList.toggle('active', +b.dataset.mode === mode));
        // snap train offscreen, then start fresh round
        state.busy = true;
        train.position.x = 16;
        newRound();
    }

    els.levelBtns.forEach(b => b.addEventListener('click', () => {
        if (state.busy && +b.dataset.mode === state.mode) return;
        setMode(+b.dataset.mode);
    }));

    /* ============================================================
       TRAIN MOTION
       ============================================================ */
    let tween = null;
    function driveTween(toX, dur, done) {
        tween = { from: train.position.x, to: toX, t: 0, dur, done };
    }

    /* ============================================================
       AUDIO
       ============================================================ */
    let audioCtx = null;
    function ac() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        return audioCtx;
    }
    function tone(freq, dur, type = 'sine', vol = 0.25) {
        const c = ac();
        const osc = c.createOscillator();
        const g = c.createGain();
        osc.connect(g); g.connect(c.destination);
        osc.type = type;
        osc.frequency.value = freq;
        g.gain.setValueAtTime(vol, c.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
        osc.start();
        osc.stop(c.currentTime + dur);
    }
    function choo() {
        tone(523, 0.18, 'triangle', 0.3);
        setTimeout(() => tone(659, 0.18, 'triangle', 0.3), 130);
        setTimeout(() => tone(784, 0.32, 'triangle', 0.3), 270);
    }
    function boop() { tone(200, 0.18, 'sine', 0.22); }

    function speak(word) {
        if (!('speechSynthesis' in window)) return;
        try {
            speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(word);
            u.rate = 0.8; u.pitch = 1.15;
            speechSynthesis.speak(u);
        } catch (e) { /* ignore */ }
    }

    els.speakBtn.addEventListener('click', () => {
        if (state.mode === 2 || state.mode === 1) speak(state.target);
    });
    els.backBtn.addEventListener('click', backspace);

    /* ============================================================
       KEYBOARD
       ============================================================ */
    document.addEventListener('keydown', (e) => {
        const k = e.key.toLowerCase();
        if (/^[a-z]$/.test(k)) {
            // honor mode-1 limited grid by checking grid contents
            if (state.mode === 1) {
                const available = [...els.keys.querySelectorAll('.letter-btn')].some(b => b.textContent === k);
                if (available) placeLetter(k);
            } else {
                placeLetter(k);
            }
        } else if (k === 'backspace') {
            e.preventDefault();
            backspace();
        }
    });

    /* ============================================================
       RENDER LOOP
       ============================================================ */
    const clock = new THREE.Clock();
    let elapsed = 0;
    const dockEl = document.querySelector('.dock');
    function frameScene() {
        const w = window.innerWidth, h = window.innerHeight;
        renderer.setSize(w, h, false);
        const aspect = w / h;
        camera.aspect = aspect;
        const vHalf = THREE.MathUtils.degToRad(camera.fov / 2);
        const hHalf = Math.atan(Math.tan(vHalf) * aspect);
        // Dolly so the whole train (~8 wide, centred on x=-1.2) fits horizontally.
        const dist = Math.min(34, Math.max(9, 4.8 / Math.tan(hHalf)));
        // Aim so the train sits just above the letter keyboard (which varies in
        // height by mode) and is never covered by it.
        let f = 0.68; // train-centre screen fraction (fallback)
        if (dockEl) {
            const dockTopFrac = dockEl.getBoundingClientRect().top / h;
            f = Math.max(0.40, Math.min(0.68, dockTopFrac - 0.15));
        }
        const ndcY = 1 - 2 * f; // desired NDC.y of the car centre (world y ≈ 1.05)
        camTarget.y = 1.05 - ndcY * dist * Math.tan(vHalf);
        camera.position.copy(camTarget).add(camDir.clone().multiplyScalar(dist));
        camera.lookAt(camTarget);
        camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', frameScene);
    frameScene();

    function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.05);
        elapsed += dt;
        const t = elapsed;

        // train motion tween
        let moving = false;
        if (tween) {
            tween.t += dt * 1000;
            const p = Math.min(1, tween.t / tween.dur);
            const e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; // easeInOut
            train.position.x = tween.from + (tween.to - tween.from) * e;
            moving = p < 1;
            if (p >= 1) { const d = tween.done; tween = null; d && d(); }
        }
        if (moving) {
            for (const w of spinWheels) w.rotation.z -= dt * 6;
        }

        // billowing smoke from the stack
        for (const p of smokePuffs) {
            const tt = (t * 0.55 + p.userData.off) % 4.6;
            p.position.set(-1.2 + tt * 0.28 + Math.sin(tt * 1.3) * 0.12, smokeBaseY + tt * 0.82, 0);
            const k = tt / 4.6;
            p.scale.setScalar(0.4 + k * 1.25);
            p.userData.mat.opacity = 0.72 * (1 - k);
        }

        // car effects
        for (let i = 0; i < cars.length; i++) {
            const ud = cars[i].group.userData;
            let yOff = 0, xOff = 0, sc = 1;
            if (t < ud.bobUntil) {
                yOff = Math.abs(Math.sin((ud.bobUntil - t) * 14)) * 0.3;
            }
            if (t < ud.shakeUntil) {
                xOff = Math.sin((ud.shakeUntil - t) * 50) * 0.12;
            }
            if (i === state.activeIndex && !moving) {
                yOff += (Math.sin(t * 3) * 0.5 + 0.5) * 0.12;
                sc = 1 + (Math.sin(t * 3) * 0.5 + 0.5) * 0.05;
            }
            cars[i].group.position.y = yOff;
            cars[i].group.position.x = ud.baseX + xOff;
            cars[i].group.scale.setScalar(sc);
        }

        // drifting clouds
        for (const c of clouds) {
            c.position.x += dt * 0.4;
            if (c.position.x > 22) c.position.x = -22;
        }

        // sign faces camera
        sign.lookAt(camera.position.x, sign.position.y + 4, camera.position.z);

        renderer.render(scene, camera);
    }

    /* ============================================================
       GO
       ============================================================ */
    buildCars(3);
    newRound();
    paintStars();
    animate();
    </script>
</body>
