<style>
  :root { --ink: #4a3a35; --muted: #6e5b40; --panel: #fffdf4; --panel-strong: #ffe9bd; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: ui-rounded, "Arial Rounded MT Bold", "Nunito", system-ui, sans-serif;
    background: linear-gradient(#8a9d6e 0 56%, #6b8a4f 56% 100%);
    color: var(--ink);
    -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
  }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }

  .ui {
    position: fixed; inset: 0; z-index: 2;
    display: flex; flex-direction: column; justify-content: space-between;
    pointer-events: none;
    padding: max(46px, calc(env(safe-area-inset-top) + 8px)) max(14px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
  }
  .ui > * { pointer-events: auto; }

  .top { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .toprow { width: 100%; display: flex; align-items: flex-start; justify-content: flex-end; }
  .score-bar { display: flex; gap: 6px; align-items: center; }
  .trophy { font-size: 26px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.25)); }
  .score-num { font-size: 30px; font-weight: 1000; color: #e0852a; text-shadow: 0 2px 4px rgba(0,0,0,0.18); }
  .streak-bar { display: flex; gap: 5px; margin-top: 6px; }
  .streak-dot { width: 15px; height: 15px; border-radius: 50%; background: rgba(74,58,53,0.22); transition: background .3s, transform .3s; }
  .streak-dot.lit { background: #4caf50; transform: scale(1.2); box-shadow: 0 0 8px rgba(76,175,80,0.5); }
  .streak-dot.miss { background: #e57373; transform: scale(1.2); }

  .prompt {
    align-self: center;
    padding: 9px 22px;
    background: rgba(255,253,244,0.92);
    border: 3px solid var(--ink); border-radius: 999px;
    box-shadow: 0 5px 0 rgba(74,58,53,0.18);
    font-size: clamp(1.05rem, 3.6vw, 1.45rem); font-weight: 1000; text-align: center;
  }
  .counter {
    align-self: center;
    min-width: 56px; padding: 4px 16px;
    background: var(--panel-strong); border: 3px solid var(--ink); border-radius: 999px;
    box-shadow: 0 4px 0 rgba(74,58,53,0.18);
    font-size: clamp(1.1rem, 4vw, 1.6rem); font-weight: 1000; text-align: center;
    opacity: 0; transform: scale(0.6); transition: opacity .2s, transform .2s;
  }
  .counter.show { opacity: 1; transform: scale(1); }

  .dock { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .choices { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
  .choice {
    width: clamp(62px, 16vw, 88px); height: clamp(62px, 16vw, 88px);
    font-size: clamp(2rem, 7vw, 3rem); font-weight: 1000;
    border: 4px solid var(--ink); border-radius: 18px; cursor: pointer;
    color: var(--ink); font-family: inherit; background: var(--panel-strong);
    box-shadow: 0 6px 0 rgba(74,58,53,0.2);
    transition: transform 70ms ease, box-shadow 70ms ease, background 120ms;
  }
  .choice:active { transform: translateY(5px); box-shadow: 0 1px 0 rgba(74,58,53,0.2); }
  .choice.wrong { animation: shake 0.4s ease; background: #f4b8b0; }
  .choice.right { background: #aee5a0; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

  .level-badge {
    align-self: center;
    background: rgba(74,58,53,0.34); color: #fff;
    padding: 6px 18px; border-radius: 20px; font-size: 13px; font-weight: 800; letter-spacing: 1px;
    cursor: pointer; backdrop-filter: blur(4px);
  }
  .level-picker {
    position: fixed; bottom: 64px; left: 50%; transform: translateX(-50%); z-index: 25;
    background: #3a2e22; border: 2px solid rgba(255,255,255,0.2); border-radius: 12px; padding: 8px 0;
    display: none; min-width: 220px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); pointer-events: auto;
  }
  .level-picker.open { display: block; }
  .level-option { padding: 10px 16px; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; justify-content: space-between; gap: 12px; }
  .level-option:hover { background: rgba(255,255,255,0.1); }
  .level-option.active { background: rgba(224,133,42,0.22); color: #f6c84a; }
  .level-range { font-weight: 400; opacity: 0.6; }

  .sparkle { position: fixed; z-index: 4; font-size: 1.7rem; pointer-events: none; animation: sparkleFloat 1.1s ease-out forwards; }
  @keyframes sparkleFloat { 0%{opacity:.95;transform:translate(-50%,0) scale(.5) rotate(0)} 100%{opacity:0;transform:translate(-50%,-120px) scale(1.1) rotate(120deg)} }
  .confetti-piece { position: fixed; z-index: 50; pointer-events: none; }
  @keyframes confetti-fall { 0%{transform:translateY(-10px) rotate(0);opacity:1} 100%{transform:translateY(100vh) rotate(720deg);opacity:0} }

  footer { position: fixed; bottom: 4px; right: 10px; z-index: 3; font-size: 0.72rem; color: var(--muted); opacity: 0.8; }
  footer a { color: inherit; }
  @media (prefers-reduced-motion: reduce) { .sparkle { animation-duration: 0.01ms; } }

<body>

<div class="ui">

        <div class="score-bar"><span class="trophy">🍎</span><span class="score-num" id="score">0</span></div>
        <div class="streak-bar" id="streak-bar"></div>
      </div>

    <div class="counter" id="counter">0</div>
  </div>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   CONFIG
   ============================================================ */
const LEVELS = [
  { name: 'Little Counter', min: 1, max: 5 },
  { name: 'Counting Up',    min: 2, max: 10 },
  { name: 'Big Counter',    min: 5, max: 15 },
  { name: 'Super Counter',  min: 8, max: 20 },
];
const FRUITS = [
  { name: 'apples',  color: 0xc0473a, emoji: '🍎' },
  { name: 'oranges', color: 0xe0892e, emoji: '🍊' },
  { name: 'plums',   color: 0x8e5470, emoji: '🟣' },
  { name: 'lemons',  color: 0xe2c84a, emoji: '🍋' },
];

let score = 0, level = 0, streak = 0, roundHistory = [];
let target = 0, counted = 0, locked = false, fruit = FRUITS[0];

/* ============================================================
   DOM
   ============================================================ */
const scoreEl = document.getElementById('score');
const streakBar = document.getElementById('streak-bar');
const promptEl = document.getElementById('prompt');
const counterEl = document.getElementById('counter');
const choicesEl = document.getElementById('choices');
const levelBadge = document.getElementById('level-badge');
for (let i = 0; i < 5; i++) { const d = document.createElement('div'); d.className = 'streak-dot'; streakBar.appendChild(d); }

/* ============================================================
   AUDIO
   ============================================================ */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function tone(freq, dur, type = 'sine', vol = 0.2) {
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination); o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.start(); o.stop(audioCtx.currentTime + dur);
}
function popSound(n) { tone(420 + n * 35, 0.16, 'triangle', 0.25); }
function successSound() { [523, 659, 784].forEach((f, i) => setTimeout(() => tone(f, 0.35, 'sine', 0.22), i * 110)); }
function boop() { tone(190, 0.18, 'sine', 0.2); }
function speak(text) {
  if (!('speechSynthesis' in window)) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.rate = 0.9; u.pitch = 1.2; speechSynthesis.speak(u); } catch (e) {}
}

/* ============================================================
   THREE.JS SCENE
   ============================================================ */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x7e9163);

const camera = new THREE.PerspectiveCamera(46, 1, 0.1, 100);
const camTarget = new THREE.Vector3(0, 2.5, 2.4);
const camDir = new THREE.Vector3(0, 0.3, 0.95).normalize(); // flatter, head-on storybook view

// Soft painterly lighting
scene.add(new THREE.HemisphereLight(0xf4f0dc, 0x6a7a4a, 1.05));
const sun = new THREE.DirectionalLight(0xfff4dc, 0.9);
sun.position.set(-6, 11, 7); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -16; sun.shadow.camera.right = 16; sun.shadow.camera.top = 16; sun.shadow.camera.bottom = -6;
sun.shadow.bias = -0.0004;
scene.add(sun);

// Sage back wall with soft leaf-shadow blobs
const wall = new THREE.Mesh(new THREE.PlaneGeometry(80, 36), new THREE.MeshStandardMaterial({ color: 0x7e9163, roughness: 1 }));
wall.position.set(0, 8, -12); scene.add(wall);
const blobMat = new THREE.MeshBasicMaterial({ color: 0x647949, transparent: true, opacity: 0.5 });
[[-4.5, 5.5, 4], [5, 6.5, 4.6], [1.5, 9.5, 3.2], [-7.5, 9.5, 2.6]].forEach(([x, y, r]) => {
  const b = new THREE.Mesh(new THREE.CircleGeometry(r, 22), blobMat); b.position.set(x, y, -11.6); scene.add(b);
});

// Green floor band
const floor = new THREE.Mesh(new THREE.PlaneGeometry(90, 50), new THREE.MeshStandardMaterial({ color: 0x6b8a4f, roughness: 1 }));
floor.rotation.x = -Math.PI / 2; floor.position.set(0, 0, 0); floor.receiveShadow = true; scene.add(floor);

// Wooden table the fruit rests on
const TABLE_TOP = 1.65;
function woodTexture() {
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 64; const ctx = cv.getContext('2d');
  ctx.fillStyle = '#d6c193'; ctx.fillRect(0, 0, 256, 64);
  ctx.strokeStyle = 'rgba(120,92,52,0.35)'; ctx.lineWidth = 2;
  for (let y = 10; y < 64; y += 16) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(256, y); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(120,92,52,0.12)';
  for (let i = 0; i < 14; i++) { const yy = Math.random() * 64; ctx.beginPath(); ctx.moveTo(0, yy); ctx.bezierCurveTo(80, yy + 3, 160, yy - 3, 256, yy); ctx.stroke(); }
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(3, 1); return t;
}
const tableTop = new THREE.Mesh(new THREE.BoxGeometry(20, 0.5, 4), new THREE.MeshStandardMaterial({ map: woodTexture(), color: 0xe8dcb8, roughness: 0.85 }));
tableTop.position.set(0, TABLE_TOP - 0.25, 2.4); tableTop.receiveShadow = true; scene.add(tableTop);
const apron = new THREE.Mesh(new THREE.BoxGeometry(20, 0.95, 0.4), new THREE.MeshStandardMaterial({ color: 0x9a7444, roughness: 0.9 }));
apron.position.set(0, TABLE_TOP - 0.88, 4.35); apron.castShadow = true; scene.add(apron);

// Corner-framing fruit trees
function makeCornerTree(x, z) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 1.0, 7, 12), new THREE.MeshStandardMaterial({ color: 0x5a3d24, roughness: 1 }));
  trunk.position.y = 3.5; trunk.castShadow = true; g.add(trunk);
  const folMat = new THREE.MeshStandardMaterial({ color: 0x3f5a30, roughness: 1 });
  [[0, 7.4, 0, 3.0], [-2.6, 6.8, 0.4, 2.1], [2.6, 7.0, -0.3, 2.3], [0.3, 9.3, -0.4, 2.2], [-1.7, 8.9, 0.5, 1.7], [1.9, 8.7, 0.2, 1.8]].forEach(([dx, dy, dz, r]) => {
    const f = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 14), folMat); f.position.set(dx, dy, dz); f.castShadow = true; g.add(f);
  });
  const lemonMat = new THREE.MeshStandardMaterial({ color: 0xe8cf52, roughness: 0.55 });
  for (let i = 0; i < 11; i++) { const fr = new THREE.Mesh(new THREE.SphereGeometry(0.4, 10, 10), lemonMat); fr.scale.y = 1.3; fr.position.set((Math.random() - 0.5) * 5, 5.2 + Math.random() * 3.6, (Math.random() - 0.5) * 2.2 + 0.7); g.add(fr); }
  g.position.set(x, 0, z); scene.add(g);
}
makeCornerTree(-10.5, -4.5); makeCornerTree(10.5, -4.5);

const clouds = [];

/* ---- Fruit objects ---- */
const fruitMat = new THREE.MeshStandardMaterial({ color: 0xe23b34, roughness: 0.45 });
const leafMat = new THREE.MeshStandardMaterial({ color: 0x5fa84a, roughness: 0.8 });
const stemMat = new THREE.MeshStandardMaterial({ color: 0x7a5230, roughness: 0.9 });
let fruits = [];
function makeFruit() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.5, 18, 16), fruitMat.clone());
  body.scale.y = 0.92; body.castShadow = true; g.add(body);
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.06, 0.3, 8), stemMat); stem.position.y = 0.5; g.add(stem);
  const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.16, 8, 8), leafMat); leaf.scale.set(1.4, 0.25, 0.7); leaf.position.set(0.16, 0.52, 0); g.add(leaf);
  g.userData = { body };
  return g;
}
function layoutFruits(n) {
  fruits.forEach(f => {
    scene.remove(f);
    f.traverse(o => { if (o.isMesh) { o.geometry.dispose(); o.material.dispose(); } });
  });
  fruits = [];
  const perRow = Math.min(7, Math.ceil(Math.sqrt(n * 1.6)));
  const rows = Math.ceil(n / perRow);
  const sx = 1.25, sz = 0.95;
  const restY = TABLE_TOP + 0.46; // sit on the table top
  for (let r = 0; r < rows; r++) {
    const inRow = Math.min(perRow, n - r * perRow);
    for (let c = 0; c < inRow; c++) {
      const group = makeFruit();
      const x = (c - (inRow - 1) / 2) * sx;
      const z = 2.7 - (r - (rows - 1) / 2) * sz; // front rows nearer the camera
      group.userData.baseX = x; group.userData.baseZ = z;
      group.userData.baseY = restY; group.userData.counted = false;
      group.userData.phase = Math.random() * Math.PI * 2;
      group.position.set(x, restY, z);
      group.userData.body.material.color.set(fruit.color);
      scene.add(group);
      fruits.push(group);
    }
  }
}

/* ============================================================
   HELPERS
   ============================================================ */
function randInt(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function updateStreakBar() {
  const dots = streakBar.querySelectorAll('.streak-dot');
  const recent = roundHistory.slice(-5);
  dots.forEach((d, i) => { d.className = 'streak-dot'; if (i < recent.length) d.classList.add(recent[i] ? 'lit' : 'miss'); });
}
function confetti() {
  const colors = ['#f6c84a','#e23b34','#5fa84a','#83b6c8','#f08a2c','#8e5fb0'];
  for (let i = 0; i < 38; i++) {
    const c = document.createElement('div'); c.className = 'confetti-piece';
    c.style.left = Math.random() * 100 + 'vw'; c.style.top = '-10px';
    c.style.background = colors[Math.random() * colors.length | 0];
    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    c.style.width = (6 + Math.random() * 8) + 'px'; c.style.height = (6 + Math.random() * 8) + 'px';
    c.style.animation = `confetti-fall ${1.5 + Math.random() * 2}s ease-out forwards`;
    c.style.animationDelay = Math.random() * 0.5 + 's';
    document.body.appendChild(c); setTimeout(() => c.remove(), 4000);
  }
}
function sparkleBurst() {
  const e = ['✨', '⭐', '💫', '🌟']; const cx = innerWidth / 2, cy = innerHeight * 0.42;
  for (let i = 0; i < 10; i++) {
    const s = document.createElement('div'); s.className = 'sparkle'; s.textContent = e[Math.floor(Math.random() * e.length)];
    s.style.left = (cx + (Math.random() - 0.5) * 320) + 'px'; s.style.top = (cy + (Math.random() - 0.5) * 120) + 'px';
    s.style.animationDelay = (Math.random() * 0.2) + 's'; document.body.appendChild(s); setTimeout(() => s.remove(), 1300);
  }
}

/* ============================================================
   ROUND FLOW
   ============================================================ */
function makeChoices() {
  const set = new Set([target]);
  const lv = LEVELS[level];
  while (set.size < (lv.max <= 5 ? 3 : 4)) {
    let d = target + (Math.random() < 0.5 ? -1 : 1) * randInt(1, 2);
    if (d >= 1 && d <= 20) set.add(d);
  }
  return shuffle([...set]);
}
function renderChoices() {
  choicesEl.innerHTML = '';
  makeChoices().forEach(n => {
    const b = document.createElement('button'); b.className = 'choice'; b.textContent = n;
    b.addEventListener('click', () => answer(n, b));
    choicesEl.appendChild(b);
  });
}

function newRound() {
  locked = false;
  counted = 0;
  counterEl.classList.remove('show');
  counterEl.textContent = '0';
  fruit = FRUITS[Math.floor(Math.random() * FRUITS.length)];
  const lv = LEVELS[level];
  target = randInt(lv.min, lv.max);
  promptEl.textContent = 'Count the ' + fruit.name + '!';
  layoutFruits(target);
  renderChoices();
  levelBadge.textContent = lv.name;
  frameScene();
}

function countFruit(group) {
  if (group.userData.counted) return;
  group.userData.counted = true;
  counted++;
  group.userData.popUntil = clock.getElapsedTime() + 0.4;
  counterEl.classList.add('show');
  counterEl.textContent = counted;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  popSound(counted);
  speak(String(counted));
}

function answer(n, btn) {
  if (locked) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  if (n === target) {
    locked = true;
    btn.classList.add('right');
    // count any uncounted fruit, celebrate
    fruits.forEach(f => { f.userData.counted = true; f.userData.popUntil = clock.getElapsedTime() + 0.6 + Math.random() * 0.3; });
    score++; streak++; scoreEl.textContent = score;
    roundHistory.push(true);
    if (streak > 0 && streak % 5 === 0 && level < LEVELS.length - 1) { level++; }
    if (roundHistory.length > 5) roundHistory = [roundHistory[roundHistory.length - 1]];
    updateStreakBar();
    counterEl.classList.add('show'); counterEl.textContent = target;
    promptEl.textContent = ['Yay! ' + target + '!', 'Great counting!', 'You got it — ' + target + '!'][Math.floor(Math.random() * 3)];
    successSound(); confetti(); sparkleBurst();
    setTimeout(newRound, 2600);
  } else {
    btn.classList.add('wrong');
    boop();
    streak = 0; roundHistory.push(false);
    if (roundHistory.length > 5) roundHistory = [roundHistory[roundHistory.length - 1]];
    updateStreakBar();
    setTimeout(() => btn.classList.remove('wrong'), 450);
  }
}

// Tap a fruit to count it
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
canvas.addEventListener('pointerdown', (e) => {
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  for (const f of fruits) {
    if (raycaster.intersectObject(f, true).length) { countFruit(f); break; }
  }
});

/* ============================================================
   RENDER LOOP
   ============================================================ */
const clock = new THREE.Clock();
const dockEl = document.querySelector('.dock');
function frameScene() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  const aspect = w / h; camera.aspect = aspect;
  const vHalf = THREE.MathUtils.degToRad(camera.fov / 2);
  const hHalf = Math.atan(Math.tan(vHalf) * aspect);
  // frame the table + fruit, with the trees framing the top corners
  const spread = 5.0 + Math.min(2.0, (target || 6) * 0.08);
  const dist = Math.min(30, Math.max(10, Math.max(spread / Math.tan(hHalf), 4.2 / Math.tan(vHalf))));
  camera.position.copy(camTarget).add(camDir.clone().multiplyScalar(dist));
  camera.lookAt(camTarget);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', frameScene);

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.getElapsedTime();
  for (const f of fruits) {
    const u = f.userData;
    let y = u.baseY + Math.sin(t * 1.6 + u.phase) * 0.025;
    let sc = 1;
    if (t < u.popUntil) { const k = (u.popUntil - t); y += Math.abs(Math.sin(k * 16)) * 0.5; sc = 1 + Math.sin(k * 16) * 0.12; }
    if (u.counted) f.rotation.y += dt * 1.4;
    f.position.set(u.baseX, y, u.baseZ);
    f.scale.setScalar(sc);
  }
  for (const c of clouds) { c.position.x += dt * 0.3; if (c.position.x > 18) c.position.x = -18; }
  renderer.render(scene, camera);
}

/* ============================================================
   LEVEL PICKER
   ============================================================ */
window.toggleLevelPicker = function () {
  const p = document.getElementById('level-picker');
  if (p.classList.contains('open')) { p.classList.remove('open'); return; }
  p.innerHTML = '';
  LEVELS.forEach((lv, i) => {
    const o = document.createElement('div'); o.className = 'level-option' + (i === level ? ' active' : '');
    o.innerHTML = '<span>' + lv.name + '</span><span class="level-range">' + lv.min + '–' + lv.max + '</span>';
    o.onclick = (e) => { e.stopPropagation(); level = i; streak = 0; roundHistory = []; updateStreakBar(); p.classList.remove('open'); newRound(); };
    p.appendChild(o);
  });
  p.classList.add('open');
};
document.addEventListener('click', (e) => {
  if (!e.target.closest('.level-picker') && !e.target.closest('.level-badge')) document.getElementById('level-picker').classList.remove('open');
});

// Start
frameScene();
newRound();
animate();
</script>
</body>
