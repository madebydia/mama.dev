<div class="ui">

<script type="module">
import * as THREE from 'three';

/* ============================================================
   CONFIG
   ============================================================ */
const LEVELS = [
  { name: 'By Tens',  k: 10 },
  { name: 'By Fives', k: 5 },
  { name: 'By Twos',  k: 2 },
  { name: 'Mix It Up', k: 0 }, // random each crossing
];
const N_STONES = 6;

let score = 0, level = 0, streak = 0, roundHistory = [];
let k = 10, seq = [], duckAt = 0, target = 0, locked = false, hopping = false;

const scoreEl = document.getElementById('score');
const streakBar = document.getElementById('streak-bar');
const promptEl = document.getElementById('prompt');
const choicesEl = document.getElementById('choices');
const levelBadge = document.getElementById('level-badge');
for (let i = 0; i < 5; i++) { const d = document.createElement('div'); d.className = 'streak-dot'; streakBar.appendChild(d); }

/* ============================================================
   AUDIO
   ============================================================ */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function tone(freq, dur, type = 'sine', vol = 0.2) {
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination); o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.start(); o.stop(audioCtx.currentTime + dur);
}
function quack() { tone(340, 0.09, 'square', 0.1); setTimeout(() => tone(300, 0.11, 'square', 0.1), 100); }
function successSound() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 0.3, 'sine', 0.2), i * 95)); }
function boop() { tone(190, 0.18, 'sine', 0.2); }
function speak(text) { if (!('speechSynthesis' in window)) return; try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.rate = 0.9; u.pitch = 1.15; speechSynthesis.speak(u); } catch (e) {} }

/* ============================================================
   THREE.JS SCENE — river crossing
   ============================================================ */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xa8c8d4, 26, 60);
function skyTexture() {
  const cv = document.createElement('canvas'); cv.width = 16; cv.height = 256;
  const ctx = cv.getContext('2d'); const g = ctx.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, '#8fc0d4'); g.addColorStop(0.6, '#b8d8dc'); g.addColorStop(1, '#d4e8dc');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 16, 256);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t;
}
scene.background = skyTexture();

const camera = new THREE.PerspectiveCamera(46, 1, 0.1, 100);
const camTarget = new THREE.Vector3(0, -1.4, -1.7);
const camDir = new THREE.Vector3(0, 0.62, 0.79).normalize();

scene.add(new THREE.HemisphereLight(0xf0f8f4, 0x4a7a6a, 1.0));
const sun = new THREE.DirectionalLight(0xfff4dc, 0.95);
sun.position.set(-6, 12, 7); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -12; sun.shadow.camera.right = 12; sun.shadow.camera.top = 12; sun.shadow.camera.bottom = -12;
sun.shadow.bias = -0.0004;
scene.add(sun);

// River + banks
const river = new THREE.Mesh(new THREE.PlaneGeometry(160, 90), new THREE.MeshStandardMaterial({ color: 0x5a94b8, roughness: 0.75 }));
river.rotation.x = -Math.PI / 2; river.receiveShadow = true; scene.add(river);
const bankMat = new THREE.MeshStandardMaterial({ color: 0x6fa858, roughness: 1 });
const backBank = new THREE.Mesh(new THREE.PlaneGeometry(160, 22), bankMat);
backBank.rotation.x = -Math.PI / 2; backBank.position.set(0, 0.02, -15.5); backBank.receiveShadow = true; scene.add(backBank);
const frontBank = new THREE.Mesh(new THREE.PlaneGeometry(160, 12), bankMat);
frontBank.rotation.x = -Math.PI / 2; frontBank.position.set(0, 0.02, 10.8); frontBank.receiveShadow = true; scene.add(frontBank);

// Forest on the far bank
const pineMat = new THREE.MeshStandardMaterial({ color: 0x3f6a44, roughness: 1 });
const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6a4a30, roughness: 1 });
for (let i = 0; i < 12; i++) {
  const x = -14 + i * 2.6 + (Math.random() - 0.5), z = -5.5 - Math.random() * 4, s = 0.8 + Math.random() * 0.7;
  const tr = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.14, 0.7, 6), trunkMat);
  tr.position.set(x, 0.35 * s, z); tr.scale.setScalar(s); scene.add(tr);
  [[1.2, 0.8, 1.1], [1.8, 0.6, 0.85], [2.3, 0.42, 0.62]].forEach(([y, r, hh]) => {
    const c = new THREE.Mesh(new THREE.ConeGeometry(r, hh, 8), pineMat);
    c.position.set(x, y * s, z); c.scale.setScalar(s); c.castShadow = true; scene.add(c);
  });
}
// Reeds on the near bank
const reedMat = new THREE.MeshStandardMaterial({ color: 0x5a8a4a, roughness: 1 });
for (let i = 0; i < 10; i++) {
  const x = -12 + Math.random() * 24;
  const r = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.05, 0.9 + Math.random() * 0.5, 5), reedMat);
  r.position.set(x, 0.5, 5.4 + Math.random() * 1.2); r.rotation.z = (Math.random() - 0.5) * 0.2; scene.add(r);
}

/* ---- Stones with numbers ---- */
function numberTexture(text) {
  const S = 256; const cv = document.createElement('canvas'); cv.width = cv.height = S; const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, S, S);
  ctx.fillStyle = '#eef2ec';
  ctx.beginPath(); ctx.arc(S / 2, S / 2, 100, 0, Math.PI * 2); ctx.fill();
  ctx.lineWidth = 10; ctx.strokeStyle = '#5a6a64'; ctx.stroke();
  ctx.fillStyle = '#2a3e46';
  ctx.font = '900 ' + (String(text).length > 2 ? 92 : 110) + 'px ui-rounded, Arial, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(String(text), S / 2, S / 2 + 6);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
}
// Stones cross the river front-to-back (the duck hops AWAY from the camera to the far bank)
const stones = [];
const START_Z = 2.2, STONE_STEP_Z = 1.3;
for (let i = 0; i < N_STONES; i++) {
  const g = new THREE.Group();
  const stone = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.95, 0.34, 18), new THREE.MeshStandardMaterial({ color: 0x9aa4a0, roughness: 0.95 }));
  stone.castShadow = true; stone.receiveShadow = true; g.add(stone);
  const numMat = new THREE.MeshBasicMaterial({ map: numberTexture('?'), transparent: true });
  const label = new THREE.Mesh(new THREE.CircleGeometry(0.62, 24), numMat);
  label.rotation.x = -Math.PI / 2; label.position.y = 0.18; g.add(label);
  g.position.set(i % 2 === 0 ? -0.85 : 0.85, 0.16, START_Z - i * STONE_STEP_Z);
  g.userData = { numMat, phase: Math.random() * 6 };
  scene.add(g);
  stones.push(g);
}

/* ---- Duck ---- */
const duck = new THREE.Group();
const duckMat = new THREE.MeshStandardMaterial({ color: 0xf0d060, roughness: 0.7 });
const dBody = new THREE.Mesh(new THREE.SphereGeometry(0.42, 18, 14), duckMat);
dBody.scale.set(1.2, 0.85, 0.95); dBody.position.y = 0.4; dBody.castShadow = true; duck.add(dBody);
const dTail = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.35, 10), duckMat);
dTail.rotation.z = -Math.PI / 2 - 0.5; dTail.position.set(-0.48, 0.52, 0); duck.add(dTail);
const dHead = new THREE.Mesh(new THREE.SphereGeometry(0.24, 16, 12), duckMat);
dHead.position.set(0.36, 0.85, 0); dHead.castShadow = true; duck.add(dHead);
const dBeak = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.28, 10), new THREE.MeshStandardMaterial({ color: 0xe08a2e, roughness: 0.6 }));
dBeak.rotation.z = -Math.PI / 2; dBeak.position.set(0.62, 0.82, 0); duck.add(dBeak);
for (const dz of [-0.13, 0.13]) {
  const eye = new THREE.Mesh(new THREE.SphereGeometry(0.045, 8, 6), new THREE.MeshStandardMaterial({ color: 0x1f1a12 }));
  eye.position.set(0.5, 0.92, dz); duck.add(eye);
}
const wing = new THREE.Mesh(new THREE.SphereGeometry(0.2, 12, 8), new THREE.MeshStandardMaterial({ color: 0xdcb84a, roughness: 0.75 }));
wing.scale.set(1.2, 0.55, 0.7); wing.position.set(-0.05, 0.5, 0.32); duck.add(wing);
const wing2 = wing.clone(); wing2.position.z = -0.32; duck.add(wing2);
duck.rotation.y = Math.PI / 2; // face away from the camera, toward the far bank
scene.add(duck);
let hopAnim = null;
function duckPos(i) { const s = stones[i]; return new THREE.Vector3(s.position.x, 0.35, s.position.z); }
function placeDuck(i) { const p = duckPos(i); duck.position.copy(p); }
function hopDuck(i, done) {
  const from = duck.position.clone(), to = duckPos(i);
  hopAnim = { from, to, t: 0, dur: 0.55, done };
  quack();
}

/* ============================================================
   HELPERS
   ============================================================ */
function randInt(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function updateStreakBar() {
  const dots = streakBar.querySelectorAll('.streak-dot');
  const recent = roundHistory.slice(-5);
  dots.forEach((d, i) => { d.className = 'streak-dot'; if (i < recent.length) d.classList.add(recent[i] ? 'lit' : 'miss'); });
}
function confetti() {
  const colors = ['#f0d060', '#e08a2e', '#5a94b8', '#6fa858', '#eef2ec'];
  for (let i = 0; i < 40; i++) { const c = document.createElement('div'); c.className = 'confetti-piece';
    c.style.left = Math.random() * 100 + 'vw'; c.style.top = '-10px'; c.style.background = colors[Math.random() * colors.length | 0];
    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px'; c.style.width = (6 + Math.random() * 8) + 'px'; c.style.height = (6 + Math.random() * 8) + 'px';
    c.style.animation = `confetti-fall ${1.5 + Math.random() * 2}s ease-out forwards`; c.style.animationDelay = Math.random() * 0.5 + 's';
    document.body.appendChild(c); setTimeout(() => c.remove(), 4000);
  }
}
function sparkleBurst() {
  const e = ['✨', '⭐', '💫', '🦆']; const cx = innerWidth / 2, cy = innerHeight * 0.5;
  for (let i = 0; i < 10; i++) { const s = document.createElement('div'); s.className = 'sparkle'; s.textContent = e[Math.floor(Math.random() * e.length)];
    s.style.left = (cx + (Math.random() - 0.5) * 320) + 'px'; s.style.top = (cy + (Math.random() - 0.5) * 120) + 'px'; s.style.animationDelay = (Math.random() * 0.2) + 's';
    document.body.appendChild(s); setTimeout(() => s.remove(), 1300);
  }
}

/* ============================================================
   ROUND FLOW
   ============================================================ */
function setStone(i, text) {
  const s = stones[i];
  s.userData.numMat.map.dispose();
  s.userData.numMat.map = numberTexture(text);
  s.userData.numMat.needsUpdate = true;
}

function newCrossing() {
  locked = false; hopping = false;
  const lv = LEVELS[level];
  k = lv.k || rand([2, 5, 10]);
  seq = [];
  for (let i = 0; i < N_STONES; i++) seq.push(k * (i + 1));
  duckAt = 0;
  for (let i = 0; i < N_STONES; i++) setStone(i, i === 0 ? seq[0] : '?');
  placeDuck(0);
  target = seq[1];
  renderChoices();
  promptEl.innerHTML = 'Count by <b>' + k + 's</b>! What comes after <b>' + seq[0] + '</b>?';
  levelBadge.textContent = lv.name + (lv.k ? '' : ' (' + k + 's)');
  speak('Count by ' + k + 's! The duck starts on ' + seq[0] + '. What comes next?');
}

function makeChoices() {
  const set = new Set([target]);
  const candidates = [target + k, target - k, target + 1, target - 1, target + Math.max(1, Math.floor(k / 2)), target + 2 * k];
  let ci = 0, guard = 0;
  while (set.size < 3 && guard++ < 50) {
    const d = candidates[ci++ % candidates.length] + (ci > candidates.length ? randInt(1, 5) : 0);
    if (d > 0 && d !== target) set.add(d);
  }
  return shuffle([...set]);
}
function renderChoices() {
  choicesEl.innerHTML = '';
  makeChoices().forEach(n => {
    const btn = document.createElement('button'); btn.className = 'choice'; btn.textContent = n;
    btn.addEventListener('click', () => answer(n, btn));
    choicesEl.appendChild(btn);
  });
}

function answer(n, btn) {
  if (locked || hopping) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  if (n === target) {
    hopping = true;
    btn.classList.add('right');
    const next = duckAt + 1;
    setStone(next, seq[next]);
    speak(String(seq[next]));
    hopDuck(next, () => {
      duckAt = next;
      hopping = false;
      if (duckAt === N_STONES - 1) {
        // crossed! one last hop up onto the far bank
        locked = true;
        hopAnim = { from: duck.position.clone(), to: new THREE.Vector3(stones[N_STONES - 1].position.x, 0.35, -5.9), t: 0, dur: 0.6, done: null };
        quack();
        score++; streak++; scoreEl.textContent = score;
        roundHistory.push(true);
        if (streak > 0 && streak % 3 === 0 && level < LEVELS.length - 1) level++;
        if (roundHistory.length > 5) roundHistory = [roundHistory[roundHistory.length - 1]];
        updateStreakBar();
        promptEl.innerHTML = 'You crossed the river! 🎉';
        speak('You counted by ' + k + 's all the way to ' + seq[N_STONES - 1] + '!');
        successSound(); confetti(); sparkleBurst();
        setTimeout(newCrossing, 2800);
      } else {
        target = seq[duckAt + 1];
        renderChoices();
        promptEl.innerHTML = 'Count by <b>' + k + 's</b>! What comes after <b>' + seq[duckAt] + '</b>?';
      }
    });
  } else {
    btn.classList.add('wrong');
    boop();
    streak = 0; roundHistory.push(false);
    if (roundHistory.length > 5) roundHistory = [roundHistory[roundHistory.length - 1]];
    updateStreakBar();
    setTimeout(() => btn.classList.remove('wrong'), 450);
  }
}

/* ============================================================
   RENDER LOOP
   ============================================================ */
const clock = new THREE.Clock();
function frameScene() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  const aspect = w / h; camera.aspect = aspect;
  const vHalf = THREE.MathUtils.degToRad(camera.fov / 2);
  const hHalf = Math.atan(Math.tan(vHalf) * aspect);
  const dist = Math.min(30, Math.max(9, Math.max(4.2 / Math.tan(hHalf), 5.1 / Math.tan(vHalf))));
  camera.position.copy(camTarget).add(camDir.clone().multiplyScalar(dist));
  camera.lookAt(camTarget);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', frameScene);

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.getElapsedTime();

  if (hopAnim) {
    hopAnim.t += dt;
    const p = Math.min(1, hopAnim.t / hopAnim.dur);
    const e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
    duck.position.lerpVectors(hopAnim.from, hopAnim.to, e);
    duck.position.y += Math.sin(p * Math.PI) * 1.0;
    if (p >= 1) { duck.position.copy(hopAnim.to); const d = hopAnim.done; hopAnim = null; d && d(); }
  } else {
    duck.position.y = 0.35 + Math.sin(t * 2.4) * 0.03;
  }

  // gentle stone bob (they're stepping stones — just tiny)
  for (const s of stones) s.position.y = 0.16 + Math.sin(t * 0.9 + s.userData.phase) * 0.015;

  renderer.render(scene, camera);
}

/* ============================================================
   LEVEL PICKER
   ============================================================ */
window.toggleLevelPicker = function () {
  const p = document.getElementById('level-picker');
  if (p.classList.contains('open')) { p.classList.remove('open'); return; }
  p.innerHTML = '';
  LEVELS.forEach((lv, i) => {
    const o = document.createElement('div'); o.className = 'level-option' + (i === level ? ' active' : '');
    o.innerHTML = '<span>' + lv.name + '</span><span class="level-range">' + (lv.k ? 'by ' + lv.k : '2s 5s 10s') + '</span>';
    o.onclick = (e) => { e.stopPropagation(); level = i; streak = 0; roundHistory = []; updateStreakBar(); p.classList.remove('open'); newCrossing(); };
    p.appendChild(o);
  });
  p.classList.add('open');
};
document.addEventListener('click', (e) => { if (!e.target.closest('.level-picker') && !e.target.closest('.level-badge')) document.getElementById('level-picker').classList.remove('open'); });

// Start
frameScene();
newCrossing();
animate();
</script>
